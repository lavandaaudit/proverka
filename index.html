<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IBONARIUM · HUB</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-y: scroll;
        }

        body {
            background: var(--bg);
            overflow-x: hidden;
            font-family: 'Outfit', sans-serif;
        }

        .hub-container {
            width: 100%;
        }

        section {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            overflow: hidden;
        }

        /* ЄДИНИЙ ГЛОБАЛЬНИЙ СКРОЛ */

        body::-webkit-scrollbar {
            width: 6px;
        }

        body::-webkit-scrollbar-track {
            background: #050505;
        }

        body::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            section {
                height: 100svh;
            }

            iframe {
                transform: scale(1);
                transform-origin: top center;
            }
        }
    </style>
</head>

<body>

    <div class="hub-container">

        <!-- PAGE 1 -->
        <section>
            <iframe
                src="https://lavandaaudit.github.io/ibonarium.sanset.now/"
                scrolling="no">
            </iframe>
        </section>

        <!-- PAGE 2 -->
        <section>
            <iframe
                src="https://lavandaaudit.github.io/tele.lab.telescope/"
                scrolling="no">
            </iframe>
        </section>

        <!-- PAGE 3 -->
        <section>
            <iframe
                src="https://lavandaaudit.github.io/all0505/"
                scrolling="no">
            </iframe>
        </section>

    </div>

</body>
</html>
