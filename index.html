<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ibonarium flow</title>

<style>

/* ====================================== */
/* RESET */
/* ====================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  overflow-x:hidden;
  font-family:Arial,sans-serif;
  scroll-behavior:smooth;
}

/* ====================================== */
/* FIX START */
/* ====================================== */

body{
  position:relative;
}

/* ====================================== */
/* PAGE 1 */
/* ====================================== */

.hero-section{

  position:relative;

  width:100%;
  height:100vh;

  min-height:100vh;
  max-height:100vh;

  overflow:hidden;

  background:#000;

}

/* HARD FIXED CONTENT */

.hero-content{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

}

/* EMBED */

.hero-content iframe,
.hero-content object{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  border:none;

  display:block;

}

/* ====================================== */
/* FADE */
/* ====================================== */

.hero-section::after{

  content:"";

  position:absolute;

  left:0;
  bottom:0;

  width:100%;
  height:120px;

  pointer-events:none;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0),
    rgba(0,0,0,0.45),
    #000
  );

  z-index:20;

}

/* ====================================== */
/* PAGE 2 */
/* ====================================== */

.page2{

  position:relative;

  width:100%;

  background:#000;

}

#museumFrame{

  width:100%;
  height:2200px;

  border:none;

  display:block;

  background:#000;

}

/* ====================================== */
/* SIDE PANEL */
/* ====================================== */

.side-panel{

  position:fixed;

  right:18px;
  top:50%;

  transform:translateY(-50%);

  z-index:99999;

  display:flex;
  flex-direction:column;

  gap:12px;

}

/* ====================================== */
/* BUTTONS */
/* ====================================== */

.nav-btn{

  width:42px;
  height:42px;

  border-radius:50%;

  border:1px solid rgba(0,255,255,0.35);

  background:rgba(0,0,0,0.72);

  color:#8ffcff;

  font-size:14px;
  font-weight:bold;

  cursor:pointer;

  backdrop-filter:blur(8px);

  transition:0.25s ease;

}

.nav-btn:hover{

  transform:scale(1.08);

  background:rgba(0,255,255,0.12);

  box-shadow:
    0 0 18px rgba(0,255,255,0.4);

}

/* ====================================== */
/* MOBILE */
/* ====================================== */

@media(max-width:900px){

  .hero-section{

    height:100svh;
    min-height:100svh;
    max-height:100svh;

  }

  #museumFrame{

    height:2600px;

  }

  .side-panel{

    right:10px;

  }

}

</style>
</head>

<body>

<!-- ====================================== -->
<!-- SIDE NAV -->
<!-- ====================================== -->

<div class="side-panel">

  <button
    class="nav-btn"
    onclick="goPage1()">
    1
  </button>

  <button
    class="nav-btn"
    onclick="goPage2()">
    2
  </button>

</div>

<!-- ====================================== -->
<!-- PAGE 1 -->
<!-- ====================================== -->

<section
  id="page1"
  class="hero-section">

  <div class="hero-content">

    <iframe
      src="https://lavandaaudit.github.io/tv.2/"
      loading="eager"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>

  </div>

</section>

<!-- ====================================== -->
<!-- PAGE 2 -->
<!-- ====================================== -->

<section
  id="page2"
  class="page2">

  <iframe
    id="museumFrame"
    src="https://lavandaaudit.github.io/history.musem.ibonarium/"
    loading="lazy"
    allowfullscreen>
  </iframe>

</section>

<script>

/* ======================================
   DISABLE RESTORE
====================================== */

if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

/* ======================================
   HARD START TOP
====================================== */

function forceTop(){

  window.scrollTo(0,0);

  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;

}

/* instantly */

forceTop();

/* dom */

document.addEventListener(
  'DOMContentLoaded',
  forceTop
);

/* load */

window.addEventListener('load', () => {

  forceTop();

  setTimeout(forceTop,100);
  setTimeout(forceTop,300);
  setTimeout(forceTop,700);
  setTimeout(forceTop,1200);

});

/* cache restore */

window.addEventListener(
  'pageshow',
  forceTop
);

/* ======================================
   TEMP LOCK
====================================== */

document.documentElement.style.overflow='hidden';
document.body.style.overflow='hidden';

setTimeout(() => {

  document.documentElement.style.overflowY='auto';
  document.body.style.overflowY='auto';

  forceTop();

},2000);

/* ======================================
   NAVIGATION
====================================== */

function goPage1(){

  document
    .getElementById('page1')
    .scrollIntoView({
      behavior:'smooth'
    });

}

function goPage2(){

  document
    .getElementById('page2')
    .scrollIntoView({
      behavior:'smooth'
    });

}

/* ======================================
   ADAPTIVE HEIGHT
====================================== */

const museumFrame =
  document.getElementById('museumFrame');

function adaptiveMuseumHeight(){

  if(window.innerWidth < 900){

    museumFrame.style.height = '2600px';

  }else{

    museumFrame.style.height = '2200px';

  }

}

adaptiveMuseumHeight();

window.addEventListener(
  'resize',
  adaptiveMuseumHeight
);

</script>

</body>
</html>
