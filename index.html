<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ibonarium flow</title>

<style>

/* ========================================= */
/* RESET */
/* ========================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

html,
body{
  width:100%;
  background:#000;
  overflow-x:hidden;
  font-family:Arial,sans-serif;
}

/* ========================================= */
/* SECTIONS */
/* ========================================= */

.section{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#000;
}

/* ========================================= */
/* PAGE 1 */
/* ========================================= */

#page1{
  height:100vh;
}

#page1 object{
  width:100%;
  height:100%;
  border:none;
  display:block;
}

/* ========================================= */
/* PAGE 2 */
/* ========================================= */

#museumFrame{
  width:100%;
  height:2200px;
  border:none;
  display:block;
  background:#000;
}

/* ========================================= */
/* FADE */
/* ========================================= */

.fade::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-1px;
  width:100%;
  height:120px;
  pointer-events:none;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0),
    rgba(0,0,0,0.45),
    #000
  );

  z-index:10;
}

/* ========================================= */
/* SIDE PANEL */
/* ========================================= */

.side-panel{
  position:fixed;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  z-index:9999;

  display:flex;
  flex-direction:column;
  gap:12px;
}

/* ========================================= */
/* BUTTONS */
/* ========================================= */

.nav-btn{
  width:42px;
  height:42px;

  border-radius:50%;

  border:1px solid rgba(0,255,255,0.35);

  background:rgba(0,0,0,0.6);

  color:#7ffcff;

  font-size:14px;
  font-weight:bold;

  cursor:pointer;

  backdrop-filter:blur(8px);

  transition:0.25s ease;

  box-shadow:
    0 0 12px rgba(0,255,255,0.15);
}

.nav-btn:hover{

  transform:scale(1.08);

  background:rgba(0,255,255,0.12);

  box-shadow:
    0 0 18px rgba(0,255,255,0.4);

}

/* ========================================= */
/* MOBILE */
/* ========================================= */

@media(max-width:900px){

  #page1{
    height:100svh;
  }

  #museumFrame{
    height:2600px;
  }

  .side-panel{
    right:10px;
  }

  .nav-btn{
    width:38px;
    height:38px;
    font-size:13px;
  }

}

</style>
</head>

<body>

<!-- ========================================= -->
<!-- SIDE NAVIGATION -->
<!-- ========================================= -->

<div class="side-panel">

  <button class="nav-btn" onclick="goPage1()">1</button>

  <button class="nav-btn" onclick="goPage2()">2</button>

</div>

<!-- ========================================= -->
<!-- PAGE 1 -->
<!-- ========================================= -->

<section
  id="page1"
  class="section fade">

  <object
    data="https://lavandaaudit.github.io/tv.2/"
    type="text/html">
  </object>

</section>

<!-- ========================================= -->
<!-- PAGE 2 -->
<!-- ========================================= -->

<section
  id="page2"
  class="section">

  <iframe
    id="museumFrame"
    src="https://lavandaaudit.github.io/history.musem.ibonarium/"
    loading="lazy"
    allowfullscreen>
  </iframe>

</section>

<script>

/* =========================================
   DISABLE RESTORE
========================================= */

if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

/* =========================================
   FORCE START TOP
========================================= */

function forceTop(){

  window.scrollTo({
    top:0,
    left:0,
    behavior:'auto'
  });

}

/* =========================================
   START FIX
========================================= */

forceTop();

document.addEventListener('DOMContentLoaded', forceTop);

window.addEventListener('load', () => {

  forceTop();

  setTimeout(forceTop,100);
  setTimeout(forceTop,300);
  setTimeout(forceTop,700);

});

window.addEventListener('pageshow', forceTop);

/* =========================================
   TEMP LOCK
========================================= */

document.documentElement.style.overflow = 'hidden';
document.body.style.overflow = 'hidden';

setTimeout(() => {

  document.documentElement.style.overflowY = 'auto';
  document.body.style.overflowY = 'auto';

  forceTop();

},1800);

/* =========================================
   NAVIGATION
========================================= */

function goPage1(){

  document.getElementById('page1').scrollIntoView({
    behavior:'smooth'
  });

}

function goPage2(){

  document.getElementById('page2').scrollIntoView({
    behavior:'smooth'
  });

}

/* =========================================
   ADAPTIVE HEIGHT
========================================= */

const museumFrame = document.getElementById('museumFrame');

function adaptiveMuseumHeight(){

  if(window.innerWidth < 900){

    museumFrame.style.height = '2600px';

  }else{

    museumFrame.style.height = '2200px';

  }

}

adaptiveMuseumHeight();

window.addEventListener('resize', adaptiveMuseumHeight);

</script>

</body>
</html>
