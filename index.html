<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LABORANT2</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  font-family: "Courier New", monospace;
  overflow-x: hidden;
}

/* Контейнер сторінки */
.wrapper {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* Основна верхня частина сторінки */
.top-section {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffd166;
  font-size: 18px;
  text-align: center;
  padding: 20px;
}

/* Нижній iframe */
.bottom-section {
  height: 50%;
}

.bottom-section iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>
<body>

<div class="wrapper">

  <!-- ВЕРХНЯ СЕКЦІЯ (порожня або текст/контент) -->
  <div class="top-section">
    Лабораторія LABORANT2
  </div>

  <!-- НИЖНЯ СЕКЦІЯ: сторінка new13 -->
  <div class="bottom-section">
    <iframe src="https://lavandaaudit.github.io/new13/" title="NEW13"></iframe>
  </div>

</div>

</body>
</html>
