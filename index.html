<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONIRIUM · EXP-03 · Resonant Galaxies</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
}
canvas{position:fixed;inset:0}
#info{
  position:fixed;
  bottom:12px;left:12px;
  font-family:monospace;
  font-size:12px;
  color:#d4fff0;
  opacity:.85;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<canvas id="scene"></canvas>

<div id="info">
<b>IBONIRIUM · GALACTIC FIELD</b><br>
mode: resonant cores<br>
dimension: pseudo-3D
</div>

<script>
const starsC = document.getElementById('stars');
const sceneC = document.getElementById('scene');
const sctx = starsC.getContext('2d');
const ctx = sceneC.getContext('2d');

function resize(){
  starsC.width = sceneC.width = innerWidth;
  starsC.height = sceneC.height = innerHeight;
}
addEventListener('resize', resize);
resize();

/* ---------- STARS (DEPTH) ---------- */
const stars = Array.from({length:460},()=>({
  x:Math.random(), y:Math.random(),
  z:Math.random()*0.9+0.1
}));

function drawStars(){
  sctx.clearRect(0,0,starsC.width,starsC.height);
  stars.forEach(st=>{
    sctx.globalAlpha = 0.1 + st.z*0.5;
    sctx.fillStyle="#fff";
    sctx.beginPath();
    sctx.arc(
      st.x*starsC.width,
      st.y*starsC.height,
      st.z*1.8,
      0,Math.PI*2
    );
    sctx.fill();
  });
  sctx.globalAlpha = 1;
}

/* ---------- FIELD TIME ---------- */
const T = ()=>Date.now()*0.0001;

/* ---------- PALETTE ---------- */
const PALETTE=[
  'rgba(255,200,150,',
  'rgba(180,230,255,',
  'rgba(210,190,255,',
  'rgba(255,180,220,',
  'rgba(180,255,220,'
];

/* ---------- NEBULA ---------- */
class Nebula{
  constructor(radius){
    this.a=Math.random()*Math.PI*2;
    this.r=radius*(0.7+Math.random()*0.9);
    this.s=0.00015+Math.random()*0.0002;
    this.z=Math.random()*0.7+0.3;
    this.size=16+Math.random()*30;
    this.col=PALETTE[Math.floor(Math.random()*PALETTE.length)];
  }
  update(influence){
    this.a += this.s*this.z*(1+influence*0.8);
  }
  draw(cx,cy,pulse){
    const x=cx+Math.cos(this.a)*this.r*pulse;
    const y=cy+Math.sin(this.a)*this.r*pulse;
    ctx.globalAlpha=0.06+this.z*0.25;
    ctx.fillStyle=this.col+(0.4*this.z)+')';
    ctx.beginPath();
    ctx.arc(x,y,this.size*this.z,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }
}

/* ---------- GALAXY ---------- */
class Galaxy{
  constructor(x,y){
    this.baseX=x; this.baseY=y;
    this.z=Math.random()*0.7+0.3;
    this.mass=0.6+Math.random()*1.2;
    this.radius=(90+Math.random()*70)*this.z;
    this.spin=(0.00012+Math.random()*0.00018)*this.z;
    this.angle=Math.random()*Math.PI*2;
    this.phase=Math.random()*Math.PI*2;
    this.col=PALETTE[Math.floor(Math.random()*PALETTE.length)]+'0.75)';
    this.arms=3+Math.floor(Math.random()*3);

    /* ядро */
    this.coreAngle=Math.random()*Math.PI*2;
    this.coreOrbit=6+Math.random()*10;
    this.corePulse=Math.random()*Math.PI*2;

    this.nebulae=Array.from(
      {length:10+Math.floor(Math.random()*6)},
      ()=>new Nebula(this.radius*1.2)
    );
  }

  position(others){
    let fx=0, fy=0;
    others.forEach(o=>{
      if(o===this) return;
      const dx=o.baseX-this.baseX;
      const dy=o.baseY-this.baseY;
      const d=Math.hypot(dx,dy)+80;
      const f=(o.mass*this.mass)/(d*d);
      fx+=dx/d*f;
      fy+=dy/d*f;
    });
    const breath=Math.sin(T()+this.phase);
    return {
      x:this.baseX+fx*120*this.z+Math.cos(this.phase)*breath*140*this.z,
      y:this.baseY+fy*120*this.z+Math.sin(this.phase)*breath*140*this.z
    };
  }

  update(){
    this.angle+=this.spin;
    this.coreAngle+=this.spin*1.6;
    this.corePulse+=0.02;
  }

  draw(pos,field){
    const pulse=1+Math.sin(this.corePulse)*0.25+field*0.15;

    /* nebulae */
    this.nebulae.forEach(n=>{
      n.update(field);
      n.draw(pos.x,pos.y,pulse);
    });

    /* arms */
    ctx.strokeStyle=this.col;
    ctx.lineWidth=1*this.z;
    ctx.shadowColor=this.col;
    ctx.shadowBlur=16*this.z;

    for(let a=0;a<this.arms;a++){
      ctx.beginPath();
      for(let i=0;i<170;i++){
        const t=i/170;
        const r=this.radius*t*pulse;
        const ang=t*5*Math.PI+this.angle+a*(Math.PI*2/this.arms);
        const x=pos.x+Math.cos(ang)*r;
        const y=pos.y+Math.sin(ang)*r;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.stroke();
    }

    /* ядро – орбітальне */
    const cx=pos.x+Math.cos(this.coreAngle)*this.coreOrbit*pulse;
    const cy=pos.y+Math.sin(this.coreAngle)*this.coreOrbit*pulse;

    ctx.shadowBlur=28*this.z;
    ctx.fillStyle=this.col;
    ctx.beginPath();
    ctx.arc(cx,cy,7*this.z*pulse,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }
}

/* ---------- SYSTEM ---------- */
const galaxies=Array.from({length:6},()=>new Galaxy(
  innerWidth*0.25+Math.random()*innerWidth*0.5,
  innerHeight*0.25+Math.random()*innerHeight*0.5
));

/* ---------- LOOP ---------- */
function loop(){
  drawStars();
  ctx.clearRect(0,0,sceneC.width,sceneC.height);

  galaxies.forEach(g=>{
    const pos=g.position(galaxies);
    const field=galaxies.reduce((a,o)=>{
      if(o===g) return a;
      const d=Math.hypot(o.baseX-g.baseX,o.baseY-g.baseY);
      return a+o.mass/(d*d);
    },0);

    g.update();
    g.draw(pos,field);
  });

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
