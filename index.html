<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM LAB DASHBOARD</title>

<style>

body{
    margin:0;
    background:#03060b;
    color:#e6edf3;
    font-family:Arial, Helvetica, sans-serif;
}

/* HEADER */

.header{
    padding:15px;
    background:#070d18;
    text-align:center;
    border-bottom:1px solid #0f1a2b;
}

.header h1{
    margin:0;
    font-size:20px;
    letter-spacing:2px;
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns: 1fr 300px;
    height: calc(100vh - 60px);
}

@media(max-width:900px){
    .dashboard{
        grid-template-columns: 1fr;
    }
}

/* CANVAS */

.canvasWrap{
    position:relative;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

/* SIDE PANEL */

.panel{
    background:#050b16;
    border-left:1px solid #0f1a2b;
    padding:15px;
}

.metric{
    background:#081224;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

.metric h3{
    margin:0 0 5px 0;
    font-size:14px;
    color:#58a6ff;
}

.metric div{
    font-size:18px;
}

/* FOOTER */

.footer{
    position:absolute;
    bottom:10px;
    left:10px;
    font-size:12px;
    opacity:0.4;
}

</style>
</head>

<body>

<div class="header">
<h1>IBONARIUM · LIVE GEOMETRIC LAB</h1>
</div>

<div class="dashboard">

<div class="canvasWrap">
<canvas id="simCanvas"></canvas>
<div class="footer">IBONARIUM Geometric Engine · Live State Trajectory</div>
</div>

<div class="panel">

<div class="metric">
<h3>Geometric Energy</h3>
<div id="energy">0</div>
</div>

<div class="metric">
<h3>Curvature</h3>
<div id="curvature">0</div>
</div>

<div class="metric">
<h3>Phase Risk</h3>
<div id="risk">0</div>
</div>

<div class="metric">
<h3>Trajectory Speed</h3>
<div id="speed">0</div>
</div>

</div>

</div>

<script>

const canvas = document.getElementById("simCanvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
}
window.addEventListener("resize", resize);
resize();

/* ===== STATE MODEL ===== */

let state = {x:0, y:0};
let prevState = {x:0, y:0};

let trajectory = [];

let t = 0;

/* ===== METRIC MATRIX (SIMPLIFIED) ===== */

let metric = [
    [1, 0.2],
    [0.2, 1]
];

/* ===== UPDATE STATE ===== */

function updateState(){

    prevState = {...state};

    state.x = Math.sin(t*0.7) + Math.sin(t*0.2)*0.5;
    state.y = Math.cos(t*0.5) + Math.sin(t*0.9)*0.3;

    trajectory.push({...state});
    if(trajectory.length > 200) trajectory.shift();

    t += 0.02;
}

/* ===== METRICS ===== */

function geometricEnergy(){
    return (
        metric[0][0]*state.x*state.x +
        metric[1][1]*state.y*state.y +
        metric[0][1]*state.x*state.y
    );
}

function curvatureIndicator(){
    return Math.abs(metric[0][1]);
}

function speed(){
    return Math.sqrt(
        (state.x-prevState.x)**2 +
        (state.y-prevState.y)**2
    );
}

function phaseRisk(){
    return curvatureIndicator()*0.6 + speed()*0.4;
}

/* ===== DRAW ===== */

function draw(){

    ctx.fillStyle="rgba(3,6,11,0.25)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    let cx = canvas.width/2;
    let cy = canvas.height/2;
    let scale = Math.min(cx,cy)*0.6;

    /* TRAJECTORY */

    ctx.beginPath();
    trajectory.forEach((p,i)=>{
        let x = cx + p.x*scale;
        let y = cy + p.y*scale;

        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    });
    ctx.strokeStyle="rgba(88,166,255,0.6)";
    ctx.lineWidth=2;
    ctx.stroke();

    /* CURRENT POINT */

    ctx.beginPath();
    ctx.arc(
        cx + state.x*scale,
        cy + state.y*scale,
        6,0,Math.PI*2
    );
    ctx.fillStyle="#58a6ff";
    ctx.fill();
}

/* ===== LOOP ===== */

function loop(){

    updateState();
    draw();

    document.getElementById("energy").innerText =
        geometricEnergy().toFixed(3);

    document.getElementById("curvature").innerText =
        curvatureIndicator().toFixed(3);

    document.getElementById("risk").innerText =
        phaseRisk().toFixed(3);

    document.getElementById("speed").innerText =
        speed().toFixed(3);

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
