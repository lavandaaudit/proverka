<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IBONIRIUM · Final Singularity · v38.2</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%;
  height:100%;
  background:#000;
  font-family:'JetBrains Mono', monospace;
  color:#fff;
}

/* ================= FIXED LAYERS (ALWAYS VISIBLE) ================= */
canvas {
  position:fixed;
  inset:0;
  z-index:1;
}

#stars { opacity:0.5; }
#galaxy-canvas {
  z-index:2;
  cursor:grab;
}
#galaxy-canvas:active { cursor:grabbing; }

/* HUD */
#main-hud {
  position:fixed;
  top:40px;
  left:80px;
  z-index:5;
  max-width:320px;
  pointer-events:none;
}

.lab-title {
  font-size:11px;
  font-weight:700;
  letter-spacing:3px;
  color:#00ffff;
  border-bottom:1px solid rgba(0,255,255,.2);
  padding-bottom:4px;
}

.description-block {
  font-size:7px;
  line-height:1.6;
  color:#9affc2;
  opacity:.7;
  margin-top:8px;
}

.data-row {
  font-size:8px;
  display:flex;
  justify-content:space-between;
  margin-top:4px;
}

.label { color:rgba(0,255,255,.4); }
.val { color:#fff; font-weight:bold; }

/* NAV */
#navigation-controls {
  position:fixed;
  bottom:30px;
  right:30px;
  z-index:5;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.zoom-btn {
  width:36px;
  height:36px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.4);
  cursor:pointer;
}

/* ================= SCROLL STACK ================= */
#scroll-stack {
  position:relative;
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  z-index:10;
}

/* EACH SCREEN */
.section {
  height:100vh;
  width:100%;
  scroll-snap-align:start;
  background:transparent;
}

/* GALAKTIKA */
iframe {
  width:100%;
  height:100%;
  border:none;
  background:#000;
}

/* MOBILE */
@media (max-width:768px) {
  #main-hud {
    left:16px;
    top:16px;
    max-width:240px;
  }
}
</style>
</head>

<body>

<!-- ===== FIXED SYSTEM ===== -->
<canvas id="stars"></canvas>
<canvas id="galaxy-canvas"></canvas>

<div id="main-hud">
  <div class="lab-title">LAB_IBONIRIUM_EXP_01</div>
  <div class="description-block">
    АВТОНОМНА СИМУЛЯЦІЯ СІНГУЛЯРНОСТІ.  
    СТАН ФОРМУЄТЬСЯ В РЕАЛЬНОМУ ЧАСІ.
  </div>
  <div class="data-row"><span class="label">PHASE</span><span class="val">13/26</span></div>
  <div class="data-row"><span class="label">ENTROPY</span><span class="val">72%</span></div>
</div>

<div id="navigation-controls">
  <div class="zoom-btn" onclick="adjustZoom(0.3)">+</div>
  <div class="zoom-btn" onclick="adjustZoom(-0.3)">−</div>
</div>

<!-- ===== SCROLL DIMENSIONS ===== -->
<div id="scroll-stack">

  <!-- SCREEN 1 — EMPTY, BUT ACTIVE (CANVAS WORLD) -->
  <section class="section"></section>

  <!-- SCREEN 2 — GALAKTIKA -->
  <section class="section">
    <iframe
      src="https://lavandaaudit.github.io/galaktika/"
      loading="lazy">
    </iframe>
  </section>

</div>

<script type="module" src="main.js"></script>
</body>
</html>
