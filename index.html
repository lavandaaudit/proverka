<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM · SOLAR TENSION</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#05070b;
  overflow:hidden;
  font-family: monospace;
  color:#9fb3ff;
}

#field{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 50%, rgba(40,80,120,0.15), transparent 60%),
    radial-gradient(circle at 70% 50%, rgba(120,40,80,0.12), transparent 60%);
  filter: blur(0px);
  transition: filter 2s linear;
}

/* ЛІВИЙ ВИМІР */
#cause{
  position:absolute;
  left:0;
  top:0;
  width:40vw;
  height:100vh;
  padding:20px;
  box-sizing:border-box;
  opacity:0.9;
}

.line{
  height:1px;
  background:linear-gradient(90deg, transparent, #6fa8ff, transparent);
  margin:18px 0;
  transform-origin:left;
}

/* ПРАВИЙ ВИМІР */
#effect{
  position:absolute;
  right:0;
  top:0;
  width:60vw;
  height:100vh;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

/* ПІДПИС */
#label{
  position:absolute;
  bottom:10px;
  left:20px;
  font-size:11px;
  opacity:0.4;
}
</style>
</head>

<body>

<div id="field"></div>

<div id="cause">
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
</div>

<div id="effect">
  <canvas id="cosmos"></canvas>
</div>

<div id="label">IBONARIUM · The Sun Is Not Shown</div>

<script>
/* ===== CANVAS ===== */
const canvas = document.getElementById("cosmos");
const ctx = canvas.getContext("2d");
let w,h;
function resize(){
  w=canvas.width=canvas.clientWidth;
  h=canvas.height=canvas.clientHeight;
}
window.addEventListener("resize",resize);
resize();

/* ===== PARTS ===== */
const particles=[];
for(let i=0;i<400;i++){
  particles.push({
    a:Math.random()*Math.PI*2,
    r:Math.random()*200+40,
    s:Math.random()*0.3+0.05
  });
}

/* ===== SOLAR STATE ===== */
let solar={
  wind:300,
  xray:1,
  f107:70
};

/* ===== DRAW ===== */
let t=0;
function draw(){
  t+=0.003*(solar.xray+1);

  ctx.fillStyle="rgba(5,7,11,0.15)";
  ctx.fillRect(0,0,w,h);

  ctx.save();
  ctx.translate(w/2,h/2);

  particles.forEach(p=>{
    p.a+=p.s*(solar.wind/400);
    const rr=p.r*(1+solar.xray*0.15);
    const x=Math.cos(p.a)*rr;
    const y=Math.sin(p.a)*rr;

    ctx.fillStyle=`rgba(${120+solar.f107},${80},${200},0.7)`;
    ctx.fillRect(x,y,1.5,1.5);
  });

  ctx.restore();
  requestAnimationFrame(draw);
}
draw();

/* ===== CAUSE DEFORMATION ===== */
const lines=document.querySelectorAll(".line");
function deform(){
  lines.forEach((l,i)=>{
    const s=1+(solar.wind/800)+(solar.xray*0.4);
    l.style.transform=`scaleX(${s}) rotate(${(solar.f107-70)/20}deg)`;
  });

  document.getElementById("field").style.filter =
    `blur(${solar.xray*2}px)`;
}

/* ===== NOAA DATA ===== */
/* Сонячний вітер */
fetch("https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json")
.then(r=>r.json())
.then(d=>{
  const last=d[d.length-1];
  solar.wind=parseFloat(last[2])||solar.wind;
});

/* X-ray */
fetch("https://services.swpc.noaa.gov/json/goes/primary/xrays-1-day.json")
.then(r=>r.json())
.then(d=>{
  const last=d[d.length-1];
  solar.xray=Math.min(parseFloat(last.flux)||1,5);
});

/* F10.7 */
fetch("https://services.swpc.noaa.gov/json/f107_cm_flux.json")
.then(r=>r.json())
.then(d=>{
  const last=d[d.length-1];
  solar.f107=parseFloat(last.flux)||solar.f107;
});

/* Цикл відчуття */
setInterval(deform,3000);
</script>

</body>
</html>
