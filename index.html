<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM — Геометральна карта</title>

<style>
body{
  margin:0;
  background:#05020a;
  overflow:hidden;
  font-family:monospace;
}

/* Панель зверху */
#panel{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  color:#c0b18a;
  font-size:12px;
  text-align:center;
  backdrop-filter: blur(6px);
  padding:6px 12px;
  border-radius:10px;
  opacity:0.9;
  z-index:5;
  background:rgba(0,0,0,0.2);
}

/* Canvas для карти */
canvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
}
</style>
</head>
<body>

<div id="panel">
IBONARIUM<br>
Solar Wind: <span id="wind">--</span> km/s<br>
Kp Index: <span id="kp">--</span><br>
Bz Field: <span id="bz">--</span> nT
</div>

<canvas id="map"></canvas>

<script>
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// ===== LIVE DATA STATE =====
let state = {wind:400,kp:2,bz:0};

// ===== NODES / SUN SPIRALS =====
let sunNodes = [];
for(let i=0;i<40;i++){
  sunNodes.push({
    a: Math.random()*Math.PI*2,
    r: 50+Math.random()*150,
    speed:0.001+Math.random()*0.001
  });
}

// ===== CONSTELLATIONS / COSMOS =====
let stars = [];
for(let i=0;i<120;i++){
  stars.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height*0.6,
    size: 1+Math.random()*2,
    dx: (Math.random()-0.5)*0.1,
    dy: (Math.random()-0.5)*0.1
  });
}

// ===== EARTH CONTOURS (simple polygon for prototype) =====
let earthContours = [
  [{x:100,y:300},{x:300,y:280},{x:400,y:400},{x:250,y:450},{x:120,y:420}],
  [{x:500,y:150},{x:600,y:200},{x:650,y:300},{x:550,y:250}]
];

// ===== DRAW LOOP =====
function draw(t){
  ctx.fillStyle="rgba(5,2,10,0.25)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // ----- SUN SPIRALS -----
  let cx = canvas.width*0.7;
  let cy = canvas.height*0.3;
  sunNodes.forEach(n=>{
    n.a += n.speed*state.wind/400;
    let x = cx + Math.cos(n.a)*n.r;
    let y = cy + Math.sin(n.a)*n.r;
    ctx.beginPath();
    ctx.arc(x,y,2+state.kp/2,0,Math.PI*2);
    ctx.fillStyle="rgba(255,220,120,0.7)";
    ctx.fill();
  });

  // ----- STARS / COSMOS -----
  stars.forEach(s=>{
    s.x += s.dx;
    s.y += s.dy;
    if(s.x<0 || s.x>canvas.width) s.dx*=-1;
    if(s.y<0 || s.y>canvas.height*0.6) s.dy*=-1;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
    ctx.fillStyle="rgba(180,220,255,0.6)";
    ctx.fill();
  });

  // ----- EARTH CONTOURS -----
  earthContours.forEach(polygon=>{
    ctx.beginPath();
    polygon.forEach((pt,i)=>{
      if(i===0) ctx.moveTo(pt.x,pt.y);
      else ctx.lineTo(pt.x,pt.y);
    });
    ctx.closePath();
    ctx.strokeStyle="rgba(200,180,150,0.7)";
    ctx.lineWidth=2;
    ctx.stroke();
  });

  // ----- TUMBLING FOG -----
  for(let i=0;i<60;i++){
    ctx.beginPath();
    let px = Math.random()*canvas.width;
    let py = Math.random()*canvas.height;
    ctx.arc(px,py,Math.random()*20,0,Math.PI*2);
    ctx.fillStyle=`rgba(50,80,100,0.02)`;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

// ===== LIVE NOAA DATA FETCH =====
async function loadNOAA(){
  try{
    const windRes = await fetch("https://services.swpc.noaa.gov/json/planetary_k_index_1m.json");
    const windData = await windRes.json();
    state.kp = windData[windData.length-1].kp;

    const windSpdRes = await fetch("https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json");
    const windSpdData = await windSpdRes.json();
    state.wind = windSpdData[windSpdData.length-1].speed;

    const magRes = await fetch("https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json");
    const magData = await magRes.json();
    state.bz = magData[magData.length-1].bz;

    document.getElementById("wind").textContent = state.wind.toFixed(0);
    document.getElementById("kp").textContent = state.kp.toFixed(1);
    document.getElementById("bz").textContent = state.bz.toFixed(1);

  }catch(e){ console.log("NOAA error",e); }
}

loadNOAA();
setInterval(loadNOAA,60000);
</script>

</body>
</html>
