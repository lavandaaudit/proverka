<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>IBONARIUM · AGRO-FIELD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #0b0f14, #000);
  color: #e6e6e6;
  font-family: "Segoe UI", monospace;
}

header {
  padding: 20px;
  border-bottom: 1px solid #222;
}

h1 {
  font-size: 24px;
  letter-spacing: 2px;
}

h1 span {
  color: #4cff9b;
}

.controls {
  padding: 20px;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

select {
  background: #000;
  color: #4cff9b;
  border: 1px solid #333;
  padding: 10px;
}

.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: rgba(10, 15, 20, 0.85);
  border: 1px solid #1f2a33;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 0 40px rgba(76,255,155,0.05);
}

.card h2 {
  font-size: 14px;
  letter-spacing: 1px;
  color: #4cff9b;
  margin-bottom: 10px;
}

footer {
  padding: 20px;
  font-size: 12px;
  opacity: 0.6;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <h1>IBONARIUM <span>AGRO-FIELD</span></h1>
  <div style="font-size:12px;opacity:0.7">
    Продовольство · Калорії · Земля · Викиди · Час
  </div>
</header>

<div class="controls">
  <label>
    Країна:
    <select id="country">
      <option value="840">USA</option>
      <option value="804">Ukraine</option>
      <option value="156">China</option>
      <option value="356">India</option>
      <option value="250">France</option>
    </select>
  </label>
</div>

<div class="dashboard">
  <div class="card">
    <h2>🌾 Виробництво зерна (тонни)</h2>
    <canvas id="productionChart"></canvas>
  </div>

  <div class="card">
    <h2>🍞 Калорії на душу (ккал/день)</h2>
    <canvas id="caloriesChart"></canvas>
  </div>

  <div class="card">
    <h2>🌡 Агровикиди CO₂eq</h2>
    <canvas id="emissionsChart"></canvas>
  </div>

  <div class="card">
    <h2>🌀 Ібонаріум-інтерпретація</h2>
    <div id="analysis" style="font-size:13px;line-height:1.5;"></div>
  </div>
</div>

<footer>
  Дані: FAOSTAT (FAO UN) · IBONARIUM EXP-AGRO-01
</footer>

<script>
const YEARS = [2010,2012,2014,2016,2018,2020];

const productionChart = new Chart(
  document.getElementById('productionChart'),
  {
    type: 'line',
    data: { labels: YEARS, datasets: [] },
    options: {
      plugins:{legend:{display:false}},
      scales:{y:{ticks:{color:'#4cff9b'},x:{ticks:{color:'#4cff9b'}}}}
    }
  }
);

const caloriesChart = new Chart(
  document.getElementById('caloriesChart'),
  {
    type: 'line',
    data: { labels: YEARS, datasets: [] },
    options: {
      plugins:{legend:{display:false}},
      scales:{y:{ticks:{color:'#ffd479'},x:{ticks:{color:'#ffd479'}}}}
    }
  }
);

const emissionsChart = new Chart(
  document.getElementById('emissionsChart'),
  {
    type: 'bar',
    data: { labels: YEARS, datasets: [] },
    options: {
      plugins:{legend:{display:false}},
      scales:{y:{ticks:{color:'#ff6b6b'},x:{ticks:{color:'#ff6b6b'}}}}
    }
  }
);

async function fetchFAO(dataset, item, element, area) {
  const url = `https://fenixservices.fao.org/faostat/api/v1/en/${dataset}?item=${item}&element=${element}&area=${area}`;
  const res = await fetch(url);
  const data = await res.json();
  const values = {};
  data.data.forEach(d => values[d.year] = d.value);
  return YEARS.map(y => values[y] || null);
}

async function update() {
  const area = document.getElementById('country').value;

  const production = await fetchFAO(
    'Production_Crops_Livestock',
    15, // Wheat
    5510,
    area
  );

  const calories = await fetchFAO(
    'Food_Balances',
    2901,
    664,
    area
  );

  const emissions = await fetchFAO(
    'Emissions_Agriculture',
    699,
    7225,
    area
  );

  productionChart.data.datasets = [{
    data: production,
    borderColor: '#4cff9b',
    tension: 0.4
  }];
  productionChart.update();

  caloriesChart.data.datasets = [{
    data: calories,
    borderColor: '#ffd479',
    tension: 0.4
  }];
  caloriesChart.update();

  emissionsChart.data.datasets = [{
    data: emissions,
    backgroundColor: '#ff6b6b'
  }];
  emissionsChart.update();

  document.getElementById('analysis').innerHTML = `
  Ця країна формує <b>аграрне поле напруги</b>, де:
  <ul>
    <li>🌾 виробництво = стабілізація</li>
    <li>🍞 калорії = енергетична насиченість</li>
    <li>🌡 викиди = тиск на біосферу</li>
  </ul>
  Ібонаріум показує: зростання їжі не дорівнює зменшенню хаосу.
  `;
}

document.getElementById('country').addEventListener('change', update);
update();
</script>

</body>
</html>
