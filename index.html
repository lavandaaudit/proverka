<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>MEGACITY 175 — STREET VIEW PORTAL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:'Inter',sans-serif;
color:white;
}

/* ===== MAIN ===== */

.main{
display:flex;
width:100%;
height:100vh;
}

/* ===== SIDEBAR ===== */

.sidebar{
width:340px;
height:100%;
background:#050505;
border-right:1px solid rgba(255,255,255,.08);
overflow-y:auto;
padding:22px;
display:flex;
flex-direction:column;
}

/* ===== TITLE ===== */

.title{
font-size:30px;
font-weight:800;
line-height:1;
margin-bottom:12px;
}

.sub{
font-size:12px;
opacity:.55;
line-height:1.7;
margin-bottom:20px;
}

/* ===== SEARCH ===== */

.search{
height:48px;
border:none;
outline:none;
background:#111;
border-radius:14px;
padding:0 16px;
color:white;
font-size:14px;
margin-bottom:18px;
}

/* ===== CITY LIST ===== */

.city-list{
display:flex;
flex-direction:column;
gap:10px;
}

/* ===== CITY ===== */

.city{
background:#111;
border:1px solid rgba(255,255,255,.06);
padding:14px;
border-radius:16px;
cursor:pointer;
transition:.25s;
}

.city:hover{
background:#191919;
transform:translateX(6px);
border-color:rgba(255,255,255,.14);
}

.city-name{
font-weight:700;
font-size:15px;
}

.country{
font-size:12px;
opacity:.55;
margin-top:4px;
}

/* ===== VIEWER ===== */

.viewer{
position:relative;
flex:1;
height:100%;
overflow:hidden;
background:black;
}

.viewer iframe{
width:100%;
height:100%;
border:none;
}

/* ===== OVERLAYS ===== */

.scanlines{
position:absolute;
inset:0;
pointer-events:none;

background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.03) 0px,
rgba(255,255,255,.03) 1px,
transparent 2px,
transparent 4px
);

opacity:.16;
mix-blend-mode:screen;
}

.noise{
position:absolute;
inset:0;
pointer-events:none;
background:
radial-gradient(
circle at center,
transparent 20%,
rgba(0,0,0,.35)
);
}

/* ===== HUD ===== */

.hud{
position:absolute;
top:24px;
right:24px;
width:290px;
background:rgba(0,0,0,.55);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:22px;
z-index:20;
}

.hud-title{
font-size:22px;
font-weight:800;
margin-bottom:16px;
}

.stat{
display:flex;
justify-content:space-between;
margin-bottom:12px;
font-size:13px;
opacity:.82;
}

.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

button{
height:46px;
border:none;
border-radius:12px;
background:#181818;
color:white;
font-weight:600;
cursor:pointer;
transition:.25s;
}

button:hover{
background:#262626;
transform:translateY(-2px);
}

/* ===== STATUS ===== */

.status{
position:absolute;
left:25px;
bottom:25px;
padding:14px 18px;
background:rgba(0,0,0,.5);
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
font-size:13px;
backdrop-filter:blur(10px);
}

/* ===== MOBILE ===== */

@media(max-width:950px){

.main{
flex-direction:column;
}

.sidebar{
width:100%;
height:40%;
}

.viewer{
height:60%;
}

.hud{
width:240px;
}

}

</style>
</head>

<body>

<div class="main">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="title">
MEGACITY 175
</div>

<div class="sub">
3D Street View portal.<br>
Обирай мегаполіс і система автоматично відкриє панораму випадкової вулиці.
</div>

<input
class="search"
type="text"
placeholder="Пошук міста..."
onkeyup="filterCities(this.value)"
>

<div class="city-list" id="cityList"></div>

</div>

<!-- VIEWER -->

<div class="viewer">

<iframe
id="streetFrame"
src=""
allowfullscreen>
</iframe>

<div class="scanlines"></div>
<div class="noise"></div>

<div class="hud">

<div class="hud-title" id="currentCity">
Tokyo
</div>

<div class="stat">
<span>MODE</span>
<span>STREET VIEW</span>
</div>

<div class="stat">
<span>STATUS</span>
<span>ONLINE</span>
</div>

<div class="stat">
<span>CAMERA</span>
<span>LIVE</span>
</div>

<div class="stat">
<span>NODE</span>
<span id="nodeId">001</span>
</div>

<div class="controls">

<button onclick="randomStreet()">
RANDOM
</button>

<button onclick="nextCity()">
NEXT
</button>

<button onclick="nightMode()">
NIGHT
</button>

<button onclick="reloadView()">
RESET
</button>

</div>

</div>

<div class="status" id="statusText">
Connected to Tokyo node...
</div>

</div>

</div>

<script>

/* ===== CITIES ===== */

const cities = [

["Tokyo","Japan"],
["Kyiv","Ukraine"],
["New York","USA"],
["London","UK"],
["Paris","France"],
["Berlin","Germany"],
["Rome","Italy"],
["Madrid","Spain"],
["Barcelona","Spain"],
["Amsterdam","Netherlands"],
["Prague","Czech Republic"],
["Warsaw","Poland"],
["Dubai","UAE"],
["Istanbul","Turkey"],
["Bangkok","Thailand"],
["Singapore","Singapore"],
["Seoul","South Korea"],
["Hong Kong","China"],
["Sydney","Australia"],
["Toronto","Canada"],
["Rio de Janeiro","Brazil"],
["Mexico City","Mexico"],
["Cairo","Egypt"],
["Mumbai","India"],
["Shanghai","China"],
["Los Angeles","USA"],
["Chicago","USA"],
["San Francisco","USA"],
["Miami","USA"],
["Lviv","Ukraine"],
["Odessa","Ukraine"],
["Kharkiv","Ukraine"]

];

/* ===== RANDOM COORDS ===== */

const coords = {

Tokyo:["35.6895","139.6917"],
Kyiv:["50.4501","30.5234"],
"New York":["40.7128","-74.0060"],
London:["51.5072","-0.1276"],
Paris:["48.8566","2.3522"],
Berlin:["52.5200","13.4050"],
Rome:["41.9028","12.4964"],
Madrid:["40.4168","-3.7038"],
Barcelona:["41.3874","2.1686"],
Amsterdam:["52.3676","4.9041"],
Prague:["50.0755","14.4378"],
Warsaw:["52.2297","21.0122"],
Dubai:["25.2048","55.2708"],
Istanbul:["41.0082","28.9784"],
Bangkok:["13.7563","100.5018"],
Singapore:["1.3521","103.8198"],
Seoul:["37.5665","126.9780"],
"Hong Kong":["22.3193","114.1694"],
Sydney:["-33.8688","151.2093"],
Toronto:["43.6532","-79.3832"],
"Rio de Janeiro":["-22.9068","-43.1729"],
"Mexico City":["19.4326","-99.1332"],
Cairo:["30.0444","31.2357"],
Mumbai:["19.0760","72.8777"],
Shanghai:["31.2304","121.4737"],
"Los Angeles":["34.0522","-118.2437"],
Chicago:["41.8781","-87.6298"],
"San Francisco":["37.7749","-122.4194"],
Miami:["25.7617","-80.1918"],
Lviv:["49.8397","24.0297"],
Odessa:["46.4825","30.7233"],
Kharkiv:["49.9935","36.2304"]

};

/* ===== ELEMENTS ===== */

const cityList=document.getElementById('cityList');

const frame=document.getElementById('streetFrame');

let currentIndex=0;

/* ===== RENDER ===== */

function renderCities(list){

cityList.innerHTML='';

list.forEach((city,index)=>{

const div=document.createElement('div');

div.className='city';

div.innerHTML=`
<div class="city-name">${city[0]}</div>
<div class="country">${city[1]}</div>
`;

div.onclick=()=>openStreet(city[0],index);

cityList.appendChild(div);

});

}

renderCities(cities);

/* ===== OPEN STREET VIEW ===== */

function openStreet(city,index){

currentIndex=index;

const lat=coords[city][0];
const lng=coords[city][1];

/* random street offsets */

const randomLat=
(Number(lat)+(Math.random()-.5)/100).toFixed(6);

const randomLng=
(Number(lng)+(Math.random()-.5)/100).toFixed(6);

/* street view */

frame.src=
`https://www.google.com/maps?q=&layer=c&cbll=${randomLat},${randomLng}&cbp=11,0,0,0,0&output=svembed`;

document.getElementById('currentCity').innerText=city;

document.getElementById('nodeId').innerText=
String(index+1).padStart(3,'0');

document.getElementById('statusText').innerText=
`Connected to ${city} street node...`;

}

/* ===== SEARCH ===== */

function filterCities(text){

const filtered=cities.filter(c=>
c[0].toLowerCase().includes(text.toLowerCase())
);

renderCities(filtered);

}

/* ===== RANDOM ===== */

function randomStreet(){

const city=cities[currentIndex][0];

openStreet(city,currentIndex);

}

/* ===== NEXT ===== */

function nextCity(){

currentIndex++;

if(currentIndex>=cities.length){
currentIndex=0;
}

openStreet(
cities[currentIndex][0],
currentIndex
);

}

/* ===== MODES ===== */

function nightMode(){

document.body.style.background='#000';

frame.style.filter=
'brightness(.6) contrast(1.2) saturate(.7)';

}

/* ===== RESET ===== */

function reloadView(){

location.reload();

}

/* ===== START ===== */

openStreet("Tokyo",0);

</script>

</body>
</html>
