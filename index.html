<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ibonarium flow</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:auto;
}

html,body{
  width:100%;
  background:#000;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial,sans-serif;
}

/* ===== FIX SCROLL ===== */

body{
  position:relative;
}

/* ===== SECTIONS ===== */

.section{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#000;
}

/* ===== IFRAMES ===== */

.frame{
  width:100%;
  border:none;
  display:block;
  background:#000;
}

/* ===== PAGE HEIGHTS ===== */

#tvFrame{
  height:100vh;
}

#museumFrame{
  height:2200px;
}

/* ===== SOFT TRANSITION ===== */

.fade::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-1px;
  width:100%;
  height:120px;
  pointer-events:none;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0),
    rgba(0,0,0,0.45),
    #000
  );

  z-index:5;
}

/* ===== MOBILE ===== */

@media(max-width:900px){

  #tvFrame{
    height:100svh;
  }

  #museumFrame{
    height:2600px;
  }

}
</style>
</head>

<body>

<!-- ===== FIRST PAGE ===== -->

<section class="section fade">

  <iframe
    id="tvFrame"
    class="frame"
    src="https://lavandaaudit.github.io/tv.2/"
    loading="eager"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>

</section>

<!-- ===== SECOND PAGE ===== -->

<section class="section">

  <iframe
    id="museumFrame"
    class="frame"
    src="https://lavandaaudit.github.io/history.musem.ibonarium/"
    loading="lazy"
    allowfullscreen>
  </iframe>

</section>

<script>
/* =========================================
   HARD FIX:
   ALWAYS START FROM TOP
   NO AUTO JUMPS
========================================= */

/* disable browser scroll memory */

if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

/* instantly reset BEFORE render */

window.history.replaceState(null, null, window.location.pathname);

document.documentElement.scrollTop = 0;
document.body.scrollTop = 0;

/* lock initial position */

window.addEventListener('beforeunload', () => {
  window.scrollTo(0,0);
});

/* force top after full load */

window.addEventListener('load', () => {

  requestAnimationFrame(() => {

    window.scrollTo(0,0);

    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;

  });

});

/* extra protection from iframe focus jumps */

let lockScroll = false;

window.addEventListener('scroll', () => {

  if(lockScroll){
    window.scrollTo(0,0);
  }

}, { passive:true });

/* stop browser trying to restore position */

window.addEventListener('pageshow', (event) => {

  if(event.persisted){

    lockScroll = true;

    window.scrollTo(0,0);

    setTimeout(() => {
      lockScroll = false;
    }, 300);

  }

});

/* ===== ADAPTIVE HEIGHT ===== */

const museumFrame = document.getElementById("museumFrame");

function adaptiveMuseumHeight(){

  if(window.innerWidth < 900){
    museumFrame.style.height = "2600px";
  }else{
    museumFrame.style.height = "2200px";
  }

}

adaptiveMuseumHeight();

window.addEventListener("resize", adaptiveMuseumHeight);

/* ===== PREVENT VIDEO REFRESH JUMPS ===== */

let lastScroll = 0;

window.addEventListener("scroll", () => {
  lastScroll = window.scrollY;
}, { passive:true });

document.addEventListener("visibilitychange", () => {

  if (!document.hidden) {

    requestAnimationFrame(() => {
      window.scrollTo(0, lastScroll);
    });

  }

});

/* prevent iframe refresh moving page */

const iframe = document.getElementById("tvFrame");

iframe.addEventListener("load", () => {

  const current = window.scrollY;

  requestAnimationFrame(() => {
    window.scrollTo(0, current);
  });

});
</script>

</body>
</html>
