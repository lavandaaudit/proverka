<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LABORANT.AI2 · IBONARIUM</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%;
  height:100%;
  background:#000;
  color:#ffd166;
  font-family:"Courier New",monospace;
  overflow:hidden;
}

canvas {
  position:fixed;
  inset:0;
  z-index:0;
}

.container {
  position:relative;
  z-index:2;
  height:100vh;
  max-width:960px;
  margin:0 auto;
  display:grid;
  grid-template-columns:250px 1fr;
  grid-template-rows:45px 1fr;
  gap:10px;
  padding:10px;
}

.header {
  grid-column:1 / -1;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title {
  font-size:15px;
  letter-spacing:1.8px;
  text-shadow:0 0 14px rgba(255,209,102,.7);
}

.status-bar {
  display:flex;
  gap:10px;
  font-size:9px;
  opacity:.8;
}

.dot {
  width:5px;
  height:5px;
  background:#ffd166;
  border-radius:50%;
  display:inline-block;
  margin-right:4px;
  animation:pulse 1.6s infinite;
}

@keyframes pulse {
  0%,100% {opacity:1}
  50% {opacity:.4}
}

.left-panel {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}

.robot {
  width:160px;
  height:160px;
  position:relative;
}

.head {
  width:98px;
  height:98px;
  border:2px solid #ffd166;
  border-radius:14px;
  position:absolute;
  left:50%;
  top:0;
  transform:translateX(-50%);
  background:linear-gradient(135deg,rgba(255,209,102,.3),rgba(255,209,102,.08));
  box-shadow:0 0 24px rgba(255,209,102,.45);
  animation:float 3s ease-in-out infinite;
}

@keyframes float {
  0%,100% {transform:translate(-50%,0)}
  50% {transform:translate(-50%,-9px)}
}

.eye {
  width:20px;
  height:20px;
  background:#ffd166;
  border-radius:50%;
  position:absolute;
  top:27px;
  box-shadow:0 0 16px #ffd166;
}
.eye.l { left:22px; }
.eye.r { right:22px; }

.mouth {
  width:46px;
  height:2px;
  background:#ffd166;
  position:absolute;
  bottom:23px;
  left:50%;
  transform:translateX(-50%);
}

.body {
  width:82px;
  height:60px;
  border:2px solid #ffd166;
  border-radius:9px;
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,209,102,.15);
  box-shadow:0 0 18px rgba(255,209,102,.4);
}

.robot-name {
  text-align:center;
  letter-spacing:1.4px;
  margin-top:7px;
  font-size:12px;
}

.robot-desc {
  text-align:center;
  font-size:9px;
  opacity:0.65;
  line-height:1.3;
  margin-top:4px;
}

.robot-title {
  font-size:8px;
  opacity:.7;
  text-align:center;
}

.projects {
  margin-top:16px;
  width:100%;
  text-align:center;
}

.projects h4 {
  font-size:10px;
  opacity:.7;
  margin-bottom:8px;
}

.projects a {
  display:block;
  color:#ffd166;
  text-decoration:none;
  font-size:11px;
  padding:4px 0;
}

.chat {
  display:flex;
  flex-direction:column;
  height:100%;
  min-height:0;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,209,102,.18);
  border-radius:5px;
  overflow:hidden;
}

.chat-title {
  text-align:center;
  padding:6px 0;
  font-size:11px;
  border-bottom:1px solid rgba(255,209,102,.15);
}

.messages {
  flex:1;
  overflow-y:auto;
  padding:8px 10px;
  font-size:12px;
}

.msg {
  margin:6px 0;
  padding:5px 9px;
  border-radius:4px;
  max-width:94%;
}

.bot {
  background:rgba(255,209,102,.08);
}

.user {
  background:rgba(170,255,170,.12);
  color:#aaffaa;
  align-self:flex-end;
}

.input-box {
  padding:8px 10px;
  border-top:1px solid rgba(255,209,102,.2);
}

.quick-buttons {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:center;
}

button {
  background:rgba(255,209,102,.2);
  border:1px solid #ffd166;
  color:#ffd166;
  padding:7px 12px;
  font-family:inherit;
}

/* ===== MOBILE FIX ===== */
@media (max-width: 820px) {

  html, body {
    overflow:auto;
    height:auto;
  }

  .container {
    grid-template-columns:1fr;
    grid-template-rows:auto auto 1fr;
    height:auto;
    min-height:100vh;
  }

  .left-panel {
    flex-direction:row;
    flex-wrap:wrap;
    justify-content:center;
  }

  .chat {
    height:65vh;
    min-height:320px;
  }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">
  <div class="header">
    <div class="title">LABORANT.AI2 · IBONARIUM</div>
    <div class="status-bar">
      <span><span class="dot"></span>ONLINE</span>
      <span id="time"></span>
      <span id="state">ЗАВАНТАЖЕННЯ...</span>
    </div>
  </div>

  <div class="left-panel">
    <!-- твій робот і проєкти БЕЗ ЗМІН -->
    (залишається як у тебе)
  </div>

  <div class="chat">
    <div class="chat-title">ЛЕКЦІЯ LABORANT.AI2.</div>
    <div class="messages" id="msgs"></div>
    <div class="input-box">
      <div class="quick-buttons">
        <button onclick="tell()">розкажи</button>
        <button onclick="tell()">цікаво</button>
        <button onclick="tell()">ще</button>
      </div>
    </div>
  </div>
</div>

<script>
const c=document.getElementById("bg"),ctx=c.getContext("2d");
let W,H,p=[];
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;p=Array.from({length:140},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*W+1}))}
resize();addEventListener("resize",resize);
(function draw(){ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);ctx.fillStyle="#ffd166";
p.forEach(s=>{s.z-=0.6;if(s.z<1)s.z=W;let k=140/s.z,x=(s.x-W/2)*k+W/2,y=(s.y-H/2)*k+H/2;
if(x>0&&y>0&&x<W&&y<H)ctx.fillRect(x,y,1.6,1.6)});requestAnimationFrame(draw)})();
</script>

</body>
</html>
