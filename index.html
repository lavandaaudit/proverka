<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM — NOAA LIVE DASHBOARD</title>

<style>
html, body {
    margin:0;
    padding:0;
    background:black;
    overflow:hidden;
    font-family:Arial;
}

/* Панель */
#panel{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    color:#9fdcff;
    font-size:12px;
    text-align:center;
    backdrop-filter: blur(6px);
    padding:6px 10px;
    border-radius:10px;
    opacity:0.85;
    z-index:5;
}

/* Canvas */
canvas{
    position:fixed;
    top:0;
    left:0;
}

/* туман */
#fog{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    background:
      radial-gradient(circle at 30% 40%, rgba(0,80,120,0.25), transparent 60%),
      radial-gradient(circle at 70% 60%, rgba(0,40,80,0.35), transparent 70%),
      radial-gradient(circle at 50% 20%, rgba(0,120,180,0.15), transparent 60%);
    animation:fogMove 120s linear infinite alternate;
}

@keyframes fogMove{
    from{ transform:translateY(-20px) }
    to{ transform:translateY(20px) }
}
</style>
</head>

<body>

<div id="panel">
IBONARIUM LIVE<br>
Solar Wind: <span id="wind">--</span> km/s<br>
Kp Index: <span id="kp">--</span><br>
Bz Field: <span id="bz">--</span> nT
</div>

<canvas id="c"></canvas>
<div id="fog"></div>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function resize(){
 canvas.width=window.innerWidth;
 canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

/* ---------- НОДИ ---------- */

let nodes=[];
for(let i=0;i<35;i++){
 nodes.push({
   a:Math.random()*Math.PI*2,
   r:80+Math.random()*200,
   speed:0.0005+Math.random()*0.001
 });
}

/* ---------- СТАН СИСТЕМИ ---------- */

let solarFactor=1;

function draw(t){

 ctx.fillStyle="rgba(0,0,0,0.25)";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 let cx=canvas.width/2;
 let cy=canvas.height/2;

 nodes.forEach(n=>{

   n.a+=n.speed*solarFactor;

   let x=cx+Math.cos(n.a)*n.r;
   let y=cy+Math.sin(n.a)*n.r;

   ctx.beginPath();
   ctx.arc(x,y,2+solarFactor*2,0,Math.PI*2);
   ctx.fillStyle="rgba(150,220,255,0.8)";
   ctx.fill();

 });

 requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

/* ---------- NOAA DATA ---------- */

async function loadNOAA(){

 try{

   const wind = await fetch(
   "https://services.swpc.noaa.gov/products/summary/solar-wind-speed.json"
   ).then(r=>r.json());

   const kp = await fetch(
   "https://services.swpc.noaa.gov/products/summary/planetary-k-index.json"
   ).then(r=>r.json());

   const mag = await fetch(
   "https://services.swpc.noaa.gov/products/summary/solar-wind-mag-field.json"
   ).then(r=>r.json());

   let windVal = wind?.WindSpeed || wind?.WindSpeed_km_s || 400;
   let kpVal = kp?.Kp || kp?.KP || 2;
   let bzVal = mag?.Bz || 0;

   document.getElementById("wind").textContent = windVal;
   document.getElementById("kp").textContent = kpVal;
   document.getElementById("bz").textContent = bzVal;

   /* вплив на симуляцію */
   solarFactor =
       0.5 +
       (windVal/800)*0.7 +
       (Math.abs(bzVal)/20)*0.3 +
       (kpVal/9)*0.5;

 }catch(e){
   console.log("NOAA offline",e);
 }

}

/* запуск */
loadNOAA();
setInterval(loadNOAA,60000);

</script>

</body>
</html>
