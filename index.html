<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>IBONARIUM · ARHIVE · 25.01.2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  height: 100%;
  overflow-y: auto;
  line-height: 0;
}

/* одна сторінка = один екран */
.section {
  display: block;
  width: 100%;
  height: 100vh;
  margin: 0;
  padding: 0;
  border: none;
  background: #000;
}

/* ================= DOCENT BUTTON ================= */
#docent-btn {
  position: fixed;
  bottom: 20px;
  right: 24px;
  z-index: 9999;
  font-family: "Courier New", monospace;
  font-size: 14px;
  letter-spacing: 2px;
  color: #9ff;
  background: rgba(0,0,0,0.6);
  border: 1px solid #3ff;
  padding: 10px 14px;
  cursor: pointer;
  transition: all 0.25s ease;
}

#docent-btn:hover {
  background: #3ff;
  color: #000;
}

/* ================= DOCENT MODAL ================= */
#docent-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 10000;
  display: none;
}

#docent-box {
  position: absolute;
  inset: 5%;
  border: 1px solid #3ff;
  background: #000;
}

#docent-box iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* close */
#docent-close {
  position: absolute;
  top: -38px;
  right: 0;
  font-family: "Courier New", monospace;
  font-size: 12px;
  letter-spacing: 2px;
  color: #3ff;
  cursor: pointer;
}
</style>
</head>

<body>

<iframe class="section" src="https://lavandaaudit.github.io/TEST2.ORIGINAL.FILE.25.01.2026/" loading="lazy"></iframe>
<iframe class="section" src="https://lavandaaudit.github.io/ibonarium.soncemetr.2026/" loading="lazy"></iframe>
<iframe class="section" src="https://lavandaaudit.github.io/new13/" loading="lazy"></iframe>
<iframe class="section" src="https://lavandaaudit.github.io/hlam5/" loading="lazy"></iframe>
<iframe class="section" src="https://lavandaaudit.github.io/parsergeopolitical/" loading="lazy"></iframe>
<iframe class="section" src="https://lavandaaudit.github.io/economic.radar/" loading="lazy"></iframe>
<iframe class="section" src="https://lavandaaudit.github.io/new5/" loading="lazy"></iframe>
<iframe class="section" src="https://lavandaaudit.github.io/new14/" loading="lazy"></iframe>

<!-- ================= DOCENT UI ================= -->
<div id="docent-btn">DOCENT</div>

<div id="docent-modal">
  <div id="docent-box">
    <div id="docent-close">CLOSE ✕</div>
    <iframe src="https://lavandaaudit.github.io/Docent.kafedry.ibonariuma/"></iframe>
  </div>
</div>

<script>
const btn = document.getElementById("docent-btn");
const modal = document.getElementById("docent-modal");
const close = document.getElementById("docent-close");

btn.onclick = () => modal.style.display = "block";
close.onclick = () => modal.style.display = "none";
modal.onclick = e => {
  if (e.target === modal) modal.style.display = "none";
};
</script>

</body>
</html>
