<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>IBONARIUM · ARHIVE · 25.01.2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  height: 100%;
  overflow-y: auto;
  line-height: 0;
}

.section {
  width: 100%;
  height: 100vh;
  border: none;
  display: block;
  background: #000;
}

/* ================= NAV ================= */
#nav {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 9999;
  background: rgba(0,0,0,0.8);
  border: 1px solid #3ff;
  font-family: "Courier New", monospace;
  color: #9ff;
  font-size: 12px;
  padding: 10px;
}

.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.nav-item span {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-item button {
  background: transparent;
  border: 1px solid #3ff;
  color: #3ff;
  cursor: pointer;
  margin-left: 4px;
}

.nav-item button:hover {
  background: #3ff;
  color: #000;
}

/* ================= DOCENT BUTTON ================= */
#docent-btn {
  position: fixed;
  bottom: 20px;
  right: 24px;
  z-index: 9999;
  font-family: "Courier New", monospace;
  font-size: 14px;
  letter-spacing: 2px;
  color: #9ff;
  background: rgba(0,0,0,0.65);
  border: 1px solid #3ff;
  padding: 10px 14px;
  cursor: pointer;
}

#docent-btn:hover {
  background: #3ff;
  color: #000;
}

/* ================= DOCENT MODAL ================= */
#docent-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 10000;
  display: none;
}

#docent-box {
  position: absolute;
  inset: 5%;
  background: #000;
  border: 1px solid #3ff;
}

#docent-box iframe {
  width: 100%;
  height: 100%;
  border: none;
}

#docent-close {
  position: absolute;
  top: 8px;
  right: 10px;
  color: #3ff;
  border: 1px solid #3ff;
  padding: 4px 8px;
  cursor: pointer;
  font-family: "Courier New", monospace;
}
#docent-close:hover {
  background: #3ff;
  color: #000;
}
</style>
</head>

<body>

<!-- ================= NAV ================= -->
<div id="nav"></div>

<!-- ================= STACK ================= -->
<div id="stack">
  <iframe class="section" data-name="ORIGINAL" src="https://lavandaaudit.github.io/TEST2.ORIGINAL.FILE.25.01.2026/"></iframe>
  <iframe class="section" data-name="SONCEMETR" src="https://lavandaaudit.github.io/ibonarium.soncemetr.2026/"></iframe>
  <iframe class="section" data-name="NEW13" src="https://lavandaaudit.github.io/new13/"></iframe>
  <iframe class="section" data-name="HLAM5" src="https://lavandaaudit.github.io/hlam5/"></iframe>
  <iframe class="section" data-name="GEOPOLITICAL" src="https://lavandaaudit.github.io/parsergeopolitical/"></iframe>
  <iframe class="section" data-name="ECONOMIC" src="https://lavandaaudit.github.io/economic.radar/"></iframe>
  <iframe class="section" data-name="NEW5" src="https://lavandaaudit.github.io/new5/"></iframe>
  <iframe class="section" data-name="NEW14" src="https://lavandaaudit.github.io/new14/"></iframe>
  <iframe class="section" data-name="DOCENT" src="https://lavandaaudit.github.io/Docent.kafedry.ibonariuma/"></iframe>
</div>

<!-- ================= DOCENT AS ASSISTANT ================= -->
<div id="docent-btn">DOCENT</div>

<div id="docent-modal">
  <div id="docent-box">
    <div id="docent-close">✕</div>
    <iframe src="https://lavandaaudit.github.io/Docent.kafedry.ibonariuma/"></iframe>
  </div>
</div>

<script>
const stack = document.getElementById("stack");
const nav = document.getElementById("nav");

function buildNav() {
  nav.innerHTML = "";
  [...stack.children].forEach((iframe, i) => {
    const item = document.createElement("div");
    item.className = "nav-item";

    const label = document.createElement("span");
    label.textContent = `${i+1}. ${iframe.dataset.name}`;

    const up = document.createElement("button");
    up.textContent = "▲";
    up.onclick = () => {
      if (iframe.previousElementSibling) {
        stack.insertBefore(iframe, iframe.previousElementSibling);
        buildNav();
      }
    };

    const down = document.createElement("button");
    down.textContent = "▼";
    down.onclick = () => {
      if (iframe.nextElementSibling) {
        stack.insertBefore(iframe.nextElementSibling, iframe);
        buildNav();
      }
    };

    item.append(label, up, down);
    nav.appendChild(item);
  });
}

buildNav();

/* DOCENT MODAL */
const btn = document.getElementById("docent-btn");
const modal = document.getElementById("docent-modal");
const close = document.getElementById("docent-close");

btn.onclick = () => modal.style.display = "block";
close.onclick = () => modal.style.display = "none";
modal.onclick = e => { if (e.target === modal) modal.style.display = "none"; };
</script>

</body>
</html>
