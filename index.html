<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM Mini Lab</title>

<style>

body{
    margin:0;
    background:#03060b;
    height:200vh; /* щоб було видно overlay */
}

/* ===== MINI PANEL ===== */

#ibonMini{
    position:fixed;
    left:10px;
    bottom:10px;
    width:160px;
    height:160px;
    z-index:9999;
    pointer-events:none;
}

/* CANVAS */

#ibonCanvas{
    width:100%;
    height:100%;
    display:block;
    border-radius:12px;
    background:rgba(5,10,18,0.45);
    backdrop-filter: blur(6px);
}

/* METRICS TEXT */

#ibonText{
    position:absolute;
    left:8px;
    top:6px;
    font-size:10px;
    color:#9fb7ff;
    font-family:monospace;
    line-height:1.2;
    opacity:0.85;
}

</style>
</head>

<body>

<div id="ibonMini">
    <canvas id="ibonCanvas"></canvas>
    <div id="ibonText">
        E:0<br>
        C:0<br>
        R:0<br>
        V:0
    </div>
</div>

<script>

/* ===== CANVAS ===== */

const canvas = document.getElementById("ibonCanvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener("resize", resize);

/* ===== STATE ===== */

let state = {x:0, y:0};
let prevState = {x:0, y:0};
let trajectory = [];
let t = 0;

/* ===== METRIC ===== */

let metric = [
    [1, 0.25],
    [0.25, 1]
];

/* ===== UPDATE ===== */

function updateState(){

    prevState = {...state};

    state.x =
        Math.sin(t*0.6) +
        Math.sin(t*0.18)*0.6;

    state.y =
        Math.cos(t*0.5) +
        Math.sin(t*0.9)*0.3;

    trajectory.push({...state});
    if(trajectory.length > 120) trajectory.shift();

    t += 0.025;
}

/* ===== METRICS ===== */

function energy(){
    return (
        metric[0][0]*state.x*state.x +
        metric[1][1]*state.y*state.y +
        metric[0][1]*state.x*state.y
    );
}

function curvature(){
    return Math.abs(metric[0][1]);
}

function speed(){
    return Math.sqrt(
        (state.x-prevState.x)**2 +
        (state.y-prevState.y)**2
    );
}

function risk(){
    return curvature()*0.6 + speed()*0.4;
}

/* ===== DRAW ===== */

function draw(){

    ctx.fillStyle="rgba(3,6,11,0.25)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    let cx = canvas.width/2;
    let cy = canvas.height/2;
    let scale = canvas.width*0.28;

    /* TRAJECTORY */

    ctx.beginPath();
    trajectory.forEach((p,i)=>{
        let x = cx + p.x*scale;
        let y = cy + p.y*scale;

        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    });
    ctx.strokeStyle="rgba(120,160,255,0.6)";
    ctx.lineWidth=1.4;
    ctx.stroke();

    /* POINT */

    ctx.beginPath();
    ctx.arc(
        cx + state.x*scale,
        cy + state.y*scale,
        2.5,0,Math.PI*2
    );
    ctx.fillStyle="#9fb7ff";
    ctx.fill();
}

/* ===== LOOP ===== */

const text = document.getElementById("ibonText");

function loop(){

    updateState();
    draw();

    text.innerHTML =
        "E:" + energy().toFixed(2) + "<br>" +
        "C:" + curvature().toFixed(2) + "<br>" +
        "R:" + risk().toFixed(2) + "<br>" +
        "V:" + speed().toFixed(2);

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
