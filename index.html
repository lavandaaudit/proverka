<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Лабораторні інструменти — 2 проєкти</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 14px 16px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 500;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 0;
    }

    .frame-wrapper {
      height: 100vh;
      border: none;
      width: 100%;
      background: #fff;
      position: relative;
    }

    .frame-wrapper + .frame-wrapper {
      margin-top: 1px; /* тонка лінія-роздільник */
    }

    .label {
      position: absolute;
      top: 8px;
      left: 12px;
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    /* === Адаптивність === */
    @media (min-width: 992px) {
      .container {
        display: flex;
        flex-direction: row;
        height: 100vh;
      }

      .frame-wrapper {
        width: 50%;
        height: 100vh;
      }

      .frame-wrapper + .frame-wrapper {
        margin-top: 0;
        border-left: 1px solid #ddd;
      }

      header {
        font-size: 1.25rem;
      }
    }

    @media (max-width: 991px) {
      .frame-wrapper {
        height: 55vh;          /* можна налаштувати 50–60vh */
        min-height: 480px;     /* щоб не було занадто маленьким */
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 12px 14px;
        font-size: 1rem;
      }

      .label {
        font-size: 0.75rem;
        padding: 5px 8px;
      }

      .frame-wrapper {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>

<header>
  Лабораторні інструменти — два проєкти в одному вікні
</header>

<div class="container">

  <div class="frame-wrapper">
    <div class="label">txtLaborant2 (перший варіант)</div>
    <iframe 
      src="https://lavandaaudit.github.io/txtLaborant2/" 
      frameborder="0" 
      allowfullscreen
      loading="lazy"
    ></iframe>
  </div>

  <div class="frame-wrapper">
    <div class="label">new13 (другий варіант)</div>
    <iframe 
      src="https://lavandaaudit.github.io/new13/" 
      frameborder="0" 
      allowfullscreen
      loading="lazy"
    ></iframe>
  </div>

</div>

</body>
</html>
