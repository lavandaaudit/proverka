<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ibonarium flow</title>

<style>

/* ========================================= */
/* RESET */
/* ========================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:auto !important;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#000;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial,sans-serif;
}

/* ========================================= */
/* BODY */
/* ========================================= */

body{
  position:relative;
}

/* ========================================= */
/* SECTIONS */
/* ========================================= */

.section{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#000;
}

/* ========================================= */
/* IFRAMES */
/* ========================================= */

.frame{
  width:100%;
  border:none;
  display:block;
  background:#000;
}

/* ========================================= */
/* PAGE HEIGHTS */
/* ========================================= */

#tvFrame{
  height:100vh;
  min-height:100vh;
}

#museumFrame{
  height:2200px;
}

/* ========================================= */
/* FADE TRANSITION */
/* ========================================= */

.fade::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-1px;
  width:100%;
  height:120px;
  pointer-events:none;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0),
    rgba(0,0,0,0.45),
    #000
  );

  z-index:10;
}

/* ========================================= */
/* MOBILE */
/* ========================================= */

@media(max-width:900px){

  #tvFrame{
    height:100svh;
    min-height:100svh;
  }

  #museumFrame{
    height:2600px;
  }

}

</style>
</head>

<body>

<!-- ========================================= -->
<!-- FIRST PAGE -->
<!-- ========================================= -->

<section class="section fade">

  <iframe
    id="tvFrame"
    class="frame"
    src="https://lavandaaudit.github.io/tv.2/"
    loading="eager"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>

</section>

<!-- ========================================= -->
<!-- SECOND PAGE -->
<!-- ========================================= -->

<section class="section">

  <iframe
    id="museumFrame"
    class="frame"
    src="https://lavandaaudit.github.io/history.musem.ibonarium/"
    loading="lazy"
    allowfullscreen>
  </iframe>

</section>

<script>

/* =========================================
   DISABLE BROWSER SCROLL RESTORE
========================================= */

if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

/* =========================================
   REMOVE HASH / HISTORY RESTORE
========================================= */

history.replaceState(null, null, location.pathname);

/* =========================================
   FORCE PAGE START FROM TOP
========================================= */

function forceTop(){

  window.scrollTo({
    top:0,
    left:0,
    behavior:'auto'
  });

  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;

}

/* =========================================
   INSTANT TOP
========================================= */

forceTop();

/* =========================================
   DOM READY
========================================= */

document.addEventListener('DOMContentLoaded', () => {

  forceTop();

});

/* =========================================
   FULL PAGE LOAD
========================================= */

window.addEventListener('load', () => {

  forceTop();

  /* multiple hard fixes */

  setTimeout(forceTop, 50);
  setTimeout(forceTop, 150);
  setTimeout(forceTop, 300);
  setTimeout(forceTop, 700);
  setTimeout(forceTop, 1200);

});

/* =========================================
   CACHE / BACK BUTTON FIX
========================================= */

window.addEventListener('pageshow', () => {

  forceTop();

});

/* =========================================
   HARD STARTUP LOCK
========================================= */

let startupLock = true;

/* keep first screen locked */

setTimeout(() => {

  startupLock = false;

}, 1800);

/* block any auto scroll */

window.addEventListener('scroll', () => {

  if(startupLock){

    window.scrollTo(0,0);

  }

}, { passive:false });

/* =========================================
   IFRAME JUMP PROTECTION
========================================= */

const tvFrame = document.getElementById('tvFrame');

tvFrame.addEventListener('load', () => {

  if(startupLock){

    forceTop();

  }

});

/* =========================================
   VISIBILITY CHANGE FIX
========================================= */

document.addEventListener('visibilitychange', () => {

  if(!document.hidden && startupLock){

    forceTop();

  }

});

/* =========================================
   ADAPTIVE HEIGHT
========================================= */

const museumFrame = document.getElementById('museumFrame');

function adaptiveMuseumHeight(){

  if(window.innerWidth < 900){

    museumFrame.style.height = '2600px';

  }else{

    museumFrame.style.height = '2200px';

  }

}

adaptiveMuseumHeight();

window.addEventListener('resize', adaptiveMuseumHeight);

</script>

</body>
</html>
