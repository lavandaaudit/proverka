<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>MEGACITY AI EXPLORER</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:'Inter',sans-serif;
color:white;
}

/* ===== VIEWER ===== */

.viewer{
position:relative;
width:100%;
height:100vh;
overflow:hidden;
background:black;
}

iframe{
width:100%;
height:100%;
border:none;
transition:1s;
}

/* ===== OVERLAY ===== */

.scan{
position:absolute;
inset:0;

background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.03) 0px,
rgba(255,255,255,.03) 1px,
transparent 2px,
transparent 4px
);

opacity:.14;
mix-blend-mode:screen;

pointer-events:none;
}

.vignette{
position:absolute;
inset:0;

background:
radial-gradient(
circle at center,
transparent 35%,
rgba(0,0,0,.45)
);

pointer-events:none;
}

/* ===== TOPBAR ===== */

.topbar{
position:absolute;

top:14px;
left:50%;

transform:translateX(-50%);

width:96%;
height:74px;

background:rgba(0,0,0,.45);

backdrop-filter:blur(16px);

border:
1px solid rgba(255,255,255,.08);

border-radius:24px;

display:flex;
align-items:center;
gap:14px;

padding:0 16px;

z-index:100;
}

/* ===== LOGO ===== */

.logo{
font-size:22px;
font-weight:900;
white-space:nowrap;
}

/* ===== SEARCH ===== */

.search{
flex:1;
height:44px;

background:#111;

border:none;
outline:none;

border-radius:14px;

padding:0 16px;

font-size:14px;
color:white;
}

/* ===== CITY LIST ===== */

.citys{
display:flex;
gap:10px;
overflow-x:auto;
scrollbar-width:none;
}

.citys::-webkit-scrollbar{
display:none;
}

.city{
padding:10px 16px;

background:#111;

border:
1px solid rgba(255,255,255,.06);

border-radius:14px;

cursor:pointer;

font-size:13px;
font-weight:700;

transition:.25s;

white-space:nowrap;
}

.city:hover{
background:#1a1a1a;
transform:translateY(-3px);
}

/* ===== LEFT ===== */

.left{
position:absolute;

left:14px;
top:98px;

display:flex;
flex-direction:column;
gap:8px;

z-index:100;
}

/* ===== BUTTON ===== */

.btn{
width:145px;
height:42px;

background:rgba(0,0,0,.45);

backdrop-filter:blur(14px);

border:
1px solid rgba(255,255,255,.08);

border-radius:14px;

color:white;

font-size:11px;
font-weight:700;

cursor:pointer;

transition:.25s;
}

.btn:hover{
background:#191919;
transform:translateX(5px);
}

/* ===== RIGHT ===== */

.right{
position:absolute;

right:14px;
top:98px;

width:235px;

background:rgba(0,0,0,.45);

backdrop-filter:blur(16px);

border:
1px solid rgba(255,255,255,.08);

border-radius:22px;

padding:14px;

z-index:100;
}

/* ===== CITY TITLE ===== */

.city-title{
font-size:24px;
font-weight:900;
line-height:1;
margin-bottom:14px;
}

/* ===== CARD ===== */

.card{
background:#111;

border:
1px solid rgba(255,255,255,.05);

border-radius:14px;

padding:12px;

margin-bottom:10px;
}

.label{
font-size:10px;
opacity:.5;
margin-bottom:5px;
letter-spacing:1px;
}

.value{
font-size:18px;
font-weight:800;
}

.small{
font-size:11px;
opacity:.65;
margin-top:4px;
line-height:1.5;
}

/* ===== GUIDE ===== */

.guide{
margin-top:12px;

padding:12px;

background:
linear-gradient(
135deg,
rgba(0,120,255,.16),
rgba(0,255,180,.08)
);

border-radius:14px;

border:
1px solid rgba(255,255,255,.08);

font-size:11px;
line-height:1.5;
}

/* ===== WALK ===== */

.walk{
position:absolute;

left:14px;
bottom:14px;

padding:12px 16px;

background:rgba(0,0,0,.45);

backdrop-filter:blur(14px);

border:
1px solid rgba(255,255,255,.08);

border-radius:16px;

font-size:11px;
line-height:1.5;

z-index:100;
}

/* ===== BIG CITY ===== */

.bigcity{
position:absolute;

right:18px;
bottom:18px;

font-size:40px;
font-weight:900;

opacity:.12;

pointer-events:none;
}

/* ===== GLITCH ===== */

.glitch{
animation:glitch .15s infinite;
}

@keyframes glitch{

0%{
transform:translate(0);
}

25%{
transform:translate(2px,-2px);
}

50%{
transform:translate(-2px,2px);
}

75%{
transform:translate(2px,2px);
}

100%{
transform:translate(0);
}

}

/* ===== MOBILE ===== */

@media(max-width:900px){

.right{
width:190px;
}

.city-title{
font-size:18px;
}

.value{
font-size:15px;
}

.bigcity{
display:none;
}

.btn{
width:120px;
font-size:10px;
}

}

</style>
</head>

<body>

<div class="viewer">

<!-- STREET -->

<iframe
id="street"
allowfullscreen>
</iframe>

<div class="scan"></div>
<div class="vignette"></div>

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
MEGACITY
</div>

<input
class="search"
type="text"
placeholder="Пошук мегаполіса..."
onkeyup="filterCities(this.value)"
>

<div class="citys" id="citys"></div>

</div>

<!-- LEFT -->

<div class="left">

<button class="btn" onclick="randomStreet()">
RANDOM STREET
</button>

<button class="btn" onclick="nextCity()">
NEXT CITY
</button>

<button class="btn" onclick="autoWalk()">
AUTO WALK AI
</button>

<button class="btn" onclick="stopWalk()">
STOP WALK
</button>

<button class="btn" onclick="nightMode()">
NIGHT MODE
</button>

<button class="btn" onclick="cinemaMode()">
CINEMA MODE
</button>

<button class="btn" onclick="matrixMode()">
MATRIX MODE
</button>

<button class="btn" onclick="cyberpunkMode()">
CYBERPUNK
</button>

<button class="btn" onclick="resetMode()">
RESET
</button>

</div>

<!-- RIGHT -->

<div class="right">

<div
class="city-title"
id="cityTitle">
TOKYO
</div>

<div class="card">

<div class="label">
WEATHER
</div>

<div
class="value"
id="temp">
+24°C
</div>

<div
class="small"
id="weatherText">
clear sky
</div>

</div>

<div class="card">

<div class="label">
AIR QUALITY
</div>

<div
class="value"
id="air">
38 AQI
</div>

<div
class="small"
id="airText">
good air quality
</div>

</div>

<div class="card">

<div class="label">
POPULATION
</div>

<div
class="value"
id="population">
37M
</div>

<div class="small">
megapolis urban node
</div>

</div>

<div
class="guide"
id="guide">

AI GUIDE<br><br>

waiting for navigation route...

</div>

</div>

<!-- WALK -->

<div
class="walk"
id="walk">

AI WALK SYSTEM ONLINE<br>
standby mode

</div>

<!-- BIG -->

<div
class="bigcity"
id="bigcity">
TOKYO
</div>

</div>

<script>

/* ===== CITIES ===== */

const cities=[

"Tokyo",
"Kyiv",
"New York",
"London",
"Paris",
"Berlin",
"Rome",
"Barcelona",
"Dubai",
"Istanbul",
"Bangkok",
"Singapore",
"Seoul",
"Sydney",
"Toronto",
"Cairo",
"Mumbai",
"Shanghai",
"Los Angeles",
"Chicago",
"Lviv"

];

/* ===== DATA ===== */

const cityData={

Tokyo:{
coords:[35.6895,139.6917],
temp:"+24°C",
weather:"clear sky",
air:"38 AQI",
airText:"good air quality",
population:"37M"
},

Kyiv:{
coords:[50.4501,30.5234],
temp:"+20°C",
weather:"cloudy",
air:"52 AQI",
airText:"moderate air quality",
population:"3M"
},

London:{
coords:[51.5072,-0.1276],
temp:"+17°C",
weather:"rain",
air:"48 AQI",
airText:"stable air quality",
population:"9M"
},

Paris:{
coords:[48.8566,2.3522],
temp:"+21°C",
weather:"clear sky",
air:"41 AQI",
airText:"good air quality",
population:"11M"
}

};

/* ===== ELEMENTS ===== */

const frame=
document.getElementById('street');

const citys=
document.getElementById('citys');

let currentIndex=0;

let autoWalkInterval=null;

/* ===== RENDER ===== */

function renderCities(list){

citys.innerHTML='';

list.forEach((city,index)=>{

const div=document.createElement('div');

div.className='city';

div.innerText=city;

div.onclick=()=>openStreet(city,index);

citys.appendChild(div);

});

}

renderCities(cities);

/* ===== OPEN STREET ===== */

function openStreet(city,index){

currentIndex=index;

const data=
cityData[city] || cityData["Tokyo"];

const lat=data.coords[0];
const lng=data.coords[1];

const rLat=
(lat+(Math.random()-.5)/100).toFixed(6);

const rLng=
(lng+(Math.random()-.5)/100).toFixed(6);

frame.src=
`https://www.google.com/maps?q=&layer=c&cbll=${rLat},${rLng}&cbp=11,0,0,0,0&output=svembed`;

document.getElementById('cityTitle').innerText=
city.toUpperCase();

document.getElementById('bigcity').innerText=
city.toUpperCase();

document.getElementById('temp').innerText=
data.temp;

document.getElementById('weatherText').innerText=
data.weather;

document.getElementById('air').innerText=
data.air;

document.getElementById('airText').innerText=
data.airText;

document.getElementById('population').innerText=
data.population;

}

/* ===== SEARCH ===== */

function filterCities(text){

const filtered=
cities.filter(c=>
c.toLowerCase().includes(text.toLowerCase())
);

renderCities(filtered);

}

/* ===== RANDOM ===== */

function randomStreet(){

openStreet(
cities[currentIndex],
currentIndex
);

}

/* ===== NEXT ===== */

function nextCity(){

currentIndex++;

if(currentIndex>=cities.length){

currentIndex=0;

}

openStreet(
cities[currentIndex],
currentIndex
);

}

/* ===== AUTO WALK ===== */

function autoWalk(){

clearInterval(autoWalkInterval);

document.getElementById('walk').innerHTML=
`
AI AUTO WALK ACTIVE<br>
autonomous navigation...
`;

autoWalkInterval=setInterval(()=>{

const city=
cities[currentIndex];

const data=
cityData[city] || cityData["Tokyo"];

const lat=data.coords[0];
const lng=data.coords[1];

const headings=[

0,
45,
90,
135,
180,
225,
270,
315

];

const heading=
headings[
Math.floor(Math.random()*headings.length)
];

const zooms=[0,2,5];

const zoom=
zooms[
Math.floor(Math.random()*zooms.length)
];

const rLat=
(lat+(Math.random()-.5)/300).toFixed(6);

const rLng=
(lng+(Math.random()-.5)/300).toFixed(6);

frame.src=
`https://www.google.com/maps?q=&layer=c&cbll=${rLat},${rLng}&cbp=11,${heading},0,${zoom},0&output=svembed`;

const routes=[

"walking forward...",
"crossing avenue...",
"turning right...",
"moving through district...",
"approaching intersection...",
"navigating downtown...",
"scanning urban sector...",
"moving toward neon zone..."

];

const random=
routes[
Math.floor(Math.random()*routes.length)
];

document.getElementById('guide').innerHTML=
`
AI GUIDE<br><br>
${random}<br><br>
autonomous route generation active
`;

document.getElementById('walk').innerHTML=
`
AI AUTO WALK ACTIVE<br>
${random}
`;

},7000);

}

/* ===== STOP ===== */

function stopWalk(){

clearInterval(autoWalkInterval);

document.getElementById('walk').innerHTML=
`
AI WALK STOPPED<br>
manual control restored
`;

}

/* ===== MODES ===== */

function nightMode(){

frame.style.filter=
'brightness(.55) contrast(1.3) saturate(.8)';

}

function cinemaMode(){

frame.style.filter=
'contrast(1.15) saturate(1.2) brightness(.95)';

}

function matrixMode(){

frame.style.filter=
'hue-rotate(90deg) saturate(1.5) brightness(.8)';

document.body.classList.add('glitch');

}

function cyberpunkMode(){

frame.style.filter=
'hue-rotate(-40deg) saturate(1.8) contrast(1.2)';

}

/* ===== RESET ===== */

function resetMode(){

location.reload();

}

/* ===== START ===== */

openStreet("Tokyo",0);

</script>

</body>
</html>
