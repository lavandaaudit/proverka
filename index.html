<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONIRIUM · EXP-02 · STACK</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BASE */
html, body {
  width: 100%;
  height: 100%;
  background: #000;
}

/* SCROLL STACK */
body {
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

/* ONE SCREEN = ONE PAGE */
.section {
  width: 100%;
  height: 100vh;
  scroll-snap-align: start;
  background: #000;
}

/* IFRAME */
iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* MOBILE TUNING */
@media (max-width: 768px) {
  body {
    scroll-snap-type: y proximity;
  }

  .section {
    height: 100svh; /* правильна висота на моб */
  }
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<section class="section">
  <iframe
    src="https://lavandaaudit.github.io/exp-02/"
    loading="lazy">
  </iframe>
</section>

<!-- PAGE 2 -->
<section class="section">
  <iframe
    src="https://lavandaaudit.github.io/exp-02/"
    loading="lazy">
  </iframe>
</section>

</body>
</html>
