<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM — Solar Bird Feeder</title>

<style>
body{
    margin:0;
    background: radial-gradient(circle at center,#0b1020,#000);
    overflow:hidden;
    font-family:Segoe UI, sans-serif;
    color:#dcd6ff;
}

canvas{display:block;}

#ui{
    position:absolute;
    top:12px;
    left:14px;
    font-size:14px;
    opacity:.9;
}

h1{
    margin:0 0 6px 0;
    font-size:18px;
    background:linear-gradient(90deg,#ffe27a,#ff9ad6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="ui">
<h1>🐦 IBONARIUM FEEDER</h1>
<div>Kp index: <span id="kp"></span></div>
<div>Solar Wind: <span id="wind"></span></div>
<div>Flares: <span id="flare"></span></div>
<div>Птахів: <span id="count"></span></div>
</div>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let w,h;
function resize(){
    w=canvas.width=innerWidth;
    h=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

/////////////////////
// СОНЯЧНІ ДАНІ (симуляція)
/////////////////////

let sun={
    kp:2,
    wind:400,
    flare:false
};

function updateSun(){
    sun.kp=Math.max(0,Math.min(9,sun.kp+(Math.random()-.5)*1));
    sun.wind=300+Math.random()*500;
    sun.flare=Math.random()<0.15;

    kp.textContent=sun.kp.toFixed(1);
    wind.textContent=Math.round(sun.wind)+" km/s";
    flare.textContent=sun.flare?"ACTIVE":"quiet";
}
setInterval(updateSun,8000);
updateSun();

/////////////////////
// КОРМУШКА
/////////////////////

const feeder={
    x:()=>w/2,
    y:()=>h/2+40,
    r:28
};

/////////////////////
// ПТАХИ
/////////////////////

class Bird{
    constructor(){
        this.angle=Math.random()*Math.PI*2;
        this.dist=200+Math.random()*300;
        this.speed=.002+Math.random()*0.003;
        this.size=3+Math.random()*3;
        this.energy=1;
    }

    update(){
        // вплив сонця
        let solarBoost=1+(sun.wind/800);

        this.angle+=this.speed*solarBoost;

        // при спалаху більше шансів сісти
        if(sun.flare && Math.random()<0.01){
            this.dist*=0.92;
        }

        // притягування до кормушки
        this.dist+= (120-this.dist)*0.002;

        this.x=feeder.x()+Math.cos(this.angle)*this.dist;
        this.y=feeder.y()+Math.sin(this.angle)*this.dist;
    }

    draw(){
        ctx.beginPath();
        ctx.fillStyle="white";
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
    }
}

let birds=[];

function spawnBirds(){
    let target=10+sun.kp*5+(sun.flare?20:0);

    while(birds.length<target){
        birds.push(new Bird());
    }

    while(birds.length>target){
        birds.pop();
    }
}

/////////////////////
// МАЛЮВАННЯ
/////////////////////

function drawFeeder(){
    let x=feeder.x();
    let y=feeder.y();

    ctx.fillStyle="#8a5a2b";
    ctx.beginPath();
    ctx.arc(x,y,feeder.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#c89b6d";
    ctx.beginPath();
    ctx.arc(x,y,feeder.r-6,0,Math.PI*2);
    ctx.fill();
}

function drawSunAura(){
    let g=ctx.createRadialGradient(
        feeder.x(),feeder.y(),50,
        feeder.x(),feeder.y(),500
    );

    let intensity=sun.kp/9;

    g.addColorStop(0,"rgba(255,220,120,"+(0.15+intensity*0.25)+")");
    g.addColorStop(1,"transparent");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);
}

/////////////////////
// LOOP
/////////////////////

function loop(){
    ctx.fillStyle="rgba(0,0,20,0.35)";
    ctx.fillRect(0,0,w,h);

    drawSunAura();

    spawnBirds();

    birds.forEach(b=>{
        b.update();
        b.draw();
    });

    drawFeeder();

    count.textContent=birds.length;

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
