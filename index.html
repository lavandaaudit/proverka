<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IBONARIUM · COSMO · DYNAMICS · HUB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#030305;
    --accent:#00e5ff;
    --secondary:#ff007a;
    --border:rgba(0,229,255,.2);

    --font-main:'Outfit',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    background:var(--bg);
    color:#fff;
    overflow-x:hidden;
    scroll-behavior:smooth;
    font-family:var(--font-main);
}

/* MAIN */
.hub-container{
    width:100%;
    display:flex;
    flex-direction:column;
}

/* SECTIONS */
section{
    width:100%;
    position:relative;
    background:#000;
}

/* PAGE HEIGHTS */

/* LIVE */
#live{
    height:100vh;
}

/* ARCHIVE */
/* ЗБІЛЬШЕНО */
#archive{
    height:4200px;
}

/* LIGHTMETER */
#lightmeter{
    height:2200px;
}

/* IFRAMES */
iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
    background:#000;
}

/* SCROLLBAR */
body::-webkit-scrollbar{
    width:8px;
}

body::-webkit-scrollbar-track{
    background:#06020a;
}

body::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:10px;
}

/* MOBILE */
@media(max-width:768px){

    #live{
        height:100vh;
    }

    /* МОБІЛЬНА ВЕРСІЯ ЩЕ ВИЩА */
    #archive{
        height:5200px;
    }

    #lightmeter{
        height:3000px;
    }

}

</style>
</head>

<body>

<div class="hub-container">

    <!-- PAGE 1 -->
    <section id="live">
        <iframe
            src="https://lavandaaudit.github.io/sunsetnow/"
            title="Sun Ibonarium Cosmo Dynamics Lab Live"
            scrolling="no">
        </iframe>
    </section>

    <!-- PAGE 2 -->
    <section id="archive">
        <iframe
            src="https://lavandaaudit.github.io/tele.lab.telescope/"
            title="Sun 30 Days Archive"
            scrolling="no">
        </iframe>
    </section>

    <!-- PAGE 3 -->
    <section id="lightmeter">
        <iframe
            src="https://lavandaaudit.github.io/all0505/"
            title="Ibonarium Lightmeter 2.0"
            scrolling="no">
        </iframe>
    </section>

</div>

</body>
</html>
