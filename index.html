<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>IBONARIUM · STACK · 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow-y: auto;
      font-family: system-ui, sans-serif;
    }

    .section {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
      background: #000;
    }

    /* Кнопка DOCENT — квадратна, плаваюча */
    #docent-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      width: 64px;
      height: 64px;
      background: rgba(74, 107, 255, 0.9);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      transition: all 0.18s ease;
    }

    #docent-btn:hover {
      background: rgba(90, 122, 255, 1);
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.6);
    }

    /* Модальне вікно */
    #docent-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.94);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #docent-modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      position: relative;
      width: 94%;
      max-width: 1140px;
      height: 90vh;
      max-height: 96vh;
      background: #0a0a0a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      transform: scale(0.92);
      transition: transform 0.25s ease;
    }

    #docent-modal.active .modal-content {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      z-index: 10;
      width: 42px;
      height: 42px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: #d00000;
    }

    .modal-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<iframe class="section" src="https://lavandaaudit.github.io/laborant2/" loading="lazy"></iframe>
<iframe class="section" src="https://lavandaaudit.github.io/new13/" loading="lazy"></iframe>

<!-- Кнопка -->
<button id="docent-btn">DOCENT</button>

<!-- Модальне вікно -->
<div id="docent-modal">
  <div class="modal-content">
    <button class="close-btn" title="Закрити">×</button>
    <iframe 
      class="modal-iframe"
      src="https://lavandaaudit.github.io/Docent.kafedry.ibonariuma/"
      loading="lazy">
    </iframe>
  </div>
</div>

<script>
  const btn = document.getElementById('docent-btn');
  const modal = document.getElementById('docent-modal');
  const closeBtn = document.querySelector('.close-btn');

  function openModal() {
    modal.classList.add('active');
  }

  function closeModal() {
    modal.classList.remove('active');
  }

  btn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);

  // Закриття по кліку на фон
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      closeModal();
    }
  });

  // Закриття по Esc (зручно)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('active')) {
      closeModal();
    }
  });
</script>

</body>
</html>
