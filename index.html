<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>IBONARIUM RENDER</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:'Inter',sans-serif;
color:white;
}

/* ===== VIEWER ===== */

.viewer{
position:relative;
width:100%;
height:100vh;
overflow:hidden;
background:black;
}

iframe{
width:100%;
height:100%;
border:none;
transition:1s;
}

/* ===== EFFECTS ===== */

.scan{
position:absolute;
inset:0;

background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.025) 0px,
rgba(255,255,255,.025) 1px,
transparent 2px,
transparent 4px
);

opacity:.12;
mix-blend-mode:screen;

pointer-events:none;
}

.vignette{
position:absolute;
inset:0;

background:
radial-gradient(
circle at center,
transparent 35%,
rgba(0,0,0,.45)
);

pointer-events:none;
}

/* ===== TOPBAR ===== */

.topbar{
position:absolute;

top:10px;
left:50%;

transform:translateX(-50%);

width:97%;
height:58px;

background:rgba(0,0,0,.24);

backdrop-filter:blur(12px);

border:
1px solid rgba(255,255,255,.05);

border-radius:18px;

display:flex;
align-items:center;
gap:10px;

padding:0 12px;

z-index:100;
}

/* ===== LOGO ===== */

.logo{
font-size:16px;
font-weight:900;
letter-spacing:1px;
white-space:nowrap;
}

/* ===== SEARCH ===== */

.search{
width:220px;
height:34px;

background:#111;

border:none;
outline:none;

border-radius:10px;

padding:0 12px;

font-size:12px;
color:white;
}

/* ===== MENU ===== */

.left{
position:absolute;

top:78px;
left:50%;

transform:translateX(-50%);

display:flex;
align-items:center;
justify-content:center;
flex-wrap:wrap;

gap:6px;

z-index:100;
}

/* ===== BUTTON ===== */

.btn{
width:auto;
min-width:92px;

padding:0 12px;

height:30px;

background:rgba(0,0,0,.24);

backdrop-filter:blur(8px);

border:
1px solid rgba(255,255,255,.05);

border-radius:9px;

color:white;

font-size:8px;
font-weight:700;

cursor:pointer;

transition:.2s;
}

.btn:hover{
background:#181818;
}

/* ===== CITY GRID ===== */

.citys{
position:absolute;

top:122px;
left:14px;
right:190px;

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(88px,1fr));

gap:6px;

max-height:122px;

overflow:auto;

padding-right:8px;

scrollbar-width:none;

z-index:90;
}

.citys::-webkit-scrollbar{
display:none;
}

/* ===== CITY ===== */

.city{
display:flex;
align-items:center;
justify-content:center;

height:34px;

padding:0 8px;

font-size:9px;
font-weight:700;

text-align:center;

background:rgba(0,0,0,.22);

border:
1px solid rgba(255,255,255,.04);

border-radius:10px;

backdrop-filter:blur(6px);

cursor:pointer;

transition:.2s;

white-space:nowrap;
}

.city:hover{
background:#1b1b1b;
transform:scale(1.03);
}

/* ===== RIGHT INFO ===== */

.right{
position:absolute;

right:10px;
top:122px;

width:165px;

display:flex;
flex-direction:column;
gap:8px;

z-index:100;
}

/* ===== TITLE ===== */

.city-title{
font-size:18px;
font-weight:900;
line-height:1;

text-align:right;
}

/* ===== INFO ===== */

.info-line{
text-align:right;
line-height:1.45;
}

.label{
font-size:9px;
opacity:.45;
letter-spacing:1px;
}

.value{
font-size:14px;
font-weight:800;
}

.small{
font-size:10px;
opacity:.6;
}

/* ===== GUIDE ===== */

.guide{
margin-top:8px;

font-size:10px;
line-height:1.5;

text-align:right;

opacity:.75;
}

/* ===== STATUS ===== */

.walk{
position:absolute;

left:10px;
bottom:10px;

padding:10px 14px;

background:rgba(0,0,0,.24);

backdrop-filter:blur(10px);

border:
1px solid rgba(255,255,255,.05);

border-radius:12px;

font-size:10px;
line-height:1.5;

z-index:100;
}

/* ===== BIG CITY ===== */

.bigcity{
position:absolute;

right:18px;
bottom:18px;

font-size:40px;
font-weight:900;

opacity:.12;

pointer-events:none;
}

/* ===== GLITCH ===== */

.glitch{
animation:glitch .15s infinite;
}

@keyframes glitch{

0%{
transform:translate(0);
}

25%{
transform:translate(2px,-2px);
}

50%{
transform:translate(-2px,2px);
}

75%{
transform:translate(2px,2px);
}

100%{
transform:translate(0);
}

}

/* ===== MOBILE ===== */

@media(max-width:900px){

.citys{
right:10px;

grid-template-columns:
repeat(auto-fill,minmax(72px,1fr));

max-height:100px;
}

.btn{
min-width:78px;
font-size:7px;
height:28px;
}

.right{
width:140px;
}

.bigcity{
display:none;
}

.search{
width:120px;
}

}

</style>
</head>

<body>

<div class="viewer">

<!-- STREET -->

<iframe
id="street"
allowfullscreen>
</iframe>

<div class="scan"></div>
<div class="vignette"></div>

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
IBONARIUM RENDER
</div>

<input
class="search"
type="text"
placeholder="Пошук..."
onkeyup="filterCities(this.value)"
>

</div>

<!-- MENU -->

<div class="left">

<button class="btn" onclick="randomStreet()">
RANDOM
</button>

<button class="btn" onclick="nextCity()">
NEXT
</button>

<button class="btn" onclick="autoWalk()">
AUTO WALK
</button>

<button class="btn" onclick="stopWalk()">
STOP
</button>

<button class="btn" onclick="nightMode()">
NIGHT
</button>

<button class="btn" onclick="cinemaMode()">
CINEMA
</button>

<button class="btn" onclick="matrixMode()">
MATRIX
</button>

<button class="btn" onclick="cyberpunkMode()">
CYBER
</button>

<button class="btn" onclick="droneMode()">
DRONE
</button>

<button class="btn" onclick="resetMode()">
RESET
</button>

</div>

<!-- CITY GRID -->

<div class="citys" id="citys"></div>

<!-- RIGHT -->

<div class="right">

<div
class="city-title"
id="cityTitle">
TOKYO
</div>

<div class="info-line">

<div class="label">
WEATHER
</div>

<div
class="value"
id="temp">
+24°C
</div>

<div
class="small"
id="weatherText">
clear sky
</div>

</div>

<div class="info-line">

<div class="label">
AIR
</div>

<div
class="value"
id="air">
38 AQI
</div>

<div
class="small"
id="airText">
good quality
</div>

</div>

<div class="info-line">

<div class="label">
POPULATION
</div>

<div
class="value"
id="population">
37M
</div>

</div>

<div
class="guide"
id="guide">

AI WALK<br>
standby...

</div>

</div>

<!-- STATUS -->

<div
class="walk"
id="walk">

AI SYSTEM ONLINE<br>
standby mode

</div>

<!-- BIG -->

<div
class="bigcity"
id="bigcity">
TOKYO
</div>

</div>

<script>

/* ===== CITIES ===== */

const cities=[

"Tokyo",
"Kyiv",
"New York",
"London",
"Paris",
"Berlin",
"Rome",
"Barcelona",
"Dubai",
"Istanbul",
"Bangkok",
"Singapore",
"Seoul",
"Sydney",
"Toronto",
"Cairo",
"Mumbai",
"Shanghai",
"Los Angeles",
"Chicago",
"Lviv",
"Odessa",
"Kharkiv",
"Dnipro",
"Warsaw",
"Prague",
"Vienna",
"Amsterdam",
"Brussels",
"Copenhagen",
"Stockholm",
"Helsinki",
"Oslo",
"Lisbon",
"Madrid",
"Valencia",
"Seville",
"Milan",
"Naples",
"Florence",
"Munich",
"Hamburg",
"Frankfurt",
"Zurich",
"Budapest",
"Athens",
"Bucharest",
"Sofia",
"Belgrade",
"Zagreb",
"Sarajevo",
"Skopje",
"Tirana",
"Reykjavik",
"Dublin",
"Edinburgh",
"Manchester",
"Liverpool",
"Glasgow",
"Birmingham",
"San Francisco",
"Seattle",
"Miami",
"Boston",
"Houston",
"Dallas",
"Atlanta",
"Detroit",
"Phoenix",
"Las Vegas",
"Portland",
"Denver",
"Mexico City",
"Rio de Janeiro",
"Sao Paulo",
"Buenos Aires",
"Lima",
"Santiago",
"Bogota",
"Caracas",
"Havana",
"Panama City",
"Cape Town",
"Johannesburg",
"Nairobi",
"Lagos",
"Casablanca",
"Tunis",
"Algiers",
"Jerusalem",
"Tel Aviv",
"Doha",
"Riyadh",
"Tehran",
"Baghdad",
"Karachi",
"Delhi",
"Kathmandu",
"Hong Kong",
"Taipei",
"Jakarta"

];

/* ===== CITY DATA ===== */

const cityData={

Tokyo:{
coords:[35.6895,139.6917],
temp:"+24°C",
weather:"clear sky",
air:"38 AQI",
airText:"good quality",
population:"37M"
},

Kyiv:{
coords:[50.4501,30.5234],
temp:"+20°C",
weather:"cloudy",
air:"52 AQI",
airText:"moderate quality",
population:"3M"
},

London:{
coords:[51.5072,-0.1276],
temp:"+17°C",
weather:"rain",
air:"48 AQI",
airText:"stable quality",
population:"9M"
},

Paris:{
coords:[48.8566,2.3522],
temp:"+21°C",
weather:"clear sky",
air:"41 AQI",
airText:"good quality",
population:"11M"
}

};

/* ===== ELEMENTS ===== */

const frame=
document.getElementById('street');

const citys=
document.getElementById('citys');

let currentIndex=0;

let autoWalkInterval=null;

/* ===== RENDER ===== */

function renderCities(list){

citys.innerHTML='';

list.forEach((city,index)=>{

const div=document.createElement('div');

div.className='city';

div.innerText=city;

div.onclick=()=>openStreet(city,index);

citys.appendChild(div);

});

}

renderCities(cities);

/* ===== OPEN ===== */

function openStreet(city,index){

currentIndex=index;

const data=
cityData[city] || cityData["Tokyo"];

const lat=data.coords[0];
const lng=data.coords[1];

const rLat=
(lat+(Math.random()-.5)/100).toFixed(6);

const rLng=
(lng+(Math.random()-.5)/100).toFixed(6);

frame.src=
`https://www.google.com/maps?q=&layer=c&cbll=${rLat},${rLng}&cbp=11,0,0,0,0&output=svembed`;

document.getElementById('cityTitle').innerText=
city.toUpperCase();

document.getElementById('bigcity').innerText=
city.toUpperCase();

document.getElementById('temp').innerText=
data.temp;

document.getElementById('weatherText').innerText=
data.weather;

document.getElementById('air').innerText=
data.air;

document.getElementById('airText').innerText=
data.airText;

document.getElementById('population').innerText=
data.population;

}

/* ===== SEARCH ===== */

function filterCities(text){

const filtered=
cities.filter(c=>
c.toLowerCase().includes(text.toLowerCase())
);

renderCities(filtered);

}

/* ===== RANDOM ===== */

function randomStreet(){

openStreet(
cities[currentIndex],
currentIndex
);

}

/* ===== NEXT ===== */

function nextCity(){

currentIndex++;

if(currentIndex>=cities.length){

currentIndex=0;

}

openStreet(
cities[currentIndex],
currentIndex
);

}

/* ===== AUTO WALK ===== */

function autoWalk(){

clearInterval(autoWalkInterval);

document.getElementById('walk').innerHTML=
`
AUTO WALK ACTIVE<br>
urban navigation...
`;

autoWalkInterval=setInterval(()=>{

const city=
cities[currentIndex];

const data=
cityData[city] || cityData["Tokyo"];

const lat=data.coords[0];
const lng=data.coords[1];

const headings=[

0,
45,
90,
135,
180,
225,
270,
315

];

const heading=
headings[
Math.floor(Math.random()*headings.length)
];

const zooms=[0,2,5];

const zoom=
zooms[
Math.floor(Math.random()*zooms.length)
];

const rLat=
(lat+(Math.random()-.5)/300).toFixed(6);

const rLng=
(lng+(Math.random()-.5)/300).toFixed(6);

frame.src=
`https://www.google.com/maps?q=&layer=c&cbll=${rLat},${rLng}&cbp=11,${heading},0,${zoom},0&output=svembed`;

const routes=[

"walking forward...",
"crossing avenue...",
"turning right...",
"moving through district...",
"approaching intersection...",
"navigating downtown...",
"scanning urban sector...",
"moving toward neon zone..."

];

const random=
routes[
Math.floor(Math.random()*routes.length)
];

document.getElementById('guide').innerHTML=
`
AI WALK<br>
${random}
`;

document.getElementById('walk').innerHTML=
`
AUTO WALK ACTIVE<br>
${random}
`;

},7000);

}

/* ===== STOP ===== */

function stopWalk(){

clearInterval(autoWalkInterval);

document.getElementById('walk').innerHTML=
`
AUTO WALK STOPPED<br>
manual control
`;

}

/* ===== MODES ===== */

function nightMode(){

frame.style.filter=
'brightness(.55) contrast(1.3) saturate(.8)';

}

function cinemaMode(){

frame.style.filter=
'contrast(1.15) saturate(1.2) brightness(.95)';

}

function matrixMode(){

frame.style.filter=
'hue-rotate(90deg) saturate(1.5) brightness(.8)';

document.body.classList.add('glitch');

}

function cyberpunkMode(){

frame.style.filter=
'hue-rotate(-40deg) saturate(1.8) contrast(1.2)';

}

function droneMode(){

frame.style.filter=
'grayscale(.35) contrast(1.4)';

}

/* ===== RESET ===== */

function resetMode(){

location.reload();

}

/* ===== START ===== */

openStreet("Tokyo",0);

</script>

</body>
</html>
