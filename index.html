<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>LABORANT2 · WINDOW</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  font-family: "Courier New", monospace;
}

/* контейнер */
.wrapper {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* секції */
.section {
  width: 100%;
  flex: 1;
  border: none;
}

/* iframe */
iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #000;
}

/* fallback кнопка */
.fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  color: #ffd166;
  font-size: 14px;
  text-align: center;
}

.fallback a {
  color: #ffd166;
  text-decoration: none;
  border: 1px solid #ffd166;
  padding: 10px 16px;
}

.fallback a:hover {
  background: #ffd166;
  color: #000;
}

/* мобільна адаптація */
@media (max-width: 768px) {
  .wrapper {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- ВЕРХНЯ СЕКЦІЯ -->
  <div class="section">
    <iframe
      src="https://github.dev/lavandaaudit/fisicman"
      title="FISICMAN"
    ></iframe>
  </div>

  <!-- НИЖНЯ СЕКЦІЯ -->
  <div class="section">
    <iframe
      src="https://lavandaaudit.github.io/new13/"
      title="NEW13"
    ></iframe>
  </div>

</div>

</body>
</html>
