<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaktika + EXP-02</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    /* Контейнер для iframe */
    .frame-container {
      width: 100%;
      /* висота по вмісту не фіксується, щоб скрол працював */
      min-height: 100vh;
      margin-bottom: 0;
      border: none;
    }

    /* iframe адаптивний */
    iframe {
      width: 100%;
      height: 100vh; /* Кожен iframe займає всю висоту екрану */
      border: none;
      display: block;
    }

    /* Мобільні стилі */
    @media (max-width: 768px) {
      iframe {
        height: 80vh; /* трішки менше, щоб було видно частину наступного */
      }
    }
  </style>
</head>

<body>
  <!-- Перша сторінка -->
  <div class="frame-container">
    <iframe
      src="https://lavandaaudit.github.io/galaktika/"
      title="Galaktika"
      scrolling="auto"
      loading="lazy"
    ></iframe>
  </div>

  <!-- Друга сторінка -->
  <div class="frame-container">
    <iframe
      src="https://lavandaaudit.github.io/exp-02/"
      title="EXP-02"
      scrolling="auto"
      loading="lazy"
    ></iframe>
  </div>
</body>
</html>
