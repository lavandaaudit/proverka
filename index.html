<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IBONIRIUM · EXP-03 · Galactic Fields</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#000;
  overflow:hidden;
}
canvas { position:fixed; inset:0; }
#info {
  position:fixed;
  bottom:12px; left:12px;
  font-family:monospace;
  color:#baffea;
  font-size:12px;
  line-height:1.4;
  opacity:0.85;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<canvas id="terrarium"></canvas>

<div id="info">
<b>IBONIRIUM · GALACTIC TERRARIUM</b><br>
Phase: <span id="phase">Expansion / Compression</span><br>
Day: <span id="day">–</span>
</div>

<script>
const starCanvas = document.getElementById('stars');
const tCanvas = document.getElementById('terrarium');
const sctx = starCanvas.getContext('2d');
const tctx = tCanvas.getContext('2d');

function resize(){
  starCanvas.width = tCanvas.width = innerWidth;
  starCanvas.height = tCanvas.height = innerHeight;
}
addEventListener('resize', resize); resize();

/* BACKGROUND STARS */
const stars = Array.from({length:400},()=>({
  x:Math.random(), y:Math.random(), z:Math.random()*0.8+0.2
}));
function drawStars(){
  sctx.clearRect(0,0,starCanvas.width,starCanvas.height);
  stars.forEach(s=>{
    sctx.globalAlpha = 0.2 + s.z*0.4;
    sctx.fillStyle="#fff";
    sctx.beginPath();
    sctx.arc(s.x*starCanvas.width, s.y*starCanvas.height, s.z*1.4, 0, Math.PI*2);
    sctx.fill();
  });
  sctx.globalAlpha = 1;
}

/* SLOW COSMIC BREATH */
function cosmicBreath(){
  return Math.sin(Date.now()*0.00003);
}

/* GALACTIC COLORS */
const COLORS = [
  'rgba(255,220,140,0.7)',
  'rgba(180,240,255,0.7)',
  'rgba(200,180,255,0.7)',
  'rgba(255,180,210,0.7)',
  'rgba(190,255,200,0.7)'
];

/* GALAXY CLASS */
class Galaxy{
  constructor(x,y){
    this.baseX = x;
    this.baseY = y;
    this.angle = Math.random()*Math.PI*2;
    this.spin = (Math.random()*0.5+0.2)*0.0002;
    this.radius = 40 + Math.random()*40;
    this.color = COLORS[Math.floor(Math.random()*COLORS.length)];
    this.armCount = 3 + Math.floor(Math.random()*3);
    this.phase = Math.random()*Math.PI*2;
  }

  update(){
    this.angle += this.spin;
  }

  position(){
    const b = cosmicBreath();
    const shift = b * 120;
    return {
      x: this.baseX + Math.cos(this.phase)*shift,
      y: this.baseY + Math.sin(this.phase)*shift
    };
  }

  draw(){
    const pos = this.position();
    const pulse = 1 + cosmicBreath()*0.25;

    tctx.strokeStyle = this.color;
    tctx.lineWidth = 0.8;
    tctx.shadowColor = this.color;
    tctx.shadowBlur = 10;

    for(let a=0; a<this.armCount; a++){
      tctx.beginPath();
      for(let i=0;i<140;i++){
        const t = i/140;
        const r = this.radius * t * pulse;
        const ang = t*4*Math.PI + this.angle + a*(Math.PI*2/this.armCount);
        const x = pos.x + Math.cos(ang)*r;
        const y = pos.y + Math.sin(ang)*r;
        i===0 ? tctx.moveTo(x,y) : tctx.lineTo(x,y);
      }
      tctx.stroke();
    }

    // ядро
    tctx.shadowBlur = 20;
    tctx.fillStyle = this.color;
    tctx.beginPath();
    tctx.arc(pos.x,pos.y,4+pulse*2,0,Math.PI*2);
    tctx.fill();
    tctx.shadowBlur = 0;
  }
}

/* GALAXIES */
const galaxies = Array.from({length:9},()=>new Galaxy(
  innerWidth*0.2 + Math.random()*innerWidth*0.6,
  innerHeight*0.2 + Math.random()*innerHeight*0.6
));

/* GRAVITATIONAL LINKS */
function drawLinks(){
  const b = cosmicBreath();
  tctx.strokeStyle = `rgba(180,220,255,${0.08+Math.abs(b)*0.15})`;
  tctx.lineWidth = 0.6;

  for(let i=0;i<galaxies.length;i++){
    for(let j=i+1;j<galaxies.length;j++){
      const p1 = galaxies[i].position();
      const p2 = galaxies[j].position();
      const d = Math.hypot(p1.x-p2.x,p1.y-p2.y);
      if(d < 520){
        tctx.beginPath();
        tctx.moveTo(p1.x,p1.y);
        tctx.lineTo(p2.x,p2.y);
        tctx.stroke();
      }
    }
  }
}

/* TIME */
const START_DATE=new Date('2026-01-01');
function updateDay(){
  const now=new Date();
  day.textContent=Math.floor((now-START_DATE)/86400000);
}
setInterval(updateDay,60000); updateDay();

/* LOOP */
function loop(){
  drawStars();
  tctx.clearRect(0,0,tCanvas.width,tCanvas.height);

  galaxies.forEach(g=>{ g.update(); g.draw(); });
  drawLinks();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
