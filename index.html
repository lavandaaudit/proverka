<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ibonarium World Radio — The world sounds better together</title>
  <meta name="description" content="Discover and listen to live radio stations from every corner of the world on an interactive 3D globe.">
  <meta name="author" content="Ibonarium Cosmo Dynamics Lab">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23090314' stroke='%23e00279' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e00279'/%3E%3Cpath d='M16 4 A12 12 0 0 1 28 16' stroke='%23ff2d92' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-space: #030008;
      --pink-primary: #e00279;
      --pink-neon: #ff2d92;
      --pink-glow: #ff54a2;
      --pink-subtle: rgba(224, 2, 121, 0.15);
      --purple-accent: #8b28cf;
      --purple-glow: rgba(139, 40, 207, 0.35);
      --card-bg: rgba(12, 6, 22, 0.76);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-border-active: rgba(224, 2, 121, 0.5);
      --text-white: #ffffff;
      --text-muted: #8e8a9f;
      --text-dim: #5c5770;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Space Grotesk', var(--font-main);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-space);
      font-family: var(--font-main);
      color: var(--text-white);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      outline: none;
    }

    input {
      font-family: inherit;
    }

    /* App container */
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 70% 45%, #15062a 0%, #080212 45%, #030008 100%);
    }

    /* 3D Canvas */
    #globe-canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }
    #globe-canvas-container:active {
      cursor: grabbing;
    }

    /* Ambient Lighting Overlays */
    .space-glow {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      border-radius: 50%;
      filter: blur(90px);
    }
    .space-glow-1 {
      top: -100px;
      left: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(139, 40, 207, 0.15) 0%, transparent 70%);
    }
    .space-glow-2 {
      bottom: -150px;
      right: 15%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(224, 2, 121, 0.1) 0%, transparent 70%);
    }

    /* Top Bar */
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 36px;
      pointer-events: none;
    }
    .topbar > * {
      pointer-events: auto;
    }

    /* Brand Logo */
    .brand-container {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .brand-emblem-svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 0 12px rgba(224, 2, 121, 0.35));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .brand-container:hover .brand-emblem-svg {
      transform: scale(1.06) rotate(6deg);
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand-title-main {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1;
    }
    .brand-title-sub {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--pink-neon);
      text-transform: uppercase;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255, 45, 146, 0.4);
    }

    /* Top right live status badge */
    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .zoom-hint-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(18, 7, 28, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 500;
    }
    .zoom-hint-pill svg {
      color: var(--pink-neon);
    }

    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      background: rgba(18, 7, 28, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(224, 2, 121, 0.45);
      border-radius: 999px;
      color: #ff54a2;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      box-shadow: 0 0 20px rgba(224, 2, 121, 0.18), inset 0 0 10px rgba(224, 2, 121, 0.1);
      transition: all 0.25s ease;
    }
    .live-status-pill:hover {
      background: rgba(30, 10, 48, 0.85);
      border-color: var(--pink-neon);
      box-shadow: 0 0 26px rgba(255, 45, 146, 0.35);
      color: #ffffff;
    }
    .live-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink-neon);
      box-shadow: 0 0 10px var(--pink-neon);
      animation: livePulse 1.8s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }

    /* Main Left Container */
    .main-content {
      position: absolute;
      top: 100px;
      left: 36px;
      bottom: 28px;
      width: 390px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 20px;
      pointer-events: none;
      overflow-y: auto;
      padding-right: 8px;
    }
    .main-content::-webkit-scrollbar {
      width: 4px;
    }
    .main-content::-webkit-scrollbar-thumb {
      background: rgba(224, 2, 121, 0.2);
      border-radius: 4px;
    }
    .main-content > * {
      pointer-events: auto;
    }

    /* Hero Typography */
    .hero-text-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 2px;
    }
    .hero-title {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: #ffffff;
    }
    .hero-title .pink-accent {
      color: var(--pink-neon);
      background: linear-gradient(135deg, #ff2d92 0%, #e00279 60%, #ff6aa9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 45, 146, 0.4);
      display: inline-block;
    }
    .hero-subtitle {
      font-size: 13.5px;
      line-height: 1.45;
      color: #9d98ad;
      max-width: 340px;
      font-weight: 400;
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 10% 0%, rgba(224, 2, 121, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* 1. Mini Player Card */
    .player-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .player-card:hover {
      border-color: rgba(224, 2, 121, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(224, 2, 121, 0.12);
    }

    .player-top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .station-art-thumb {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1b0a2c, #3a0d42);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }
    .station-art-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .station-art-fallback {
      width: 24px;
      height: 24px;
      color: var(--pink-neon);
      opacity: 0.9;
    }

    .station-header-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Soundwave bars */
    .soundwave-indicator {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 18px;
      flex-shrink: 0;
    }
    .soundwave-bar {
      width: 3px;
      height: 100%;
      background: var(--pink-neon);
      border-radius: 2px;
      transform-origin: bottom;
      box-shadow: 0 0 6px var(--pink-neon);
    }
    .playing .soundwave-bar:nth-child(1) { animation: soundwave 1s infinite ease-in-out; }
    .playing .soundwave-bar:nth-child(2) { animation: soundwave 0.8s infinite ease-in-out 0.15s; }
    .playing .soundwave-bar:nth-child(3) { animation: soundwave 1.2s infinite ease-in-out 0.3s; }
    .playing .soundwave-bar:nth-child(4) { animation: soundwave 0.9s infinite ease-in-out 0.45s; }

    @keyframes soundwave {
      0%, 100% { transform: scaleY(0.25); }
      50% { transform: scaleY(1); }
    }

    .station-meta {
      flex: 1;
      min-width: 0;
    }
    .station-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }
    .station-country {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Player Controls */
    .player-controls-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: 2px;
    }

    .control-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border-radius: 50%;
      transition: all 0.2s ease;
    }
    .control-btn:hover {
      color: #ffffff;
      transform: scale(1.1);
    }
    .control-btn:active {
      transform: scale(0.95);
    }

    .main-play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff4099, var(--pink-primary));
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(224, 2, 121, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .main-play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 26px rgba(255, 45, 146, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }
    .main-play-btn:active {
      transform: scale(0.96);
    }

    /* Volume Slider */
    .volume-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      margin-left: 4px;
    }
    .volume-icon-btn {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      transition: color 0.2s ease;
    }
    .volume-icon-btn:hover {
      color: #ffffff;
    }

    .volume-range-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      cursor: pointer;
      position: relative;
    }
    .volume-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--pink-neon);
      cursor: pointer;
      box-shadow: 0 0 10px var(--pink-neon);
      transition: transform 0.15s ease;
    }
    .volume-range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    .volume-range-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--pink-neon);
      border: none;
      cursor: pointer;
      box-shadow: 0 0 10px var(--pink-neon);
    }

    /* 2. Stations Playlist Card */
    .playlist-card {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .station-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 14px;
      background: transparent;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }
    .station-list-item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.06);
    }
    .station-list-item.active {
      background: linear-gradient(90deg, rgba(224, 2, 121, 0.18) 0%, rgba(139, 40, 207, 0.08) 100%);
      border-color: var(--card-border-active);
      box-shadow: inset 0 0 16px rgba(224, 2, 121, 0.08);
    }

    .item-icon-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      color: #ffffff;
      position: relative;
    }
    .badge-pink {
      background: linear-gradient(135deg, #e00279, #9c0054);
      box-shadow: 0 0 12px rgba(224, 2, 121, 0.35);
    }
    .badge-blue {
      background: linear-gradient(135deg, #0072ff, #0043a8);
      box-shadow: 0 0 12px rgba(0, 114, 255, 0.3);
    }
    .badge-orange {
      background: linear-gradient(135deg, #ff7700, #cc4400);
      box-shadow: 0 0 12px rgba(255, 119, 0, 0.3);
    }
    .badge-magenta {
      background: linear-gradient(135deg, #d6006e, #880044);
      box-shadow: 0 0 12px rgba(214, 0, 110, 0.3);
    }
    .badge-dark {
      background: linear-gradient(135deg, #201a33, #0d0a17);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }
    .item-name {
      font-size: 13px;
      font-weight: 600;
      color: #e5e2f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .station-list-item.active .item-name {
      color: #ffffff;
      font-weight: 700;
    }
    .item-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .station-list-item.active .item-sub {
      color: #c988bb;
    }

    .item-play-action {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(224, 2, 121, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--pink-neon);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .station-list-item:hover .item-play-action {
      background: var(--pink-neon);
      color: #ffffff;
      border-color: var(--pink-neon);
      box-shadow: 0 0 12px rgba(255, 45, 146, 0.6);
      transform: scale(1.08);
    }
    .station-list-item.active .item-play-action {
      background: var(--pink-primary);
      color: #ffffff;
      border-color: var(--pink-primary);
      box-shadow: 0 0 14px rgba(224, 2, 121, 0.7);
    }

    /* Playlist bottom link */
    .playlist-footer-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--pink-neon);
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border-radius: 10px;
    }
    .playlist-footer-btn:hover {
      color: #ffffff;
      background: rgba(224, 2, 121, 0.12);
      transform: translateX(3px);
    }
    .playlist-footer-btn svg {
      transition: transform 0.2s ease;
    }
    .playlist-footer-btn:hover svg {
      transform: translateX(4px);
    }

    /* Search & Full Catalog Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(4, 1, 10, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .catalog-modal {
      width: 100%;
      max-width: 680px;
      max-height: 85vh;
      background: #0d0618;
      border: 1px solid rgba(224, 2, 121, 0.3);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(224, 2, 121, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .catalog-header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .catalog-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .catalog-title-badge {
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(224, 2, 121, 0.2);
      border: 1px solid rgba(224, 2, 121, 0.4);
      color: var(--pink-neon);
      border-radius: 6px;
    }
    .catalog-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }
    .catalog-close-btn:hover {
      background: rgba(224, 2, 121, 0.3);
      color: #ffffff;
    }

    .catalog-search-bar {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }
    .catalog-search-input {
      width: 100%;
      height: 44px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0 42px 0 42px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    .catalog-search-input:focus {
      border-color: var(--pink-neon);
      background: rgba(224, 2, 121, 0.06);
      box-shadow: 0 0 16px rgba(224, 2, 121, 0.2);
    }
    .catalog-search-icon {
      position: absolute;
      left: 36px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }

    .catalog-filter-tags {
      display: flex;
      gap: 8px;
      padding: 12px 24px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .catalog-filter-tags::-webkit-scrollbar {
      display: none;
    }
    .tag-pill {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tag-pill:hover, .tag-pill.active {
      background: rgba(224, 2, 121, 0.2);
      border-color: var(--pink-neon);
      color: #ffffff;
    }

    .catalog-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .catalog-list::-webkit-scrollbar {
      width: 6px;
    }
    .catalog-list::-webkit-scrollbar-thumb {
      background: rgba(224, 2, 121, 0.25);
      border-radius: 4px;
    }

    /* 3D Tooltip */
    #globe-tooltip {

  <script type="importmap">

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =================================================================
    // CONFIG & STATE
    // =================================================================
    const GLOBE_RADIUS = 2.4;
    const RADIO_API_MIRRORS = [
      'https://de1.api.radio-browser.info',
      'https://nl1.api.radio-browser.info',
      'https://at1.api.radio-browser.info'
    ];

    // High resolution textures for realistic clean continents (NO Z-FIGHTING)
    const EARTH_TEXTURE_URL = 'https://unpkg.com/three-globe@2.31.0/example/img/earth-blue-marble.jpg';
    const EARTH_BUMP_URL = 'https://unpkg.com/three-globe@2.31.0/example/img/earth-topology.png';

    // Reference presets
    const PRESET_STATIONS = [
      {
        stationuuid: 'barnstaple-uk-01',
        name: 'Barnstaple',
        country: 'United Kingdom',
        tags: 'Pop · Hits',
        url: 'https://stream.thevoicefm.co.uk/thevoice',
        url_resolved: 'https://stream.thevoicefm.co.uk/thevoice',
        geo_lat: 51.08,
        geo_long: -4.06,
        badgeType: 'pink',
        badgeIcon: 'waves'
      },
      {
        stationuuid: 'deutschlandfunk-de',
        name: 'Deutschlandfunk',
        country: 'Germany',
        tags: 'Culture · News',
        url: 'https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3',
        url_resolved: 'https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3',
        geo_lat: 50.9375,
        geo_long: 6.9603,
        badgeType: 'blue',
        badgeText: '≡'
      },
      {
        stationuuid: '0n-70s-radio',
        name: '- 0 N - 70s on Radio',
        country: 'Germany',
        tags: '70s · 70s',
        url: 'https://0n-70s.radionetz.de/0n-70s.mp3',
        url_resolved: 'https://0n-70s.radionetz.de/0n-70s.mp3',
        geo_lat: 52.52,
        geo_long: 13.405,
        badgeType: 'orange',
        badgeText: '70s'
      },
      {
        stationuuid: '0n-80s-radio',
        name: '- 0 N - 80s on Radio',
        country: 'Germany',
        tags: '80s · 80s',
        url: 'https://0n-80s.radionetz.de/0n-80s.mp3',
        url_resolved: 'https://0n-80s.radionetz.de/0n-80s.mp3',
        geo_lat: 48.1351,
        geo_long: 11.582,
        badgeType: 'magenta',
        badgeText: '80s'
      },
      {
        stationuuid: 'deutschrap-hiphop',
        name: 'Deutschrap',
        country: 'Germany',
        tags: 'Hip-Hop · Deutschrap',
        url: 'https://stream.bigfm.de/deutschrap/mp3-128',
        url_resolved: 'https://stream.bigfm.de/deutschrap/mp3-128',
        geo_lat: 48.7758,
        geo_long: 9.1829,
        badgeType: 'dark',
        badgeIcon: 'radio'
      }
    ];

    const state = {
      stations: [...PRESET_STATIONS],
      activeStation: PRESET_STATIONS[0],
      isPlaying: false,
      volume: 0.8,
      audio: null,
      markerMeshes: [],
      radarBeacon: null,
      hoveredStation: null
    };

    // =================================================================
    // AUDIO ENGINE
    // =================================================================
    function initAudioEngine() {
      state.audio = new Audio();
      state.audio.crossOrigin = 'anonymous';
      state.audio.volume = state.volume;

      state.audio.addEventListener('play', () => {
        state.isPlaying = true;
        updateUIState();
      });

      state.audio.addEventListener('pause', () => {
        state.isPlaying = false;
        updateUIState();
      });

      state.audio.addEventListener('error', (e) => {
        console.warn('Audio stream error, attempting fallback:', e);
        state.isPlaying = false;
        updateUIState();
      });
    }

    function playStation(station) {
      if (!station) return;
      state.activeStation = station;

      if (state.audio) {
        state.audio.src = station.url_resolved || station.url;
        state.audio.play().then(() => {
          state.isPlaying = true;
          updateUIState();
        }).catch(err => {
          console.warn('Audio autoplay requires user interaction:', err);
          state.isPlaying = false;
          updateUIState();
        });
      }

      // Update radar beacon position on 3D globe
      updateRadarBeacon(station.geo_lat, station.geo_long);

      // Smoothly rotate and fly camera towards the selected station for close-up view
      flyToStation(station.geo_lat, station.geo_long);

      updateUIState();
      renderQuickPlaylist();
    }

    function togglePlay() {
      if (!state.audio) return;
      if (state.isPlaying) {
        state.audio.pause();
      } else {
        if (!state.audio.src && state.activeStation) {
          state.audio.src = state.activeStation.url_resolved || state.activeStation.url;
        }
        state.audio.play().catch(console.error);
      }
    }

    function playNext() {
      const idx = state.stations.findIndex(s => s.stationuuid === state.activeStation.stationuuid);
      const nextIdx = (idx + 1) % state.stations.length;
      playStation(state.stations[nextIdx]);
    }

    function playPrev() {
      const idx = state.stations.findIndex(s => s.stationuuid === state.activeStation.stationuuid);
      const prevIdx = (idx - 1 + state.stations.length) % state.stations.length;
      playStation(state.stations[prevIdx]);
    }

    // =================================================================
    // 3D SCENE & REALISTIC CLEAN EARTH (THREE.JS)
    // =================================================================
    let scene, camera, renderer, controls;
    let globeGroup, earthMesh;
    let radarRings = [];
    let targetCameraPosition = null;

    function latLonToVector3(lat, lon, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    function vector3ToLatLon(vec) {
      const radius = vec.length();
      const phi = Math.acos(vec.y / radius);
      const theta = Math.atan2(vec.z, -vec.x);
      const lat = 90 - (phi * 180 / Math.PI);
      const lon = (theta * 180 / Math.PI) - 180;
      return { lat, lon };
    }

    function init3DScene() {
      const container = document.getElementById('globe-canvas-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

      // Set initial camera position (deep zoom available)
      updateCameraPosition();

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;
      container.appendChild(renderer.domElement);

      // Smooth Orbit Controls with DEEP CLOSE-UP ZOOM
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;
      controls.enableZoom = true;
      controls.zoomSpeed = 0.9;
      // Allow zooming very close to Earth surface (surface radius is 2.4)
      controls.minDistance = 2.65;
      controls.maxDistance = 12.0;
      controls.rotateSpeed = 0.6;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.35;

      // Group holding the Earth and markers
      globeGroup = new THREE.Group();
      scene.add(globeGroup);

      // Lighting for realistic 3D topography & specular oceans
      setupLighting();

      // Clean, High-Def Realistic Earth Globe (NO Z-fighting stripes)
      createRealisticCleanEarth();

      // Station markers (with enlarged clickable hitbox)
      createStationMarkers();

      // Active Station Sonar / Radar Beacon
      createRadarBeacon();

      // Background stars
      createStarfield();

      // Ultra-responsive Raycasting for instant clickable points on Earth
      setupRaycaster(container);

      // Zoom Buttons
      setupZoomButtons();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function setupLighting() {
      // Ambient Light for dark side clarity
      const ambientLight = new THREE.AmbientLight(0x2d1b4e, 1.4);
      scene.add(ambientLight);

      // Main Sun Light (illuminates continents cleanly)
      const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
      sunLight.position.set(6, 4, 7);
      scene.add(sunLight);

      // Secondary Magenta/Pink Rim Light (matches brand aesthetic)
      const rimLight = new THREE.DirectionalLight(0xe00279, 1.8);
      rimLight.position.set(-6, -3, -5);
      scene.add(rimLight);

      const purplePoint = new THREE.PointLight(0x9d4edd, 1.4, 20);
      purplePoint.position.set(4, -4, 5);
      scene.add(purplePoint);
    }

    function updateCameraPosition() {
      if (window.innerWidth > 900) {
        // Desktop: Globe placed aesthetically to the right
        camera.position.set(1.4, 0.3, 5.8);
        if (controls) controls.target.set(1.0, 0, 0);
      } else {
        // Mobile: Centered globe
        camera.position.set(0, 0, 6.2);
        if (controls) controls.target.set(0, 0, 0);
      }
    }

    function createRealisticCleanEarth() {
      const textureLoader = new THREE.TextureLoader();
      textureLoader.crossOrigin = 'anonymous';

      // Single clean Earth Sphere - Eliminates Z-fighting artifacts completely
      const earthGeo = new THREE.SphereGeometry(GLOBE_RADIUS, 128, 128);

      const earthMat = new THREE.MeshStandardMaterial({
        color: 0x332244,
        roughness: 0.7,
        metalness: 0.1,
        emissive: new THREE.Color(0x0c0418),
        emissiveIntensity: 0.25
      });

      earthMesh = new THREE.Mesh(earthGeo, earthMat);
      globeGroup.add(earthMesh);

      // Load Blue Marble Real Texture
      textureLoader.load(
        EARTH_TEXTURE_URL,
        (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = 8;
          earthMat.map = tex;
          earthMat.color = new THREE.Color(0xffffff);
          earthMat.needsUpdate = true;
        },
        undefined,
        (err) => console.warn('Earth texture load error:', err)
      );

      // Load Topography Bump Map (mountains and coastlines relief)
      textureLoader.load(
        EARTH_BUMP_URL,
        (bumpTex) => {
          earthMat.bumpMap = bumpTex;
          earthMat.bumpScale = 0.035;
          earthMat.needsUpdate = true;
        }
      );

      // Neon Atmospheric Glow (Pink & Violet Rim)
      const atmGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 1.025, 64, 64);
      const atmMat = new THREE.ShaderMaterial({
        transparent: true,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        uniforms: {
          glowColor: { value: new THREE.Color(0xe00279) }
        },
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          uniform vec3 glowColor;
          void main() {
            float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 2.0);
            gl_FragColor = vec4(glowColor, intensity * 0.5);
          }
        `
      });
      const atmMesh = new THREE.Mesh(atmGeo, atmMat);
      globeGroup.add(atmMesh);
    }

    // =================================================================
    // STATION MARKERS ON 3D GLOBE (HIGH-CLICKABILITY HITBOXES)
    // =================================================================
    const markerGroup = new THREE.Group();

    function createStationMarkers() {
      globeGroup.add(markerGroup);
      renderStationMarkers();
    }

    function renderStationMarkers() {
      // Clear existing
      while (markerGroup.children.length > 0) {
        const obj = markerGroup.children[0];
        markerGroup.remove(obj);
      }
      state.markerMeshes = [];

      state.stations.forEach(st => {
        if (st.geo_lat == null || st.geo_long == null) return;
        const pos = latLonToVector3(st.geo_lat, st.geo_long, GLOBE_RADIUS * 1.01);

        const stationPointGroup = new THREE.Group();
        stationPointGroup.position.copy(pos);
        stationPointGroup.userData = { station: st };

        // Visible glowing neon dot
        const dotGeo = new THREE.SphereGeometry(0.042, 16, 16);
        const dotMat = new THREE.MeshBasicMaterial({
          color: 0xff2d92,
          transparent: true,
          opacity: 0.95,
          blending: THREE.AdditiveBlending
        });
        const dotMesh = new THREE.Mesh(dotGeo, dotMat);
        stationPointGroup.add(dotMesh);

        // Halo glow
        const haloGeo = new THREE.SphereGeometry(0.08, 12, 12);
        const haloMat = new THREE.MeshBasicMaterial({
          color: 0xe00279,
          transparent: true,
          opacity: 0.35,
          blending: THREE.AdditiveBlending
        });
        const haloMesh = new THREE.Mesh(haloGeo, haloMat);
        stationPointGroup.add(haloMesh);

        // Invisible large click-target hitbox (0.16 diameter for effortless clicks)
        const hitGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const hitMat = new THREE.MeshBasicMaterial({
          visible: false
        });
        const hitMesh = new THREE.Mesh(hitGeo, hitMat);
        hitMesh.userData = { station: st };
        stationPointGroup.add(hitMesh);

        markerGroup.add(stationPointGroup);
        state.markerMeshes.push(hitMesh); // raycaster checks this generous hitbox
      });
    }

    // =================================================================
    // ACTIVE STATION RADAR BEACON (CONCENTRIC PULSING RINGS)
    // =================================================================
    function createRadarBeacon() {
      state.radarBeacon = new THREE.Group();
      globeGroup.add(state.radarBeacon);

      radarRings = [];
      const ringCount = 3;

      for (let i = 0; i < ringCount; i++) {
        const ringGeo = new THREE.RingGeometry(0.04, 0.065, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xff2d92,
          transparent: true,
          opacity: 0.85,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        state.radarBeacon.add(ringMesh);
        radarRings.push({ mesh: ringMesh, progress: i / ringCount });
      }

      // Center bright core
      const coreGeo = new THREE.SphereGeometry(0.045, 16, 16);
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        blending: THREE.AdditiveBlending
      });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      state.radarBeacon.add(coreMesh);

      if (state.activeStation) {
        updateRadarBeacon(state.activeStation.geo_lat, state.activeStation.geo_long);
      }
    }

    function updateRadarBeacon(lat, lon) {
      if (!state.radarBeacon || lat == null || lon == null) return;
      const pos = latLonToVector3(lat, lon, GLOBE_RADIUS * 1.012);
      state.radarBeacon.position.copy(pos);

      // Align radar rings tangent to the globe surface
      const normal = pos.clone().normalize();
      state.radarBeacon.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
    }

    function flyToStation(lat, lon) {
      if (lat == null || lon == null || !controls) return;

      // Pause auto-rotation when focusing on station
      controls.autoRotate = false;

      // Calculate target 3D vector
      const targetPos = latLonToVector3(lat, lon, 3.8); // zoom in close distance

      // Apply smooth camera positioning
      targetCameraPosition = {
        x: targetPos.x + (window.innerWidth > 900 ? 0.7 : 0),
        y: targetPos.y,
        z: targetPos.z
      };

      setTimeout(() => {
        controls.autoRotate = true;
        targetCameraPosition = null;
      }, 7000);
    }

    function setupZoomButtons() {
      document.getElementById('btn-zoom-in').addEventListener('click', () => {
        const dir = camera.position.clone().sub(controls.target).normalize();
        const dist = camera.position.distanceTo(controls.target);
        if (dist > controls.minDistance + 0.3) {
          camera.position.addScaledVector(dir, -0.6);
        }
      });

      document.getElementById('btn-zoom-out').addEventListener('click', () => {
        const dir = camera.position.clone().sub(controls.target).normalize();
        const dist = camera.position.distanceTo(controls.target);
        if (dist < controls.maxDistance - 0.5) {
          camera.position.addScaledVector(dir, 0.8);
        }
      });

      document.getElementById('btn-reset-cam').addEventListener('click', () => {
        updateCameraPosition();
        controls.autoRotate = true;
      });
    }

    function createStarfield() {
      const count = 1800;
      const positions = [];
      for (let i = 0; i < count; i++) {
        const r = 30 + Math.random() * 50;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions.push(
          r * Math.sin(phi) * Math.cos(theta),
          r * Math.sin(phi) * Math.sin(theta),
          r * Math.cos(phi)
        );
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.14,
        color: 0xd8b4e2,
        transparent: true,
        opacity: 0.65
      });
      const stars = new THREE.Points(geo, mat);
      scene.add(stars);
    }

    // =================================================================
    // DIRECT CLICK & HOVER RAYCASTING (INSTANT RADIO ON CLICK)
    // =================================================================
    function setupRaycaster(domElement) {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const tooltip = document.getElementById('globe-tooltip');
      const ttName = document.getElementById('tt-name');
      const ttCountry = document.getElementById('tt-country');

      let isDown = false;
      let startX = 0;
      let startY = 0;

      domElement.addEventListener('pointerdown', (e) => {
        isDown = true;
        startX = e.clientX;
        startY = e.clientY;
      });

      domElement.addEventListener('pointermove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        // Check markers first
        const markerIntersects = raycaster.intersectObjects(state.markerMeshes, false);

        if (markerIntersects.length > 0) {
          domElement.style.cursor = 'pointer';
          const st = markerIntersects[0].object.userData.station;
          state.hoveredStation = st;

          ttName.textContent = st.name;
          ttCountry.textContent = st.country || 'Live Radio';
          tooltip.style.display = 'block';
          tooltip.style.left = e.clientX + 'px';
          tooltip.style.top = e.clientY + 'px';
        } else if (earthMesh) {
          // Check Earth surface proximity to nearby station
          const earthIntersects = raycaster.intersectObject(earthMesh, false);
          if (earthIntersects.length > 0) {
            const hitPoint = earthIntersects[0].point;
            // Find if any station is close to hovered surface point
            const hitCoord = vector3ToLatLon(hitPoint.clone().sub(globeGroup.position));
            const nearest = findNearestStation(hitCoord.lat, hitCoord.lon, 12.0); // within 12 degrees

            if (nearest) {
              domElement.style.cursor = 'pointer';
              state.hoveredStation = nearest;
              ttName.textContent = nearest.name;
              ttCountry.textContent = nearest.country || 'Live Radio';
              tooltip.style.display = 'block';
              tooltip.style.left = e.clientX + 'px';
              tooltip.style.top = e.clientY + 'px';
              return;
            }
          }
          domElement.style.cursor = isDown ? 'grabbing' : 'grab';
          state.hoveredStation = null;
          tooltip.style.display = 'none';
        } else {
          domElement.style.cursor = isDown ? 'grabbing' : 'grab';
          state.hoveredStation = null;
          tooltip.style.display = 'none';
        }
      });

      // INSTANT PLAY ON CLICK
      domElement.addEventListener('pointerup', (e) => {
        isDown = false;
        const diffX = Math.abs(e.clientX - startX);
        const diffY = Math.abs(e.clientY - startY);

        // Only register as click if not dragging the globe around
        if (diffX < 7 && diffY < 7) {
          if (state.hoveredStation) {
            playStation(state.hoveredStation);
          } else if (earthMesh) {
            // If clicked on Earth surface, find and play nearest station
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const earthIntersects = raycaster.intersectObject(earthMesh, false);

            if (earthIntersects.length > 0) {
              const hitPoint = earthIntersects[0].point;
              const hitCoord = vector3ToLatLon(hitPoint.clone().sub(globeGroup.position));
              const nearest = findNearestStation(hitCoord.lat, hitCoord.lon, 35.0);
              if (nearest) {
                playStation(nearest);
              }
            }
          }
        }
      });
    }

    function findNearestStation(lat, lon, maxDistanceDegrees = 25.0) {
      let nearest = null;
      let minDistance = Infinity;

      for (const st of state.stations) {
        if (st.geo_lat == null || st.geo_long == null) continue;
        const dLat = st.geo_lat - lat;
        const dLon = st.geo_long - lon;
        const dist = Math.sqrt(dLat * dLat + dLon * dLon);
        if (dist < minDistance && dist <= maxDistanceDegrees) {
          minDistance = dist;
          nearest = st;
        }
      }
      return nearest;
    }

    // =================================================================
    // ANIMATION LOOP
    // =================================================================
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // Animate pulsing radar beacon rings
      radarRings.forEach(r => {
        r.progress = (r.progress + delta * 0.65) % 1.0;
        const scale = 1.0 + r.progress * 4.2;
        r.mesh.scale.set(scale, scale, 1);
        r.mesh.material.opacity = (1.0 - r.progress) * 0.85;
      });

      // Camera lerp if flying to station
      if (targetCameraPosition) {
        camera.position.lerp(new THREE.Vector3(
          targetCameraPosition.x,
          targetCameraPosition.y,
          targetCameraPosition.z
        ), 0.04);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateCameraPosition();
    }

    // =================================================================
    // UI RENDERING & EVENTS
    // =================================================================
    function renderQuickPlaylist() {
      const container = document.getElementById('quick-playlist-container');
      const displayStations = state.stations.slice(0, 5);

      let html = '';
      displayStations.forEach(st => {
        const isActive = state.activeStation && state.activeStation.stationuuid === st.stationuuid;
        const badgeClass = `badge-${st.badgeType || 'pink'}`;

        let badgeContent = '';
        if (st.badgeIcon === 'waves') {
          badgeContent = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12h2M8 8v8M12 4v16M16 8v8M20 12h2"/></svg>`;
        } else if (st.badgeIcon === 'radio') {
          badgeContent = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2M7.8 16.2a6 6 0 0 1 0-8.4"/></svg>`;
        } else if (st.badgeText) {
          badgeContent = `<span>${st.badgeText}</span>`;
        } else {
          badgeContent = `<span>${(st.name || 'R').slice(0, 2).toUpperCase()}</span>`;
        }

        html += `
          <div class="station-list-item ${isActive ? 'active' : ''}" data-uuid="${st.stationuuid}">
            <div class="item-icon-badge ${badgeClass}">
              ${badgeContent}
            </div>
            <div class="item-info">
              <div class="item-name">${escapeHtml(st.name)}</div>
              <div class="item-sub">${escapeHtml(st.tags || st.country || 'Live')}</div>
            </div>
            <div class="item-play-action">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                ${isActive && state.isPlaying ? '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>' : '<polygon points="7 4 19 12 7 20 7 4"></polygon>'}
              </svg>
            </div>
          </div>
        `;
      });

      html += `
        <button class="playlist-footer-btn" id="view-all-stations-btn">
          <span>View all stations</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      `;

      container.innerHTML = html;

      // Event listeners for playlist items
      container.querySelectorAll('.station-list-item').forEach(el => {
        el.addEventListener('click', () => {
          const uuid = el.dataset.uuid;
          const found = state.stations.find(s => s.stationuuid === uuid);
          if (found) {
            if (state.activeStation && state.activeStation.stationuuid === uuid) {
              togglePlay();
            } else {
              playStation(found);
            }
          }
        });
      });

      // View all click
      const viewAllBtn = document.getElementById('view-all-stations-btn');
      if (viewAllBtn) {
        viewAllBtn.addEventListener('click', () => openCatalogModal());
      }
    }

    function updateUIState() {
      const playSvg = document.getElementById('play-svg');
      const soundwave = document.getElementById('soundwave');
      const nameEl = document.getElementById('current-station-name');
      const countryEl = document.getElementById('current-station-country');
      const playerCard = document.getElementById('player-card');

      if (state.activeStation) {
        nameEl.textContent = state.activeStation.name;
        countryEl.textContent = state.activeStation.country || 'Live Worldwide';
      }

      if (state.isPlaying) {
        playSvg.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>';
        soundwave.classList.add('playing');
        playerCard.classList.add('playing');
      } else {
        playSvg.innerHTML = '<polygon points="6 4 20 12 6 20 6 4"></polygon>';
        soundwave.classList.remove('playing');
        playerCard.classList.remove('playing');
      }

      renderQuickPlaylist();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    // =================================================================
    // API FETCH (RADIO-BROWSER WORLDWIDE)
    // =================================================================
    async function loadGlobalStations(query = '', tag = '') {
      let endpoint = '/json/stations/topvote/400?hidebroken=true';
      if (query) {
        endpoint = `/json/stations/byname/${encodeURIComponent(query)}?hidebroken=true&limit=200`;
      } else if (tag && tag !== 'all') {
        endpoint = `/json/stations/bycountrycodeexact/${encodeURIComponent(tag)}?hidebroken=true&limit=200`;
      }

      for (const mirror of RADIO_API_MIRRORS) {
        try {
          const res = await fetch(`${mirror}${endpoint}`, {
            headers: { 'Accept': 'application/json' }
          });
          if (res.ok) {
            const data = await res.json();
            const valid = data
              .filter(s => s.geo_lat != null && s.geo_long != null && (s.url_resolved || s.url))
              .map(s => ({
                stationuuid: s.stationuuid,
                name: (s.name || 'Radio').trim(),
                country: s.country || '',
                tags: s.tags || '',
                url: s.url,
                url_resolved: s.url_resolved || s.url,
                geo_lat: s.geo_lat,
                geo_long: s.geo_long,
                badgeType: ['pink', 'blue', 'orange', 'magenta', 'dark'][Math.floor(Math.random() * 5)]
              }));

            if (valid.length > 0) {
              state.stations = [...PRESET_STATIONS, ...valid.filter(v => !PRESET_STATIONS.some(p => p.name === v.name))];
              renderStationMarkers();
              renderCatalogList(state.stations);
              return;
            }
          }
        } catch (e) {
          console.warn(`Mirror ${mirror} lookup failed:`, e);
        }
      }
    }

    // =================================================================
    // CATALOG MODAL & SEARCH
    // =================================================================
    function openCatalogModal() {
      const modal = document.getElementById('catalog-modal');
      modal.classList.add('active');
      renderCatalogList(state.stations);
    }

    function closeCatalogModal() {
      const modal = document.getElementById('catalog-modal');
      modal.classList.remove('active');
    }

    function renderCatalogList(list) {
      const container = document.getElementById('catalog-stations-list');
      const badge = document.getElementById('catalog-count-badge');
      badge.textContent = `${list.length} станцій`;

      if (list.length === 0) {
        container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-dim);">Станцій не знайдено</div>`;
        return;
      }

      let html = '';
      list.forEach(st => {
        const isActive = state.activeStation && state.activeStation.stationuuid === st.stationuuid;
        html += `
          <div class="station-list-item ${isActive ? 'active' : ''}" data-uuid="${st.stationuuid}">
            <div class="item-icon-badge badge-pink">
              <span>${(st.name || 'R').slice(0, 2).toUpperCase()}</span>
            </div>
            <div class="item-info">
              <div class="item-name">${escapeHtml(st.name)}</div>
              <div class="item-sub">${escapeHtml(st.country || st.tags || 'Live')}</div>
            </div>
            <div class="item-play-action">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="7 4 19 12 7 20 7 4"></polygon>
              </svg>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      container.querySelectorAll('.station-list-item').forEach(el => {
        el.addEventListener('click', () => {
          const uuid = el.dataset.uuid;
          const found = state.stations.find(s => s.stationuuid === uuid);
          if (found) {
            playStation(found);
            closeCatalogModal();
          }
        });
      });
    }

    // =================================================================
    // EVENT BINDINGS
    // =================================================================
    function setupDOMEvents() {
      document.getElementById('play-pause-btn').addEventListener('click', togglePlay);
      document.getElementById('prev-btn').addEventListener('click', playPrev);
      document.getElementById('next-btn').addEventListener('click', playNext);

      // Volume Slider
      const volumeSlider = document.getElementById('volume-slider');
      volumeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value) / 100;
        state.volume = val;
        if (state.audio) state.audio.volume = val;
      });

      // Mute Toggle
      document.getElementById('volume-mute-btn').addEventListener('click', () => {
        if (state.volume > 0) {
          state._prevVol = state.volume;
          state.volume = 0;
          volumeSlider.value = 0;
        } else {
          state.volume = state._prevVol || 0.8;
          volumeSlider.value = (state._prevVol || 0.8) * 100;
        }
        if (state.audio) state.audio.volume = state.volume;
      });

      // Modal close events
      document.getElementById('catalog-close-btn').addEventListener('click', closeCatalogModal);
      document.getElementById('catalog-modal').addEventListener('click', (e) => {
        if (e.target.id === 'catalog-modal') closeCatalogModal();
      });

      // Catalog Search Input
      const searchInput = document.getElementById('catalog-search-input');
      let searchTimer = null;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        const q = e.target.value.trim().toLowerCase();
        searchTimer = setTimeout(() => {
          if (q.length >= 2) {
            const filtered = state.stations.filter(s =>
              s.name.toLowerCase().includes(q) ||
              (s.country && s.country.toLowerCase().includes(q)) ||
              (s.tags && s.tags.toLowerCase().includes(q))
            );
            renderCatalogList(filtered);
          } else {
            renderCatalogList(state.stations);
          }
        }, 200);
      });

      // Tag Filter Pills
      document.querySelectorAll('.tag-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const tag = btn.dataset.tag;
          if (tag === 'all') {
            renderCatalogList(state.stations);
          } else {
            const filtered = state.stations.filter(s =>
              (s.country && s.country.toLowerCase().includes(tag.toLowerCase())) ||
              (s.tags && s.tags.toLowerCase().includes(tag.toLowerCase()))
            );
            renderCatalogList(filtered);
          }
        });
      });

      // Keyboard space to play/pause
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          togglePlay();
        }
      });
    }

    // =================================================================
    // INITIALIZATION
    // =================================================================
    function init() {
      initAudioEngine();
      init3DScene();
      renderQuickPlaylist();
      updateUIState();
      setupDOMEvents();

      // Fetch dynamic radio stations worldwide in background
      loadGlobalStations();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
