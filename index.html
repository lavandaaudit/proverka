<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>MEGACITY AI EXPLORER</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Inter',sans-serif;
background:black;
color:white;
}

/* ===== VIEWER ===== */

.viewer{
position:relative;
width:100%;
height:100vh;
overflow:hidden;
background:black;
}

iframe{
width:100%;
height:100%;
border:none;
transition:1s;
}

/* ===== OVERLAYS ===== */

.scan{
position:absolute;
inset:0;

background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.03) 0px,
rgba(255,255,255,.03) 1px,
transparent 2px,
transparent 4px
);

mix-blend-mode:screen;
opacity:.14;
pointer-events:none;
}

.vignette{
position:absolute;
inset:0;
pointer-events:none;

background:
radial-gradient(
circle at center,
transparent 35%,
rgba(0,0,0,.45)
);
}

/* ===== TOP ===== */

.topbar{
position:absolute;
top:24px;
left:50%;
transform:translateX(-50%);

width:94%;
height:92px;

background:rgba(0,0,0,.42);
backdrop-filter:blur(18px);

border:
1px solid rgba(255,255,255,.08);

border-radius:28px;

display:flex;
align-items:center;
gap:20px;

padding:0 24px;

z-index:50;
}

/* ===== LOGO ===== */

.logo{
font-size:34px;
font-weight:900;
letter-spacing:2px;
white-space:nowrap;
}

/* ===== SEARCH ===== */

.search{
flex:1;
height:58px;

background:#111;

border:none;
outline:none;

border-radius:18px;

padding:0 20px;

font-size:18px;
color:white;
}

/* ===== CITYS ===== */

.citys{
display:flex;
gap:12px;
overflow-x:auto;
scrollbar-width:none;
}

.citys::-webkit-scrollbar{
display:none;
}

.city{
padding:16px 22px;

background:#121212;

border:
1px solid rgba(255,255,255,.07);

border-radius:18px;

font-size:18px;
font-weight:700;

cursor:pointer;

transition:.25s;
}

.city:hover{
background:#1d1d1d;
transform:translateY(-4px);
}

/* ===== LEFT PANEL ===== */

.left{
position:absolute;
left:25px;
top:135px;

display:flex;
flex-direction:column;
gap:14px;

z-index:50;
}

/* ===== BUTTON ===== */

.btn{
width:190px;
height:58px;

background:rgba(0,0,0,.45);

backdrop-filter:blur(14px);

border:
1px solid rgba(255,255,255,.08);

border-radius:18px;

color:white;

font-size:14px;
font-weight:700;

cursor:pointer;

transition:.25s;
}

.btn:hover{
transform:translateX(6px);
background:#181818;
}

/* ===== RIGHT PANEL ===== */

.right{
position:absolute;
right:25px;
top:135px;

width:340px;

background:rgba(0,0,0,.5);

backdrop-filter:blur(18px);

border:
1px solid rgba(255,255,255,.08);

border-radius:28px;

padding:24px;

z-index:50;
}

/* ===== CITY TITLE ===== */

.city-title{
font-size:36px;
font-weight:900;
line-height:1;
margin-bottom:20px;
}

/* ===== INFO ===== */

.info{
display:flex;
flex-direction:column;
gap:16px;
}

.card{
background:#111;

border:
1px solid rgba(255,255,255,.05);

border-radius:18px;

padding:18px;
}

.label{
font-size:12px;
opacity:.5;
margin-bottom:8px;
letter-spacing:1px;
}

.value{
font-size:28px;
font-weight:800;
}

.small{
font-size:13px;
opacity:.65;
margin-top:5px;
line-height:1.5;
}

/* ===== AI GUIDE ===== */

.guide{
margin-top:18px;

padding:18px;

background:
linear-gradient(
135deg,
rgba(0,140,255,.18),
rgba(0,255,180,.08)
);

border-radius:18px;

border:
1px solid rgba(255,255,255,.08);

font-size:14px;
line-height:1.7;
}

/* ===== WALK HUD ===== */

.walk{
position:absolute;

bottom:30px;
left:30px;

padding:20px 24px;

background:rgba(0,0,0,.5);

backdrop-filter:blur(14px);

border:
1px solid rgba(255,255,255,.08);

border-radius:22px;

z-index:50;

font-size:14px;
line-height:1.7;
}

/* ===== CITY LABEL ===== */

.bigcity{
position:absolute;

right:35px;
bottom:35px;

font-size:72px;
font-weight:900;

opacity:.15;

pointer-events:none;
}

/* ===== MOBILE ===== */

@media(max-width:1100px){

.right{
width:280px;
}

.city-title{
font-size:28px;
}

.bigcity{
font-size:42px;
}

}

@media(max-width:900px){

.topbar{
flex-direction:column;
height:auto;
padding:18px;
align-items:stretch;
}

.left{
bottom:20px;
top:auto;
}

.right{
top:auto;
bottom:20px;
right:20px;
width:300px;
}

.bigcity{
display:none;
}

}

</style>
</head>

<body>

<div class="viewer">

<!-- STREET -->

<iframe
id="street"
allowfullscreen>
</iframe>

<div class="scan"></div>
<div class="vignette"></div>

<!-- TOP -->

<div class="topbar">

<div class="logo">
MEGACITY AI
</div>

<input
class="search"
type="text"
placeholder="Пошук мегаполіса..."
onkeyup="filterCities(this.value)"
>

<div class="citys" id="citys"></div>

</div>

<!-- LEFT -->

<div class="left">

<button class="btn" onclick="randomStreet()">
RANDOM STREET
</button>

<button class="btn" onclick="nextCity()">
NEXT CITY
</button>

<button class="btn" onclick="autoWalk()">
AUTO WALK AI
</button>

<button class="btn" onclick="nightMode()">
NIGHT MODE
</button>

<button class="btn" onclick="cinemaMode()">
CINEMA MODE
</button>

<button class="btn" onclick="droneMode()">
DRONE MODE
</button>

<button class="btn" onclick="cyberpunkMode()">
CYBERPUNK
</button>

<button class="btn" onclick="resetMode()">
RESET
</button>

</div>

<!-- RIGHT -->

<div class="right">

<div
class="city-title"
id="cityTitle">
TOKYO
</div>

<div class="info">

<div class="card">

<div class="label">
WEATHER
</div>

<div
class="value"
id="temp">
+22°C
</div>

<div
class="small"
id="weatherText">
clear sky
</div>

</div>

<div class="card">

<div class="label">
AIR QUALITY
</div>

<div
class="value"
id="air">
42 AQI
</div>

<div
class="small"
id="airText">
good air quality
</div>

</div>

<div class="card">

<div class="label">
POPULATION
</div>

<div
class="value"
id="population">
37M
</div>

<div class="small">
megapolis urban zone
</div>

</div>

</div>

<div class="guide" id="guide">

AI GUIDE:<br><br>

Walk forward 120m.<br>
Turn right near crossing.<br>
Continue toward illuminated avenue.

</div>

</div>

<!-- WALK -->

<div class="walk" id="walk">

AI WALK SYSTEM ONLINE<br>
waiting for navigation route...

</div>

<!-- BIG -->

<div class="bigcity" id="bigcity">
TOKYO
</div>

</div>

<script>

/* ===== CITIES ===== */

const cities=[

"Tokyo",
"Kyiv",
"New York",
"London",
"Paris",
"Berlin",
"Rome",
"Barcelona",
"Dubai",
"Istanbul",
"Bangkok",
"Singapore",
"Seoul",
"Sydney",
"Toronto",
"Cairo",
"Mumbai",
"Shanghai",
"Los Angeles",
"Chicago",
"Lviv"

];

/* ===== DATA ===== */

const cityData={

Tokyo:{
coords:[35.6895,139.6917],
temp:"+24°C",
weather:"clear sky",
air:"38 AQI",
airText:"good air quality",
population:"37M"
},

Kyiv:{
coords:[50.4501,30.5234],
temp:"+20°C",
weather:"cloudy",
air:"52 AQI",
airText:"moderate air quality",
population:"3M"
},

London:{
coords:[51.5072,-0.1276],
temp:"+17°C",
weather:"rain",
air:"48 AQI",
airText:"stable air quality",
population:"9M"
},

Paris:{
coords:[48.8566,2.3522],
temp:"+21°C",
weather:"clear sky",
air:"41 AQI",
airText:"good air quality",
population:"11M"
}

};

/* ===== ELEMENTS ===== */

const frame=document.getElementById('street');

const citys=document.getElementById('citys');

let currentIndex=0;

/* ===== RENDER ===== */

function renderCities(list){

citys.innerHTML='';

list.forEach((city,index)=>{

const div=document.createElement('div');

div.className='city';

div.innerText=city;

div.onclick=()=>openStreet(city,index);

citys.appendChild(div);

});

}

renderCities(cities);

/* ===== OPEN ===== */

function openStreet(city,index){

currentIndex=index;

const data=
cityData[city] || cityData["Tokyo"];

const lat=data.coords[0];
const lng=data.coords[1];

const rLat=
(lat+(Math.random()-.5)/100).toFixed(6);

const rLng=
(lng+(Math.random()-.5)/100).toFixed(6);

frame.src=
`https://www.google.com/maps?q=&layer=c&cbll=${rLat},${rLng}&cbp=11,0,0,0,0&output=svembed`;

document.getElementById('cityTitle').innerText=
city.toUpperCase();

document.getElementById('bigcity').innerText=
city.toUpperCase();

document.getElementById('temp').innerText=
data.temp;

document.getElementById('weatherText').innerText=
data.weather;

document.getElementById('air').innerText=
data.air;

document.getElementById('airText').innerText=
data.airText;

document.getElementById('population').innerText=
data.population;

}

/* ===== SEARCH ===== */

function filterCities(text){

const filtered=
cities.filter(c=>
c.toLowerCase().includes(text.toLowerCase())
);

renderCities(filtered);

}

/* ===== RANDOM ===== */

function randomStreet(){

openStreet(
cities[currentIndex],
currentIndex
);

}

/* ===== NEXT ===== */

function nextCity(){

currentIndex++;

if(currentIndex>=cities.length){

currentIndex=0;

}

openStreet(
cities[currentIndex],
currentIndex
);

}

/* ===== AI WALK ===== */

function autoWalk(){

const routes=[

"Move forward 80m toward central avenue.",
"Turn left after traffic lights.",
"Continue through neon district.",
"Walk toward illuminated crossing.",
"Enter pedestrian boulevard.",
"Move ahead to next intersection."

];

const random=
routes[Math.floor(Math.random()*routes.length)];

document.getElementById('walk').innerHTML=
`
AI WALK ACTIVE<br>
${random}
`;

document.getElementById('guide').innerHTML=
`
AI GUIDE:<br><br>
${random}<br><br>
Panorama route generated.<br>
Urban exploration mode active.
`;

}

/* ===== MODES ===== */

function nightMode(){

frame.style.filter=
'brightness(.55) contrast(1.3) saturate(.8)';

}

function cinemaMode(){

frame.style.filter=
'contrast(1.15) saturate(1.2) brightness(.95)';

}

function droneMode(){

frame.style.filter=
'grayscale(.35) contrast(1.4)';

}

function cyberpunkMode(){

frame.style.filter=
'hue-rotate(-40deg) saturate(1.8) contrast(1.2)';

}

/* ===== RESET ===== */

function resetMode(){

location.reload();

}

/* ===== START ===== */

openStreet("Tokyo",0);

</script>

</body>
</html>
