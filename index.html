<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TV One + Ibonarium History</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    html,body{
        width:100%;
        height:100%;
        overflow-x:hidden;
        background:#000;
        font-family:Arial,sans-serif;
    }

    .site-wrapper{
        width:100%;
        position:relative;
    }

    .frame-container{
        width:100%;
        position:relative;
        overflow:hidden;
        background:#000;
    }

    iframe{
        width:100%;
        border:none;
        display:block;
        background:#000;
    }

    /* ПЕРШИЙ САЙТ */
    #tvOne{
        height:100vh;
    }

    /* ДРУГИЙ САЙТ */
    #museum{
        height:100vh;
    }

    /* МОБІЛЬНА АДАПТАЦІЯ */
    @media (max-width: 768px){

        #tvOne{
            height:100vh;
        }

        #museum{
            height:100vh;
        }
    }
</style>
</head>

<body>

<div class="site-wrapper">

    <!-- ПЕРШИЙ САЙТ -->
    <section class="frame-container">
        <iframe
            id="tvOne"
            src="https://lavandaaudit.github.io/tv.one/"
            loading="lazy"
            allowfullscreen>
        </iframe>
    </section>

    <!-- ДРУГИЙ САЙТ -->
    <section class="frame-container">
        <iframe
            id="museum"
            src="https://lavandaaudit.github.io/history.musem.ibonarium/"
            loading="lazy"
            allowfullscreen>
        </iframe>
    </section>

</div>

<script>
function resizeIframes() {

    const tv = document.getElementById('tvOne');
    const museum = document.getElementById('museum');

    // Висота першого сайту
    tv.style.height = window.innerHeight + 'px';

    // Висота другого сайту
    museum.style.height = window.innerHeight + 'px';
}

window.addEventListener('load', resizeIframes);
window.addEventListener('resize', resizeIframes);
</script>

</body>
</html>
