<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>ibonarium flow</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:auto;
}

html,
body{
  width:100%;
  height:auto;
  background:#000;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial,sans-serif;
}

/* ===== GLOBAL ===== */

body{
  position:relative;
}

/* ===== SECTIONS ===== */

.section{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#000;
}

/* ===== IFRAMES ===== */

.frame{
  width:100%;
  border:none;
  display:block;
  background:#000;
}

/* ===== HEIGHTS ===== */

#tvFrame{
  height:100vh;
}

#museumFrame{
  height:2200px;
}

/* ===== FADE ===== */

.fade::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-1px;
  width:100%;
  height:120px;
  pointer-events:none;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0),
    rgba(0,0,0,0.45),
    #000
  );

  z-index:10;
}

/* ===== MOBILE ===== */

@media(max-width:900px){

  #tvFrame{
    height:100svh;
  }

  #museumFrame{
    height:2600px;
  }

}

</style>
</head>

<body>

<!-- ===================================== -->
<!-- FIRST PAGE -->
<!-- ===================================== -->

<section class="section fade">

  <iframe
    id="tvFrame"
    class="frame"
    src="https://lavandaaudit.github.io/tv.2/"
    loading="eager"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>

</section>

<!-- ===================================== -->
<!-- SECOND PAGE -->
<!-- ===================================== -->

<section class="section">

  <iframe
    id="museumFrame"
    class="frame"
    src="https://lavandaaudit.github.io/history.musem.ibonarium/"
    loading="lazy"
    allowfullscreen>
  </iframe>

</section>

<script>

/* =========================================
   DISABLE BROWSER SCROLL MEMORY
========================================= */

if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

/* =========================================
   REMOVE HASH / RESTORE
========================================= */

history.replaceState(null, null, window.location.pathname);

/* =========================================
   FORCE TOP IMMEDIATELY
========================================= */

window.scrollTo(0,0);

document.documentElement.scrollTop = 0;
document.body.scrollTop = 0;

/* =========================================
   FORCE TOP AFTER DOM READY
========================================= */

document.addEventListener("DOMContentLoaded", () => {

  window.scrollTo({
    top:0,
    left:0,
    behavior:"auto"
  });

  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;

});

/* =========================================
   FORCE TOP AFTER FULL LOAD
========================================= */

window.addEventListener("load", () => {

  setTimeout(() => {

    window.scrollTo({
      top:0,
      left:0,
      behavior:"auto"
    });

    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;

  },0);

});

/* =========================================
   PAGESHOW FIX
========================================= */

window.addEventListener("pageshow", () => {

  window.scrollTo(0,0);

  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;

});

/* =========================================
   PREVENT IFRAME REFRESH JUMPS
========================================= */

let savedScroll = 0;

window.addEventListener("scroll", () => {
  savedScroll = window.scrollY;
}, { passive:true });

const tvFrame = document.getElementById("tvFrame");

tvFrame.addEventListener("load", () => {

  if(savedScroll < 50){

    window.scrollTo(0,0);

    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;

  }

});

/* =========================================
   PREVENT VISIBILITY JUMPS
========================================= */

document.addEventListener("visibilitychange", () => {

  if (!document.hidden) {

    requestAnimationFrame(() => {

      if(savedScroll < 50){

        window.scrollTo(0,0);

        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;

      }else{

        window.scrollTo(0, savedScroll);

      }

    });

  }

});

/* =========================================
   ADAPTIVE HEIGHT
========================================= */

const museumFrame = document.getElementById("museumFrame");

function adaptiveMuseumHeight(){

  if(window.innerWidth < 900){

    museumFrame.style.height = "2600px";

  }else{

    museumFrame.style.height = "2200px";

  }

}

adaptiveMuseumHeight();

window.addEventListener("resize", adaptiveMuseumHeight);

</script>

</body>
</html>
