<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>IBONARIUM · FIELD LABYRINTH · 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{
  margin:0;
  padding:0;
  background:#000;
  overflow:hidden;
}
canvas{
  display:block;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
resize();
window.addEventListener("resize", resize);

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

/* ===== CAMERA ===== */
let camZ = 1.2;
let targetZ = 1.2;

canvas.addEventListener("wheel", e=>{
  targetZ += e.deltaY * 0.0008;
  targetZ = Math.max(0.4, Math.min(3, targetZ));
});

/* ===== FIELD NODES ===== */
const COUNT = 70;
const nodes = [];

for(let i=0;i<COUNT;i++){
  nodes.push({
    x: (Math.random()-0.5)*2000,
    y: (Math.random()-0.5)*2000,
    z: Math.random()*600,
    r: 40 + Math.random()*60,
    phase: Math.random()*Math.PI*2,
    speed: 0.002 + Math.random()*0.004,
    links:[]
  });
}

/* ===== LABYRINTH LINKS ===== */
for(let i=0;i<nodes.length;i++){
  for(let j=i+1;j<nodes.length;j++){
    const dx = nodes[i].x-nodes[j].x;
    const dy = nodes[i].y-nodes[j].y;
    const d = Math.hypot(dx,dy);
    if(d < 420 && Math.random() < 0.35){
      nodes[i].links.push(nodes[j]);
      nodes[j].links.push(nodes[i]);
    }
  }
}

/* ===== ORGANIC SHAPE ===== */
function drawField(n, sx, sy, scale){
  ctx.beginPath();
  const pts = 16;
  for(let i=0;i<=pts;i++){
    const a = i/pts * Math.PI*2;
    const noise = Math.sin(a*3 + n.phase)*0.35
                + Math.cos(a*2 - n.phase)*0.25;
    const rr = n.r * (1+noise) * scale;
    const x = sx + Math.cos(a)*rr;
    const y = sy + Math.sin(a)*rr;
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

/* ===== LOOP ===== */
function loop(t){
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  camZ += (targetZ-camZ)*0.05;

  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);

  nodes.forEach(n=>{
    n.phase += n.speed;
  });

  /* draw links */
  ctx.strokeStyle = "rgba(0,255,120,0.15)";
  nodes.forEach(n=>{
    n.links.forEach(o=>{
      const dz = (n.z+o.z)*0.5;
      const scale = camZ/(1+dz*0.002);

      const x1 = n.x*scale;
      const y1 = n.y*scale;
      const x2 = o.x*scale;
      const y2 = o.y*scale;

      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
    });
  });

  /* draw fields */
  nodes.forEach(n=>{
    const scale = camZ/(1+n.z*0.002);
    const sx = n.x*scale;
    const sy = n.y*scale;

    ctx.strokeStyle = `rgba(0,255,150,${0.25*scale})`;
    drawField(n,sx,sy,scale);
  });

  ctx.restore();
}
loop();
</script>
</body>
</html>
