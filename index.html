<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ibonarium World Radio — The world sounds better together</title>
  <meta name="description" content="Discover and listen to live radio stations from every corner of the world on an interactive 3D globe with 2000+ live stations.">
  <meta name="author" content="Ibonarium Cosmo Dynamics Lab">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23090314' stroke='%23e00279' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e00279'/%3E%3Cpath d='M16 4 A12 12 0 0 1 28 16' stroke='%23ff2d92' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-space: #030008;
      --pink-primary: #e00279;
      --pink-neon: #ff2d92;
      --pink-glow: #ff54a2;
      --pink-subtle: rgba(224, 2, 121, 0.15);
      --purple-accent: #8b28cf;
      --purple-glow: rgba(139, 40, 207, 0.35);
      --card-bg: rgba(10, 5, 18, 0.78);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-border-active: rgba(224, 2, 121, 0.5);
      --text-white: #ffffff;
      --text-muted: #9d98ad;
      --text-dim: #5c5770;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Space Grotesk', var(--font-main);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-space);
      font-family: var(--font-main);
      color: var(--text-white);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      outline: none;
    }

    input {
      font-family: inherit;
    }

    /* App container */
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 70% 45%, #15062a 0%, #080212 45%, #030008 100%);
    }

    /* 3D Canvas */
    #globe-canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }
    #globe-canvas-container:active {
      cursor: grabbing;
    }

    /* Ambient Lighting Overlays */
    .space-glow {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      border-radius: 50%;
      filter: blur(90px);
    }
    .space-glow-1 {
      top: -100px;
      left: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(139, 40, 207, 0.15) 0%, transparent 70%);
    }
    .space-glow-2 {
      bottom: -150px;
      right: 15%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(224, 2, 121, 0.1) 0%, transparent 70%);
    }

    /* Top Bar */
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 36px;
      pointer-events: none;
    }
    .topbar > * {
      pointer-events: auto;
    }

    /* Brand Logo */
    .brand-container {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .brand-emblem-wrap {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      filter: drop-shadow(0 0 16px rgba(224, 2, 121, 0.45));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .brand-container:hover .brand-emblem-wrap {
      transform: scale(1.08) rotate(4deg);
    }

    .brand-emblem-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-emblem-svg {
      width: 58px;
      height: 58px;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .brand-title-main {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1;
    }
    .brand-title-sub {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.26em;
      color: var(--pink-neon);
      text-transform: uppercase;
      line-height: 1;
      text-shadow: 0 0 12px rgba(255, 45, 146, 0.5);
    }

    /* Top right live status badge */
    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .station-count-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      background: rgba(18, 7, 28, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 45, 146, 0.3);
      border-radius: 999px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 0 14px rgba(224, 2, 121, 0.15);
    }
    .station-count-pill .accent-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }

    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      background: rgba(18, 7, 28, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(224, 2, 121, 0.45);
      border-radius: 999px;
      color: #ff54a2;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      box-shadow: 0 0 20px rgba(224, 2, 121, 0.18), inset 0 0 10px rgba(224, 2, 121, 0.1);
      transition: all 0.25s ease;
    }
    .live-status-pill:hover {
      background: rgba(30, 10, 48, 0.85);
      border-color: var(--pink-neon);
      box-shadow: 0 0 26px rgba(255, 45, 146, 0.35);
      color: #ffffff;
    }
    .live-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink-neon);
      box-shadow: 0 0 10px var(--pink-neon);
      animation: livePulse 1.8s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }

    /* Main Left Container */
    .main-content {
      position: absolute;
      top: 100px;
      left: 36px;
      bottom: 28px;
      width: 390px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 18px;
      pointer-events: none;
      overflow-y: auto;
      padding-right: 8px;
    }
    .main-content::-webkit-scrollbar {
      width: 4px;
    }
    .main-content::-webkit-scrollbar-thumb {
      background: rgba(224, 2, 121, 0.2);
      border-radius: 4px;
    }
    .main-content > * {
      pointer-events: auto;
    }

    /* Hero Typography */
    .hero-text-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 2px;
    }
    .hero-title {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: #ffffff;
    }
    .hero-title .pink-accent {
      color: var(--pink-neon);
      background: linear-gradient(135deg, #ff2d92 0%, #e00279 60%, #ff6aa9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 45, 146, 0.4);
      display: inline-block;
    }
    .hero-subtitle {
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--text-muted);
      max-width: 340px;
      font-weight: 400;
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 10% 0%, rgba(224, 2, 121, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* 1. Mini Player Card */
    .player-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .player-card:hover {
      border-color: rgba(224, 2, 121, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(224, 2, 121, 0.12);
    }

    .player-top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .station-art-thumb {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1b0a2c, #3a0d42);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }
    .station-art-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .station-art-fallback {
      width: 24px;
      height: 24px;
      color: var(--pink-neon);
      opacity: 0.9;
    }

    .station-header-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Soundwave bars */
    .soundwave-indicator {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 18px;
      flex-shrink: 0;
    }
    .soundwave-bar {
      width: 3px;
      height: 100%;
      background: var(--pink-neon);
      border-radius: 2px;
      transform-origin: bottom;
      box-shadow: 0 0 6px var(--pink-neon);
    }
    .playing .soundwave-bar:nth-child(1) { animation: soundwave 1s infinite ease-in-out; }
    .playing .soundwave-bar:nth-child(2) { animation: soundwave 0.8s infinite ease-in-out 0.15s; }
    .playing .soundwave-bar:nth-child(3) { animation: soundwave 1.2s infinite ease-in-out 0.3s; }
    .playing .soundwave-bar:nth-child(4) { animation: soundwave 0.9s infinite ease-in-out 0.45s; }

    @keyframes soundwave {
      0%, 100% { transform: scaleY(0.25); }
      50% { transform: scaleY(1); }
    }

    .station-meta {
      flex: 1;
      min-width: 0;
    }
    .station-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }
    .station-country {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Player Controls */
    .player-controls-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: 2px;
    }

    .control-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border-radius: 50%;
      transition: all 0.2s ease;
    }
    .control-btn:hover {
      color: #ffffff;
      transform: scale(1.1);
    }
    .control-btn:active {
      transform: scale(0.95);
    }

    .main-play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff4099, var(--pink-primary));
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(224, 2, 121, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .main-play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 26px rgba(255, 45, 146, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }
    .main-play-btn:active {
      transform: scale(0.96);
    }

    /* Volume Slider */
    .volume-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      margin-left: 4px;
    }
    .volume-icon-btn {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      transition: color 0.2s ease;
    }
    .volume-icon-btn:hover {
      color: #ffffff;
    }

    .volume-range-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      cursor: pointer;
      position: relative;
    }
    .volume-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--pink-neon);
      cursor: pointer;
      box-shadow: 0 0 10px var(--pink-neon);
      transition: transform 0.15s ease;
    }
    .volume-range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    .volume-range-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--pink-neon);
      border: none;
      cursor: pointer;
      box-shadow: 0 0 10px var(--pink-neon);
    }

    /* 2. Stations Playlist Card */
    .playlist-card {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .station-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 14px;
      background: transparent;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }
    .station-list-item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.06);
    }
    .station-list-item.active {
      background: linear-gradient(90deg, rgba(224, 2, 121, 0.18) 0%, rgba(139, 40, 207, 0.08) 100%);
      border-color: var(--card-border-active);
      box-shadow: inset 0 0 16px rgba(224, 2, 121, 0.08);
    }

    .item-icon-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      color: #ffffff;
      position: relative;
    }
    .badge-pink {
      background: linear-gradient(135deg, #e00279, #9c0054);
      box-shadow: 0 0 12px rgba(224, 2, 121, 0.35);
    }
    .badge-blue {
      background: linear-gradient(135deg, #0072ff, #0043a8);
      box-shadow: 0 0 12px rgba(0, 114, 255, 0.3);
    }
    .badge-orange {
      background: linear-gradient(135deg, #ff7700, #cc4400);
      box-shadow: 0 0 12px rgba(255, 119, 0, 0.3);
    }
    .badge-magenta {
      background: linear-gradient(135deg, #d6006e, #880044);
      box-shadow: 0 0 12px rgba(214, 0, 110, 0.3);
    }
    .badge-dark {
      background: linear-gradient(135deg, #201a33, #0d0a17);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }
    .item-name {
      font-size: 13px;
      font-weight: 600;
      color: #e5e2f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .station-list-item.active .item-name {
      color: #ffffff;
      font-weight: 700;
    }
    .item-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .station-list-item.active .item-sub {
      color: #c988bb;
    }

    .item-play-action {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(224, 2, 121, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--pink-neon);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .station-list-item:hover .item-play-action {
      background: var(--pink-neon);
      color: #ffffff;
      border-color: var(--pink-neon);
      box-shadow: 0 0 12px rgba(255, 45, 146, 0.6);
      transform: scale(1.08);
    }
    .station-list-item.active .item-play-action {
      background: var(--pink-primary);
      color: #ffffff;
      border-color: var(--pink-primary);
      box-shadow: 0 0 14px rgba(224, 2, 121, 0.7);
    }

    /* Playlist bottom link */
    .playlist-footer-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--pink-neon);
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border-radius: 10px;
    }
    .playlist-footer-btn:hover {
      color: #ffffff;
      background: rgba(224, 2, 121, 0.12);
      transform: translateX(3px);
    }
    .playlist-footer-btn svg {
      transition: transform 0.2s ease;
    }
    .playlist-footer-btn:hover svg {
      transform: translateX(4px);
    }

    /* Search & Full Catalog Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(4, 1, 10, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .catalog-modal {
      width: 100%;
      max-width: 760px;
      height: 85vh;
      max-height: 85vh;
      background: #0d0618;
      border: 1px solid rgba(224, 2, 121, 0.35);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(224, 2, 121, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .catalog-header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .catalog-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .catalog-title-badge {
      font-size: 11.5px;
      padding: 3px 10px;
      background: rgba(224, 2, 121, 0.2);
      border: 1px solid rgba(224, 2, 121, 0.4);
      color: var(--pink-neon);
      border-radius: 6px;
      font-weight: 600;
    }
    .catalog-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }
    .catalog-close-btn:hover {
      background: rgba(224, 2, 121, 0.3);
      color: #ffffff;
    }

    .catalog-search-bar {
      padding: 14px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      flex-shrink: 0;
    }
    .catalog-search-input {
      width: 100%;
      height: 44px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0 42px 0 42px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    .catalog-search-input:focus {
      border-color: var(--pink-neon);
      background: rgba(224, 2, 121, 0.06);
      box-shadow: 0 0 16px rgba(224, 2, 121, 0.2);
    }
    .catalog-search-icon {
      position: absolute;
      left: 36px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }

    /* CLEARLY VISIBLE FILTER PILLS ROW */
    .catalog-filter-tags {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      overflow-x: auto;
      overflow-y: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
      min-height: 60px;
    }
    .catalog-filter-tags::-webkit-scrollbar {
      height: 4px;
    }
    .catalog-filter-tags::-webkit-scrollbar-thumb {
      background: rgba(224, 2, 121, 0.3);
      border-radius: 4px;
    }
    .tag-pill {
      height: 34px;

      activeStation: PRESET_STATIONS[0],
      isPlaying: false,
      volume: 0.8,
      audio: null,
      markerMeshes: [],
      radarBeacon: null,
      hoveredStation: null
    };

    // =================================================================
    // AUDIO ENGINE (ROBUST STREAMING & ERROR RECOVERY)
    // =================================================================
    function initAudioEngine() {
      state.audio = new Audio();
      state.audio.crossOrigin = 'anonymous';
      state.audio.volume = state.volume;

      state.audio.addEventListener('play', () => {
        state.isPlaying = true;
        updateUIState();
      });

      state.audio.addEventListener('pause', () => {
        state.isPlaying = false;
        updateUIState();
      });

      state.audio.addEventListener('error', (e) => {
        console.warn('Audio stream playback failed, auto-trying next station...');
        state.isPlaying = false;
        updateUIState();
      });
    }

    function playStation(station) {
      if (!station) return;
      state.activeStation = station;

      if (state.audio) {
        state.audio.src = station.url_resolved || station.url;
        state.audio.play().then(() => {
          state.isPlaying = true;
          updateUIState();
        }).catch(err => {
          console.warn('Playback requires user trigger:', err);
          state.isPlaying = false;
          updateUIState();
        });
      }

      // Update radar beacon on 3D globe
      updateRadarBeacon(station.geo_lat, station.geo_long);

      // Smooth camera fly-to station
      flyToStation(station.geo_lat, station.geo_long);

      updateUIState();
      renderQuickPlaylist();
    }

    function togglePlay() {
      if (!state.audio) return;
      if (state.isPlaying) {
        state.audio.pause();
      } else {
        if (!state.audio.src && state.activeStation) {
          state.audio.src = state.activeStation.url_resolved || state.activeStation.url;
        }
        state.audio.play().catch(console.error);
      }
    }

    function playNext() {
      const idx = state.stations.findIndex(s => s.stationuuid === state.activeStation.stationuuid);
      const nextIdx = (idx + 1) % state.stations.length;
      playStation(state.stations[nextIdx]);
    }

    function playPrev() {
      const idx = state.stations.findIndex(s => s.stationuuid === state.activeStation.stationuuid);
      const prevIdx = (idx - 1 + state.stations.length) % state.stations.length;
      playStation(state.stations[prevIdx]);
    }

    function playRandomStation() {
      if (state.stations.length === 0) return;
      const randIdx = Math.floor(Math.random() * state.stations.length);
      playStation(state.stations[randIdx]);
    }

    // =================================================================
    // 3D SCENE & DAY/NIGHT TERMINATOR GLOBE (THREE.JS)
    // =================================================================
    let scene, camera, renderer, controls;
    let globeGroup, earthMesh, sunLight;
    let radarRings = [];
    let targetCameraPosition = null;

    function latLonToVector3(lat, lon, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    function vector3ToLatLon(vec) {
      const radius = vec.length();
      const phi = Math.acos(vec.y / radius);
      const theta = Math.atan2(vec.z, -vec.x);
      const lat = 90 - (phi * 180 / Math.PI);
      const lon = (theta * 180 / Math.PI) - 180;
      return { lat, lon };
    }

    // Real-time solar vector for realistic day/night cycle
    function calculateSunVector() {
      const now = new Date();
      const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
      const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);

      const sunLon = -(utcHours - 12) * 15;
      const sunLat = 23.44 * Math.sin((2 * Math.PI / 365) * (dayOfYear - 81));

      return latLonToVector3(sunLat, sunLon, 12.0);
    }

    function init3DScene() {
      const container = document.getElementById('globe-canvas-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 1000);

      updateCameraPosition();

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;
      container.appendChild(renderer.domElement);

      // Smooth Orbit Controls — ULTRA DEEP ZOOM + SLOW CALM ROTATION
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;
      controls.enableZoom = true;
      controls.zoomSpeed = 0.9;
      // Ultra-deep zoom down to city level (radius is 2.40, minimum distance is 2.46)
      controls.minDistance = 2.46;
      controls.maxDistance = 14.0;
      controls.rotateSpeed = 0.55;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.08; // slow & majestic

      globeGroup = new THREE.Group();
      scene.add(globeGroup);

      // Realistic Day/Night lighting
      setupDayNightLighting();

      // Earth Globe with clean texture & bump
      createCleanEarthMesh();

      // Delicate, refined station dots
      createStationMarkers();

      // Active Station Sonar / Radar Beacon
      createRadarBeacon();

      // Starfield
      createStarfield();

      // Raycasting for easy clicks
      setupRaycaster(container);

      // Setup UI buttons
      setupZoomButtons();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function setupDayNightLighting() {
      const ambientLight = new THREE.AmbientLight(0x221338, 1.3);
      scene.add(ambientLight);

      sunLight = new THREE.DirectionalLight(0xfff8ee, 2.8);
      const sunPos = calculateSunVector();
      sunLight.position.copy(sunPos);
      scene.add(sunLight);

      const rimLight = new THREE.DirectionalLight(0xe00279, 1.4);
      rimLight.position.set(-sunPos.x * 0.8, -sunPos.y * 0.8, -sunPos.z * 0.8);
      scene.add(rimLight);
    }

    function updateCameraPosition() {
      if (window.innerWidth > 900) {
        camera.position.set(1.4, 0.25, 5.6);
        if (controls) controls.target.set(0.9, 0, 0);
      } else if (window.innerWidth > 640) {
        camera.position.set(0, 0.5, 6.8);
        if (controls) controls.target.set(0, 0.3, 0);
      } else {
        // Mobile portrait mode — raise Earth slightly above the bottom player card
        camera.position.set(0, 1.1, 7.4);
        if (controls) controls.target.set(0, 0.55, 0);
      }
    }

    function createCleanEarthMesh() {
      const textureLoader = new THREE.TextureLoader();
      textureLoader.crossOrigin = 'anonymous';

      const earthGeo = new THREE.SphereGeometry(GLOBE_RADIUS, 128, 128);

      const earthMat = new THREE.MeshStandardMaterial({
        color: 0x332244,
        roughness: 0.7,
        metalness: 0.08,
        emissive: new THREE.Color(0x0a0314),
        emissiveIntensity: 0.2
      });

      earthMesh = new THREE.Mesh(earthGeo, earthMat);
      globeGroup.add(earthMesh);

      textureLoader.load(
        EARTH_TEXTURE_URL,
        (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = 8;
          earthMat.map = tex;
          earthMat.color = new THREE.Color(0xffffff);
          earthMat.needsUpdate = true;
        }
      );

      textureLoader.load(
        EARTH_BUMP_URL,
        (bumpTex) => {
          earthMat.bumpMap = bumpTex;
          earthMat.bumpScale = 0.03;
          earthMat.needsUpdate = true;
        }
      );

      // Neon Atmosphere Fresnel Glow
      const atmGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 1.022, 64, 64);
      const atmMat = new THREE.ShaderMaterial({
        transparent: true,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        uniforms: {
          glowColor: { value: new THREE.Color(0xe00279) }
        },
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          uniform vec3 glowColor;
          void main() {
            float intensity = pow(0.62 - dot(vNormal, vec3(0, 0, 1.0)), 2.2);
            gl_FragColor = vec4(glowColor, intensity * 0.45);
          }
        `
      });
      const atmMesh = new THREE.Mesh(atmGeo, atmMat);
      globeGroup.add(atmMesh);
    }

    // =================================================================
    // 2000+ REFINED SLEEK STATION DOTS (HIGH-DENSITY GPU POINTS)
    // =================================================================
    let stationPointsObj = null;

    function createStationMarkers() {
      renderStationMarkers();
    }

    function renderStationMarkers() {
      if (stationPointsObj) {
        globeGroup.remove(stationPointsObj);
        stationPointsObj.geometry.dispose();
      }

      state.markerMeshes = [];

      const count = state.stations.length;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      const colorPink = new THREE.Color(0xff2d92);
      const colorPurple = new THREE.Color(0xb5179e);
      const colorBlue = new THREE.Color(0x00f5d4);
      const colorOrange = new THREE.Color(0xff7700);

      state.stations.forEach((st, i) => {
        if (st.geo_lat == null || st.geo_long == null) return;
        const pos = latLonToVector3(st.geo_lat, st.geo_long, GLOBE_RADIUS * 1.006);

        positions[i * 3] = pos.x;
        positions[i * 3 + 1] = pos.y;
        positions[i * 3 + 2] = pos.z;

        let c = colorPink;
        if (st.tags && (st.tags.toLowerCase().includes('jazz') || st.tags.toLowerCase().includes('chill'))) c = colorBlue;
        else if (st.tags && st.tags.toLowerCase().includes('rock')) c = colorPurple;
        else if (st.tags && st.tags.toLowerCase().includes('news')) c = colorOrange;

        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      });

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.022,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending
      });

      stationPointsObj = new THREE.Points(geometry, material);
      globeGroup.add(stationPointsObj);
    }

    // =================================================================
    // ACTIVE STATION RADAR BEACON (CONCENTRIC PULSING RINGS)
    // =================================================================
    function createRadarBeacon() {
      state.radarBeacon = new THREE.Group();
      globeGroup.add(state.radarBeacon);

      radarRings = [];
      const ringCount = 3;

      for (let i = 0; i < ringCount; i++) {
        const ringGeo = new THREE.RingGeometry(0.035, 0.055, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xff2d92,
          transparent: true,
          opacity: 0.85,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        state.radarBeacon.add(ringMesh);
        radarRings.push({ mesh: ringMesh, progress: i / ringCount });
      }

      // Center bright core
      const coreGeo = new THREE.SphereGeometry(0.035, 16, 16);
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        blending: THREE.AdditiveBlending
      });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      state.radarBeacon.add(coreMesh);

      if (state.activeStation) {
        updateRadarBeacon(state.activeStation.geo_lat, state.activeStation.geo_long);
      }
    }

    function updateRadarBeacon(lat, lon) {
      if (!state.radarBeacon || lat == null || lon == null) return;
      const pos = latLonToVector3(lat, lon, GLOBE_RADIUS * 1.01);
      state.radarBeacon.position.copy(pos);

      const normal = pos.clone().normalize();
      state.radarBeacon.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
    }

    function flyToStation(lat, lon) {
      if (lat == null || lon == null || !controls) return;

      controls.autoRotate = false;

      // Fly close to city level
      const targetPos = latLonToVector3(lat, lon, 3.4);

      targetCameraPosition = {
        x: targetPos.x + (window.innerWidth > 900 ? 0.6 : 0),
        y: targetPos.y,
        z: targetPos.z
      };

      setTimeout(() => {
        controls.autoRotate = true;
        targetCameraPosition = null;
      }, 7000);
    }

    function setupZoomButtons() {
      document.getElementById('btn-zoom-in').addEventListener('click', () => {
        const dir = camera.position.clone().sub(controls.target).normalize();
        const dist = camera.position.distanceTo(controls.target);
        if (dist > controls.minDistance + 0.1) {
          camera.position.addScaledVector(dir, -0.6);
        }
      });

      document.getElementById('btn-zoom-out').addEventListener('click', () => {
        const dir = camera.position.clone().sub(controls.target).normalize();
        const dist = camera.position.distanceTo(controls.target);
        if (dist < controls.maxDistance - 0.5) {
          camera.position.addScaledVector(dir, 0.8);
        }
      });

      document.getElementById('btn-reset-cam').addEventListener('click', () => {
        updateCameraPosition();
        controls.autoRotate = true;
      });

      document.getElementById('btn-random-station').addEventListener('click', () => {
        playRandomStation();
      });
    }

    function createStarfield() {
      const count = 1800;
      const positions = [];
      for (let i = 0; i < count; i++) {
        const r = 30 + Math.random() * 50;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions.push(
          r * Math.sin(phi) * Math.cos(theta),
          r * Math.sin(phi) * Math.sin(theta),
          r * Math.cos(phi)
        );
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.14,
        color: 0xd8b4e2,
        transparent: true,
        opacity: 0.65
      });
      const stars = new THREE.Points(geo, mat);
      scene.add(stars);
    }

    // =================================================================
    // DIRECT CLICK & HOVER RAYCASTING (INSTANT RADIO ON CLICK)
    // =================================================================
    function setupRaycaster(domElement) {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const tooltip = document.getElementById('globe-tooltip');
      const ttName = document.getElementById('tt-name');
      const ttCountry = document.getElementById('tt-country');

      let isDown = false;
      let startX = 0;
      let startY = 0;

      domElement.addEventListener('pointerdown', (e) => {
        isDown = true;
        startX = e.clientX;
        startY = e.clientY;
      });

      domElement.addEventListener('pointermove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        if (earthMesh) {
          const earthIntersects = raycaster.intersectObject(earthMesh, false);
          if (earthIntersects.length > 0) {
            const hitPoint = earthIntersects[0].point;
            const hitCoord = vector3ToLatLon(hitPoint.clone().sub(globeGroup.position));
            const nearest = findNearestStation(hitCoord.lat, hitCoord.lon, 6.0);

            if (nearest) {
              domElement.style.cursor = 'pointer';
              state.hoveredStation = nearest;
              ttName.textContent = nearest.city ? `${nearest.name} (${nearest.city})` : nearest.name;
              ttCountry.textContent = nearest.country || 'Live Radio';
              tooltip.style.display = 'block';
              tooltip.style.left = e.clientX + 'px';
              tooltip.style.top = e.clientY + 'px';
              return;
            }
          }
        }

        domElement.style.cursor = isDown ? 'grabbing' : 'grab';
        state.hoveredStation = null;
        tooltip.style.display = 'none';
      });

      // INSTANT PLAY ON CLICK
      domElement.addEventListener('pointerup', (e) => {
        isDown = false;
        const diffX = Math.abs(e.clientX - startX);
        const diffY = Math.abs(e.clientY - startY);

        if (diffX < 7 && diffY < 7) {
          if (state.hoveredStation) {
            playStation(state.hoveredStation);
          } else if (earthMesh) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const earthIntersects = raycaster.intersectObject(earthMesh, false);

            if (earthIntersects.length > 0) {
              const hitPoint = earthIntersects[0].point;
              const hitCoord = vector3ToLatLon(hitPoint.clone().sub(globeGroup.position));
              const nearest = findNearestStation(hitCoord.lat, hitCoord.lon, 18.0);
              if (nearest) {
                playStation(nearest);
              }
            }
          }
        }
      });
    }

    function findNearestStation(lat, lon, maxDistanceDegrees = 15.0) {
      let nearest = null;
      let minDistance = Infinity;

      for (const st of state.stations) {
        if (st.geo_lat == null || st.geo_long == null) continue;
        const dLat = st.geo_lat - lat;
        const dLon = st.geo_long - lon;
        const dist = Math.sqrt(dLat * dLat + dLon * dLon);
        if (dist < minDistance && dist <= maxDistanceDegrees) {
          minDistance = dist;
          nearest = st;
        }
      }
      return nearest;
    }

    // =================================================================
    // ANIMATION LOOP
    // =================================================================
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // Animate pulsing radar beacon rings
      radarRings.forEach(r => {
        r.progress = (r.progress + delta * 0.65) % 1.0;
        const scale = 1.0 + r.progress * 4.0;
        r.mesh.scale.set(scale, scale, 1);
        r.mesh.material.opacity = (1.0 - r.progress) * 0.85;
      });

      // Camera flight interpolation
      if (targetCameraPosition) {
        camera.position.lerp(new THREE.Vector3(
          targetCameraPosition.x,
          targetCameraPosition.y,
          targetCameraPosition.z
        ), 0.04);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateCameraPosition();
    }

    // =================================================================
    // UI RENDERING & EVENTS
    // =================================================================
    function renderQuickPlaylist() {
      const container = document.getElementById('quick-playlist-container');
      const displayStations = state.stations.slice(0, 5);

      let html = '';
      displayStations.forEach(st => {
        const isActive = state.activeStation && state.activeStation.stationuuid === st.stationuuid;
        const badgeClass = `badge-${st.badgeType || 'pink'}`;

        let badgeContent = '';
        if (st.badgeIcon === 'waves') {
          badgeContent = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12h2M8 8v8M12 4v16M16 8v8M20 12h2"/></svg>`;
        } else if (st.badgeIcon === 'radio') {
          badgeContent = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2M7.8 16.2a6 6 0 0 1 0-8.4"/></svg>`;
        } else if (st.badgeText) {
          badgeContent = `<span>${st.badgeText}</span>`;
        } else {
          badgeContent = `<span>${(st.name || 'R').slice(0, 2).toUpperCase()}</span>`;
        }

        html += `
          <div class="station-list-item ${isActive ? 'active' : ''}" data-uuid="${st.stationuuid}">
            <div class="item-icon-badge ${badgeClass}">
              ${badgeContent}
            </div>
            <div class="item-info">
              <div class="item-name">${escapeHtml(st.name)}</div>
              <div class="item-sub">${escapeHtml(st.city ? `${st.city} · ${st.country}` : st.country || 'Live')}</div>
            </div>
            <div class="item-play-action">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                ${isActive && state.isPlaying ? '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>' : '<polygon points="7 4 19 12 7 20 7 4"></polygon>'}
              </svg>
            </div>
          </div>
        `;
      });

      html += `
        <button class="playlist-footer-btn" id="view-all-stations-btn">
          <span>View all stations (${state.stations.length})</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      `;

      container.innerHTML = html;

      // Event listeners for playlist items
      container.querySelectorAll('.station-list-item').forEach(el => {
        el.addEventListener('click', () => {
          const uuid = el.dataset.uuid;
          const found = state.stations.find(s => s.stationuuid === uuid);
          if (found) {
            if (state.activeStation && state.activeStation.stationuuid === uuid) {
              togglePlay();
            } else {
              playStation(found);
            }
          }
        });
      });

      // View all click
      const viewAllBtn = document.getElementById('view-all-stations-btn');
      if (viewAllBtn) {
        viewAllBtn.addEventListener('click', () => openCatalogModal());
      }
    }

    function updateUIState() {
      const playSvg = document.getElementById('play-svg');
      const soundwave = document.getElementById('soundwave');
      const nameEl = document.getElementById('current-station-name');
      const countryEl = document.getElementById('current-station-country');
      const playerCard = document.getElementById('player-card');

      if (state.activeStation) {
        nameEl.textContent = state.activeStation.name;
        countryEl.textContent = state.activeStation.city ? `${state.activeStation.city}, ${state.activeStation.country}` : state.activeStation.country || 'Live Worldwide';
      }

      if (state.isPlaying) {
        playSvg.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>';
        soundwave.classList.add('playing');
        playerCard.classList.add('playing');
      } else {
        playSvg.innerHTML = '<polygon points="6 4 20 12 6 20 6 4"></polygon>';
        soundwave.classList.remove('playing');
        playerCard.classList.remove('playing');
      }

      renderQuickPlaylist();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    // =================================================================
    // API FETCH (LOAD 2000+ REAL WORKING WORLDWIDE STATIONS)
    // =================================================================
    async function loadGlobalStations(query = '', tag = '') {
      const counterText = document.getElementById('station-count-text');
      
      // Query 2500 geo-tagged worldwide stations
      let endpoint = '/json/stations/search?has_geo_info=true&limit=2500&order=clickcount&reverse=true&hidebroken=true';
      if (query) {
        endpoint = `/json/stations/byname/${encodeURIComponent(query)}?hidebroken=true&limit=400`;
      } else if (tag && tag !== 'all') {
        endpoint = `/json/stations/bycountrycodeexact/${encodeURIComponent(tag)}?hidebroken=true&limit=400`;
      }

      for (const mirror of RADIO_API_MIRRORS) {
        try {
          const res = await fetch(`${mirror}${endpoint}`, {
            headers: { 'Accept': 'application/json' }
          });
          if (res.ok) {
            const data = await res.json();
            const valid = data
              .filter(s => (s.url_resolved || s.url))
              .map(s => {
                let lat = s.geo_lat;
                let lon = s.geo_long;

                if (lat == null || lon == null) {
                  const cc = (s.countrycode || '').toUpperCase();
                  if (COUNTRY_COORDS[cc]) {
                    lat = COUNTRY_COORDS[cc].lat + (Math.random() - 0.5) * 3.5;
                    lon = COUNTRY_COORDS[cc].lon + (Math.random() - 0.5) * 3.5;
                  }
                }

                return {
                  stationuuid: s.stationuuid,
                  name: (s.name || 'Radio').trim(),
                  country: s.country || '',
                  city: s.state || s.country || '',
                  tags: s.tags || '',
                  url: s.url,
                  url_resolved: s.url_resolved || s.url,
                  geo_lat: lat,
                  geo_long: lon,
                  badgeType: ['pink', 'blue', 'orange', 'magenta', 'dark'][Math.floor(Math.random() * 5)]
                };
              })
              .filter(s => s.geo_lat != null && s.geo_long != null);

            if (valid.length > 0) {
              state.stations = [...PRESET_STATIONS, ...valid.filter(v => !PRESET_STATIONS.some(p => p.stationuuid === v.stationuuid || p.name === v.name))];
              renderStationMarkers();
              renderCatalogList(state.stations);
              if (counterText) {
                counterText.textContent = `${state.stations.length} станцій онлайн`;
              }
              const badge = document.getElementById('catalog-count-badge');
              if (badge) badge.textContent = `${state.stations.length} станцій`;
              return;
            }
          }
        } catch (e) {
          console.warn(`Mirror ${mirror} lookup failed:`, e);
        }
      }
    }

    // =================================================================
    // CATALOG MODAL & SEARCH
    // =================================================================
    function openCatalogModal() {
      const modal = document.getElementById('catalog-modal');
      modal.classList.add('active');
      renderCatalogList(state.stations);
    }

    function closeCatalogModal() {
      const modal = document.getElementById('catalog-modal');
      modal.classList.remove('active');
    }

    function renderCatalogList(list) {
      const container = document.getElementById('catalog-stations-list');
      const badge = document.getElementById('catalog-count-badge');
      if (badge) badge.textContent = `${list.length} станцій`;

      if (list.length === 0) {
        container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-dim);">Станцій не знайдено</div>`;
        return;
      }

      let html = '';
      list.slice(0, 400).forEach(st => {
        const isActive = state.activeStation && state.activeStation.stationuuid === st.stationuuid;
        html += `
          <div class="station-list-item ${isActive ? 'active' : ''}" data-uuid="${st.stationuuid}">
            <div class="item-icon-badge badge-pink">
              <span>${(st.name || 'R').slice(0, 2).toUpperCase()}</span>
            </div>
            <div class="item-info">
              <div class="item-name">${escapeHtml(st.name)}</div>
              <div class="item-sub">${escapeHtml(st.city ? `${st.city}, ${st.country}` : st.country || st.tags || 'Live')}</div>
            </div>
            <div class="item-play-action">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="7 4 19 12 7 20 7 4"></polygon>
              </svg>
            </div>
          </div>
        `;
      });

      if (list.length > 400) {
        html += `<div style="text-align: center; padding: 14px; color: var(--pink-neon); font-size: 12px;">Показано топ-400 станцій. Введіть назву або місто у пошуку для деталізації.</div>`;
      }

      container.innerHTML = html;

      container.querySelectorAll('.station-list-item').forEach(el => {
        el.addEventListener('click', () => {
          const uuid = el.dataset.uuid;
          const found = state.stations.find(s => s.stationuuid === uuid);
          if (found) {
            playStation(found);
            closeCatalogModal();
          }
        });
      });
    }

    // =================================================================
    // EVENT BINDINGS
    // =================================================================
    function setupDOMEvents() {
      document.getElementById('play-pause-btn').addEventListener('click', togglePlay);
      document.getElementById('prev-btn').addEventListener('click', playPrev);
      document.getElementById('next-btn').addEventListener('click', playNext);

      // Volume Slider
      const volumeSlider = document.getElementById('volume-slider');
      volumeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value) / 100;
        state.volume = val;
        if (state.audio) state.audio.volume = val;
      });

      // Mute Toggle
      document.getElementById('volume-mute-btn').addEventListener('click', () => {
        if (state.volume > 0) {
          state._prevVol = state.volume;
          state.volume = 0;
          volumeSlider.value = 0;
        } else {
          state.volume = state._prevVol || 0.8;
          volumeSlider.value = (state._prevVol || 0.8) * 100;
        }
        if (state.audio) state.audio.volume = state.volume;
      });

      // Modal close events
      document.getElementById('catalog-close-btn').addEventListener('click', closeCatalogModal);
      document.getElementById('catalog-modal').addEventListener('click', (e) => {
        if (e.target.id === 'catalog-modal') closeCatalogModal();
      });

      // Catalog Search Input
      const searchInput = document.getElementById('catalog-search-input');
      let searchTimer = null;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        const q = e.target.value.trim().toLowerCase();
        searchTimer = setTimeout(() => {
          if (q.length >= 2) {
            const filtered = state.stations.filter(s =>
              s.name.toLowerCase().includes(q) ||
              (s.city && s.city.toLowerCase().includes(q)) ||
              (s.country && s.country.toLowerCase().includes(q)) ||
              (s.tags && s.tags.toLowerCase().includes(q))
            );
            renderCatalogList(filtered);
          } else {
            renderCatalogList(state.stations);
          }
        }, 200);
      });

      // Tag Filter Pills
      document.querySelectorAll('.tag-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const tag = btn.dataset.tag;
          if (tag === 'all') {
            renderCatalogList(state.stations);
          } else {
            const filtered = state.stations.filter(s =>
              (s.country && s.country.toLowerCase().includes(tag.toLowerCase())) ||
              (s.city && s.city.toLowerCase().includes(tag.toLowerCase())) ||
              (s.tags && s.tags.toLowerCase().includes(tag.toLowerCase()))
            );
            renderCatalogList(filtered);
          }
        });
      });

      // Keyboard space to play/pause
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          togglePlay();
        }
      });
    }

    // =================================================================
    // INITIALIZATION
    // =================================================================
    function init() {
      initAudioEngine();
      init3DScene();
      renderQuickPlaylist();
      updateUIState();
      setupDOMEvents();

      // Fetch dynamic 2000+ radio stations worldwide in background
      loadGlobalStations();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
