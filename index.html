<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IBONIRIUM · Terrarium · EXP-03 · Лабіринт Полів</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#000;
  overflow:hidden;
}
canvas { position:fixed; inset:0; }
#sensors{ position:fixed; left:0; right:0; bottom:0; height:140px; pointer-events:none; }
#info {
  position:fixed;
  bottom:12px; left:12px;
  font-family:monospace;
  color:#88ffcc;
  font-size:12px;
  line-height:1.4;
  opacity:0.85;
}
#panel {
  position:fixed;
  bottom:12px; right:12px;
  max-width:360px;
  font-family:monospace;
  font-size:12px;
  color:#c7ffd9;
  line-height:1.45;
  background:linear-gradient(to left,rgba(0,0,0,0.65),transparent);
  padding:10px 14px;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<canvas id="terrarium"></canvas>
<canvas id="sensors"></canvas>

<div id="info">
<b>IBONIRIUM · LAB TERRARIUM · EXP-03</b><br>
Phase: <span id="phase">Growth</span><br>
Day: <span id="day">–</span><br>
Solar SSN: <span id="ssn">–</span><br>
Solar Factor: <span id="sf">–</span><br>
Activity: <span id="ge">–</span><br>
Target: 13 December
</div>

<div id="panel">
<b>СТАН ЕКСПЕРИМЕНТУ</b><br>
Поля культур з хаотичними формами та павутинням-зв’язками. З висоти утворюють лабіринт.<br><br>
Геометрія пульсує повільно. Простір дихає.
</div>

<script>
/* CANVAS */
const starCanvas = document.getElementById('stars');
const tCanvas = document.getElementById('terrarium');
const sensorCanvas = document.getElementById('sensors');
const sctx = starCanvas.getContext('2d');
const tctx = tCanvas.getContext('2d');
const scx = sensorCanvas.getContext('2d');

function resize(){
  starCanvas.width = tCanvas.width = sensorCanvas.width = innerWidth;
  starCanvas.height = tCanvas.height = innerHeight;
  sensorCanvas.height = 140;
}
addEventListener('resize', resize); resize();

/* ЗІРКИ */
const stars = Array.from({length:320},()=>({x:Math.random(),y:Math.random(),z:Math.random()*0.8+0.2}));
function drawStars(){
  sctx.clearRect(0,0,starCanvas.width,starCanvas.height);
  stars.forEach(st=>{
    st.y += 0.00006 * st.z;
    if(st.y>1) st.y=0;
    sctx.globalAlpha = 0.2 + st.z*0.4;
    sctx.fillStyle="#ddd";
    sctx.beginPath();
    sctx.arc(st.x*starCanvas.width, st.y*starCanvas.height, st.z*1.2, 0, Math.PI*2);
    sctx.fill();
  });
  sctx.globalAlpha=1;
}

/* NOAA */
let solarFactor = 1;
let solarSSN = 0;
let activity = 0;
async function updateSolar(){
  try{
    const r = await fetch('https://services.swpc.noaa.gov/json/solar-cycle/predicted-solar-cycle.json');
    const d = await r.json();
    const l = d[d.length-1];
    solarSSN = l.predicted_ssn;
    solarFactor = Math.min(4, 0.7 + solarSSN/100);
    activity = solarFactor * (0.6 + Math.random()*0.4);
    ssn.textContent = solarSSN.toFixed(1);
    sf.textContent = solarFactor.toFixed(2);
    ge.textContent = activity.toFixed(2);
  }catch(e){ solarFactor = 1.2; }
}
updateSolar(); setInterval(updateSolar, 1800000);

/* КУЛЬТУРИ */
const CULTURES = [
  {name:'Пшениця', color:'rgba(255,200,80,0.5)'},
  {name:'Ячмінь', color:'rgba(180,220,100,0.5)'},
  {name:'Кукурудза', color:'rgba(255,230,150,0.5)'},
  {name:'Рис', color:'rgba(150,200,255,0.5)'},
  {name:'Соя', color:'rgba(180,150,255,0.5)'},
  {name:'Овес', color:'rgba(200,180,255,0.5)'},
  {name:'Гречка', color:'rgba(255,150,180,0.5)'}
];

/* ПУЛЬС ПРОСТОРУ */
function spacePulse(){
  return 1 + Math.sin(Date.now()*0.00015)*0.08;
}

/* ПОЛЕ */
class Field{
  constructor(x,y){
    this.cx=x; this.cy=y;
    this.growth=0;
    this.maxGrowth=22+Math.random()*22;
    this.offset=Math.random();
    this.speed=0.00025+Math.random()*0.0004;
    this.culture=CULTURES[Math.floor(Math.random()*CULTURES.length)];
    this.chaos=Array.from({length:6},()=>Math.random()*Math.PI*2);
  }
  grow(){
    if(this.growth<this.maxGrowth) this.growth+=0.025*solarFactor;
    this.offset+=this.speed;
  }
  draw(){
    const pulse=spacePulse();
    const steps=Math.min(this.growth,this.maxGrowth)*28;
    tctx.strokeStyle=this.culture.color;
    tctx.lineWidth=0.8;
    tctx.beginPath();
    for(let i=0;i<=steps;i++){
      const t=i/steps;
      let r=t*110*pulse*(1+activity*0.25);
      this.chaos.forEach(c=>{ r+=Math.sin(c+i*0.4+Date.now()*0.0003)*4; });
      const a=t*Math.PI*2*(3+Math.sin(this.offset*6));
      const x=this.cx+Math.cos(a)*r;
      const y=this.cy+Math.sin(a)*r;
      i? tctx.lineTo(x,y):tctx.moveTo(x,y);
    }
    tctx.stroke();

    /* геометричний резонатор */
    tctx.strokeStyle='rgba(200,220,255,0.08)';
    tctx.beginPath();
    tctx.arc(this.cx,this.cy,this.growth*5*pulse,0,Math.PI*2);
    tctx.stroke();
  }
}

/* ПОЛЯ */
const fields=Array.from({length:22},()=>new Field(
  Math.random()*innerWidth,
  Math.random()*innerHeight*0.8+innerHeight*0.1
));

/* ЛАБІРИНТ */
function drawLinks(){
  tctx.strokeStyle='rgba(180,180,255,0.08)';
  tctx.lineWidth=0.5;
  fields.forEach((f,i)=>{
    fields.slice(i+1).forEach((g,j)=>{
      const d=Math.hypot(f.cx-g.cx,f.cy-g.cy);
      if(d<420){
        const w=Math.sin(Date.now()*0.0004+(i+j))*6;
        tctx.beginPath();
        tctx.moveTo(f.cx+w,f.cy-w);
        tctx.lineTo(g.cx-w,g.cy+w);
        tctx.stroke();
      }
    });
  });
}

/* SENSORS */
function drawSensors(){
  scx.clearRect(0,0,sensorCanvas.width,sensorCanvas.height);
  const y=110;
  scx.strokeStyle='rgba(120,255,180,0.15)';
  scx.beginPath(); scx.moveTo(0,y); scx.lineTo(sensorCanvas.width,y); scx.stroke();
}

/* TIME */
const START_DATE=new Date('2026-01-01');
const STOP_DATE=new Date('2026-12-13');
function updateDay(){
  const now=new Date();
  day.textContent=Math.floor((now-START_DATE)/86400000);
  phase.textContent=now<STOP_DATE?'Growth':'Final';
}
setInterval(updateDay,60000); updateDay();

/* LOOP */
function loop(){
  drawStars();
  drawSensors();
  if(new Date()<STOP_DATE){
    tctx.clearRect(0,0,tCanvas.width,tCanvas.height);
    fields.forEach(f=>{f.grow(); f.draw();});
    drawLinks();
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
