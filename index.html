<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM — NOAA LIVE DASHBOARD</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:Arial;
}

#panel{
position:fixed;
top:10px;
left:10px;
font-size:10px;
color:#9ff;
opacity:0.8;
}

canvas{
position:fixed;
top:0;
left:0;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="panel">
IBONARIUM LIVE<br>
Kp: <span id="kp">--</span><br>
Wind: <span id="wind">--</span><br>
Bz: <span id="bz">--</span><br>
Flux: <span id="flux">--</span>
</div>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ================= STATE =================

let state = {
kp: 2,
wind: 400,
bz: 0,
flux: 120
};

// ================= NOAA FETCH =================

async function loadNOAA(){

try{

// Kp
let kpRes = await fetch("https://services.swpc.noaa.gov/json/planetary_k_index_1m.json");
let kpData = await kpRes.json();
state.kp = kpData[kpData.length-1].kp;

// WIND
let windRes = await fetch("https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json");
let windData = await windRes.json();
state.wind = windData[windData.length-1].speed;

// MAG Bz
let magRes = await fetch("https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json");
let magData = await magRes.json();
state.bz = magData[magData.length-1].bz;

// FLUX
let fluxRes = await fetch("https://services.swpc.noaa.gov/json/f107_cm_flux.json");
let fluxData = await fluxRes.json();
state.flux = fluxData[fluxData.length-1].flux;

updatePanel();

}catch(e){
console.log("NOAA error", e);
}

}

function updatePanel(){
kp.textContent = state.kp.toFixed(2);
wind.textContent = state.wind.toFixed(0);
bz.textContent = state.bz.toFixed(2);
flux.textContent = state.flux.toFixed(1);
}

loadNOAA();
setInterval(loadNOAA, 60000); // 1 хв

// ================= PARTICLES =================

let particles = [];

function spawn(){

let chaos = state.kp / 9;
let speedBase = state.wind / 800;

particles.push({
x: Math.random()*canvas.width,
y: Math.random()*canvas.height*0.3,
vx:(Math.random()-0.5)*speedBase*4,
vy:(Math.random()-0.5)*speedBase*4,
life:200+Math.random()*200,
size:1+chaos*2
});

if(particles.length>600) particles.shift();

}

setInterval(spawn, 40);

// ================= DRAW =================

function draw(){

ctx.fillStyle="rgba(0,0,0,0.25)";
ctx.fillRect(0,0,canvas.width,canvas.height);

let chaos = state.kp/9;
let glow = state.flux/200;

for(let p of particles){

p.x += p.vx + Math.sin(Date.now()*0.001+p.y)*chaos;
p.y += p.vy + Math.cos(Date.now()*0.001+p.x)*chaos;

p.life--;

ctx.beginPath();
ctx.arc(p.x,p.y,p.size+glow,0,Math.PI*2);
ctx.fillStyle=`rgba(150,255,255,${0.2+glow*0.3})`;
ctx.fill();

}

particles = particles.filter(p=>p.life>0);

requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
