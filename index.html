<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>MEGACITY 175 — 3D WORLD TOUR</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Inter',sans-serif;
background:#000;
color:white;
}

/* ===== MAIN ===== */

.main{
display:flex;
width:100%;
height:100vh;
}

/* ===== SIDEBAR ===== */

.sidebar{
width:340px;
height:100%;
background:#050505;
border-right:1px solid rgba(255,255,255,.08);
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:16px;
}

/* ===== TITLE ===== */

.title{
font-size:28px;
font-weight:800;
line-height:1.1;
margin-bottom:10px;
}

.sub{
font-size:12px;
opacity:.55;
line-height:1.6;
margin-bottom:10px;
}

/* ===== SEARCH ===== */

.search{
width:100%;
height:48px;
border:none;
outline:none;
background:#111;
border-radius:14px;
padding:0 16px;
color:white;
font-size:14px;
margin-bottom:8px;
}

/* ===== CITY LIST ===== */

.city-list{
display:flex;
flex-direction:column;
gap:10px;
}

.city{
background:#111;
border:1px solid rgba(255,255,255,.06);
padding:14px;
border-radius:16px;
cursor:pointer;
transition:.25s;
}

.city:hover{
transform:translateX(5px);
background:#181818;
border-color:rgba(255,255,255,.15);
}

.city-name{
font-weight:700;
font-size:15px;
}

.country{
font-size:12px;
opacity:.55;
margin-top:4px;
}

/* ===== MAP ===== */

.viewer{
position:relative;
flex:1;
height:100%;
overflow:hidden;
}

.viewer iframe{
width:100%;
height:100%;
border:none;
}

/* ===== HUD ===== */

.hud{
position:absolute;
top:25px;
right:25px;
width:280px;
background:rgba(0,0,0,.55);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:20px;
z-index:10;
}

.hud-title{
font-size:20px;
font-weight:800;
margin-bottom:12px;
}

.stat{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:13px;
opacity:.82;
}

.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px;
}

button{
height:44px;
border:none;
border-radius:12px;
background:#181818;
color:white;
font-weight:600;
cursor:pointer;
transition:.25s;
}

button:hover{
background:#262626;
transform:translateY(-2px);
}

/* ===== OVERLAY ===== */

.scan{
position:absolute;
inset:0;
pointer-events:none;
background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.025) 0px,
rgba(255,255,255,.025) 1px,
transparent 2px,
transparent 4px
);
mix-blend-mode:screen;
opacity:.18;
}

/* ===== MOBILE ===== */

@media(max-width:900px){

.main{
flex-direction:column;
}

.sidebar{
width:100%;
height:38%;
}

.viewer{
height:62%;
}

.hud{
width:240px;
}

}

</style>
</head>

<body>

<div class="main">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="title">
MEGACITY 175
</div>

<div class="sub">
3D interactive world tour system<br>
Google Maps / Satellite / Megapolis Explorer
</div>

<input
class="search"
type="text"
placeholder="Пошук міста..."
onkeyup="filterCities(this.value)"
>

<div class="city-list" id="cityList"></div>

</div>

<!-- VIEWER -->

<div class="viewer">

<iframe
id="mapFrame"
src="https://www.google.com/maps?q=Tokyo&output=embed">
</iframe>

<div class="scan"></div>

<div class="hud">

<div class="hud-title" id="currentCity">
Tokyo
</div>

<div class="stat">
<span>MODE</span>
<span>3D SATELLITE</span>
</div>

<div class="stat">
<span>STATUS</span>
<span>ONLINE</span>
</div>

<div class="stat">
<span>WORLD NODE</span>
<span id="nodeId">001</span>
</div>

<div class="stat">
<span>VISITORS</span>
<span>02</span>
</div>

<div class="controls">

<button onclick="satelliteMode()">
SATELLITE
</button>

<button onclick="streetMode()">
STREET
</button>

<button onclick="nightMode()">
NIGHT
</button>

<button onclick="resetView()">
RESET
</button>

</div>

</div>

</div>

</div>

/* ===== RENDER ===== */

const cityList=document.getElementById('cityList');

function renderCities(list){

cityList.innerHTML='';

list.forEach((city,index)=>{

const div=document.createElement('div');

div.className='city';

div.innerHTML=`
<div class="city-name">${city[0]}</div>
<div class="country">${city[1]}</div>
`;

div.onclick=()=>openCity(city[0],index);

cityList.appendChild(div);

});

}

renderCities(cities);

/* ===== OPEN CITY ===== */

function openCity(city,index){

document.getElementById('mapFrame').src=
`https://www.google.com/maps?q=${city}&output=embed`;

document.getElementById('currentCity').innerText=city;

document.getElementById('nodeId').innerText=
String(index+1).padStart(3,'0');

}

/* ===== SEARCH ===== */

function filterCities(text){

const filtered=cities.filter(c=>
c[0].toLowerCase().includes(text.toLowerCase())
);

renderCities(filtered);

}

/* ===== MODES ===== */

function satelliteMode(){

document.getElementById('mapFrame').style.filter=
'contrast(1.05) saturate(1.1)';

}

function streetMode(){

document.getElementById('mapFrame').style.filter=
'brightness(1.05)';

}

function nightMode(){

document.body.style.background='#000';

document.querySelector('.scan').style.opacity='.28';

}

function resetView(){

location.reload();

}

</body>
</html>
