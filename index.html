<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

let w,h;
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;}
resize();addEventListener('resize',resize);

const NODES=520,MAX_DIST=168;
const nodes=[],edges=[];

class Node{
 constructor(x,y){
  this.x=x;this.y=y;
  this.baseX=x;this.baseY=y;

  this.owner=null;
  this.phase=Math.random()*6.28;

  this.energy=Math.random()*0.5+0.5;
  this.breath=0;

  this.angle=Math.random()*6.28;
  this.flash=0;
 }
}

for(let i=0;i<NODES;i++){
 nodes.push(new Node(Math.random()*w,Math.random()*h));
}

for(let i=0;i<NODES;i++){
 for(let j=i+1;j<NODES;j++){
  const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);
  if(d<MAX_DIST)edges.push({a:i,b:j,baseAlpha:.1});
 }
}

nodes[0].owner='A';
nodes[1].owner='B';

let space={kp:2.3,wind:380,bz:1};

async function updateSpace(){
 try{
  const r=await fetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json');
  const d=await r.json();
  space.kp=parseFloat(d[d.length-1][1])||space.kp;

  const w=await fetch('https://services.swpc.noaa.gov/products/solar-wind/plasma-1-minute.json');
  const wd=await w.json();
  const L=wd[wd.length-1];
  space.wind=parseFloat(L[2])||space.wind;
  space.bz=parseFloat(L[3])||space.bz;

  kp.textContent=space.kp.toFixed(1);
  wind.textContent=Math.round(space.wind);
  bz.textContent=space.bz.toFixed(1);
 }catch{}
}
setInterval(updateSpace,60000);
updateSpace();

/* --- РІСТ --- */
function growFrom(i,civ,r){
 const o=nodes[i];
 nodes.forEach(n=>{
  if(n.owner)return;
  if(Math.hypot(n.x-o.x,n.y-o.y)<MAX_DIST*r){
   if(Math.random()<0.2)n.owner=civ;
  }
 });
}

/* --- СИМУЛЯЦІЯ --- */
function simulate(){
 const t=Date.now()*0.001;

 nodes.forEach((n,i)=>{
  /* ДИХАННЯ */
  n.breath=(Math.sin(t*0.6+n.phase)+1)/2;

  /* ПОВІЛЬНИЙ КРУГОВИЙ РУХ */
  n.angle+=0.0004;
  n.x=n.baseX+Math.cos(n.angle)*6;
  n.y=n.baseY+Math.sin(n.angle)*6;

  /* СПАЛАХИ */
  if(Math.random()<0.002){
   n.flash=1;
  }
  n.flash*=0.92;

  /* ЦИВІЛІЗАЦІЇ */
  if(n.owner==='A'&&Math.random()<0.006*(1-space.kp/9))
    growFrom(i,'A',1.2);

  if(n.owner==='B'&&Math.random()<0.015)
    growFrom(i,'B',2);
 });

 /* --- ТУМАННІСТЬ --- */
 const nebulaPower=(space.kp/9)+(space.bz<0?Math.abs(space.bz)/10:0);

 if(nebulaPower>0.6){
  nodes.forEach((n,i)=>{
   if(Math.random()<0.01*nebulaPower){
    n.owner='N';
    growFrom(i,'N',2.5);
   }
  });
 }

 /* --- ПЕРЕДАЧА ЕНЕРГІЇ --- */
 edges.forEach(e=>{
  const a=nodes[e.a],b=nodes[e.b];
  if(!a.owner||!b.owner)return;

  const diff=(a.energy-b.energy)*0.02;
  a.energy-=diff;
  b.energy+=diff;
 });
}

/* --- МАЛЮВАННЯ --- */
function draw(){
 ctx.fillStyle='rgba(0,0,10,0.25)';
 ctx.fillRect(0,0,w,h);

 /* ЛІНІЇ */
 edges.forEach(e=>{
  const n1=nodes[e.a],n2=nodes[e.b];
  if(!n1.owner&&!n2.owner)return;

  let col='#888';
  const o=n1.owner||n2.owner;

  if(o==='A')col='rgba(160,140,255,.5)';
  if(o==='B')col='rgba(255,90,190,.5)';
  if(o==='N')col='rgba(90,255,255,.5)';

  const energyGlow=(n1.energy+n2.energy)/2;

  ctx.strokeStyle=col;
  ctx.globalAlpha=0.15+energyGlow*0.6;

  ctx.beginPath();
  ctx.moveTo(n1.x,n1.y);
  ctx.lineTo(n2.x,n2.y);
  ctx.stroke();
 });

 ctx.globalAlpha=1;

 /* ВУЗЛИ */
 let ca=0,cb=0,cn=0;

 nodes.forEach(n=>{
  if(!n.owner)return;

  const size=2+n.breath*2+n.flash*6;

  if(n.owner==='A')ctx.fillStyle='#c4b8ff',ca++;
  if(n.owner==='B')ctx.fillStyle='#ff9edc',cb++;
  if(n.owner==='N')ctx.fillStyle='#7fffff',cn++;

  ctx.shadowBlur=10+n.flash*25;
  ctx.shadowColor=ctx.fillStyle;

  ctx.beginPath();
  ctx.arc(n.x,n.y,size,0,6.28);
  ctx.fill();

  ctx.shadowBlur=0;
 });

 const t=ca+cb+cn||1;
 pct('pct-a',ca,t);
 pct('pct-b',cb,t);
 pct('pct-n',cn,t);

 edgesEl.textContent=
 edges.filter(e=>nodes[e.a].owner||nodes[e.b].owner).length;
}

/* UI helpers */
function pct(id,v,t){
 document.getElementById(id).textContent=(v/t*100).toFixed(1)+'%';
}
const edgesEl=document.getElementById('edges');

/* LOOP */
function loop(){
 simulate();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>
