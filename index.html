<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>txtLaborant2 + new13 — разом</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f9f9f9;
      color: #111;
      line-height: 1.5;
    }

    header {
      background: #1a2533;
      color: white;
      padding: 12px 16px;
      text-align: center;
      font-size: 1.1rem;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .section {
      padding: 16px;
      background: white;
      margin-bottom: 16px;
    }

    .section h2 {
      margin: 0 0 12px 0;
      font-size: 1.25rem;
      color: #1a2533;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    /* Щоб iframes не "з'їдали" весь екран */
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      min-height: 400px;          /* мінімальна висота, якщо контент порожній */
    }

    /* Мобільна адаптація — нічого не ламаємо */
    @media (max-width: 600px) {
      header {
        font-size: 1rem;
        padding: 10px 14px;
      }
      .section {
        padding: 12px;
      }
      .section h2 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

<header>
  txtLaborant2 　↓　 new13
</header>

<div class="section">
  <h2>Перший варіант — txtLaborant2</h2>
  <iframe src="https://lavandaaudit.github.io/txtLaborant2/"></iframe>
</div>

<div class="section">
  <h2>Другий варіант — new13</h2>
  <iframe src="https://lavandaaudit.github.io/new13/"></iframe>
</div>

</body>
</html>
