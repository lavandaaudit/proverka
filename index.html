<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ibonarium flow</title>

<style>

/* ========================================= */
/* RESET */
/* ========================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:auto !important;
}

html,
body{
  width:100%;
  background:#000;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial,sans-serif;
}

/* ========================================= */
/* BLOCK AUTO JUMPS */
/* ========================================= */

body{
  position:relative;
}

/* ========================================= */
/* FIRST PAGE */
/* ========================================= */

.tv-wrapper{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:#000;
}

.tv-wrapper object{
  width:100%;
  height:100%;
  border:none;
  display:block;
  pointer-events:auto;
}

/* ========================================= */
/* SECOND PAGE */
/* ========================================= */

.museum-section{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#000;
}

#museumFrame{
  width:100%;
  height:2200px;
  border:none;
  display:block;
  background:#000;
}

/* ========================================= */
/* FADE */
/* ========================================= */

.fade::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-1px;
  width:100%;
  height:120px;
  pointer-events:none;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0),
    rgba(0,0,0,0.45),
    #000
  );

  z-index:10;
}

/* ========================================= */
/* MOBILE */
/* ========================================= */

@media(max-width:900px){

  .tv-wrapper{
    height:100svh;
  }

  #museumFrame{
    height:2600px;
  }

}

</style>
</head>

<body>

<!-- ========================================= -->
<!-- FIRST PAGE -->
<!-- NO IFRAME -->
<!-- ========================================= -->

<section class="tv-wrapper fade">

  <object
    data="https://lavandaaudit.github.io/tv.2/"
    type="text/html">
  </object>

</section>

<!-- ========================================= -->
<!-- SECOND PAGE -->
<!-- ========================================= -->

<section class="museum-section">

  <iframe
    id="museumFrame"
    src="https://lavandaaudit.github.io/history.musem.ibonarium/"
    loading="lazy"
    allowfullscreen>
  </iframe>

</section>

<script>

/* =========================================
   DISABLE RESTORE
========================================= */

if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

/* =========================================
   FORCE TOP
========================================= */

function forceTop(){

  window.scrollTo({
    top:0,
    left:0,
    behavior:'auto'
  });

  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;

}

/* =========================================
   START FROM TOP
========================================= */

forceTop();

document.addEventListener('DOMContentLoaded', forceTop);

window.addEventListener('load', () => {

  forceTop();

  setTimeout(forceTop, 100);
  setTimeout(forceTop, 300);
  setTimeout(forceTop, 800);

});

window.addEventListener('pageshow', forceTop);

/* =========================================
   TEMP SCROLL LOCK
========================================= */

document.documentElement.style.overflow = 'hidden';
document.body.style.overflow = 'hidden';

setTimeout(() => {

  document.documentElement.style.overflowY = 'auto';
  document.body.style.overflowY = 'auto';

  forceTop();

}, 1800);

/* =========================================
   ADAPTIVE HEIGHT
========================================= */

const museumFrame = document.getElementById('museumFrame');

function adaptiveMuseumHeight(){

  if(window.innerWidth < 900){

    museumFrame.style.height = '2600px';

  }else{

    museumFrame.style.height = '2200px';

  }

}

adaptiveMuseumHeight();

window.addEventListener('resize', adaptiveMuseumHeight);

</script>

</body>
</html>
