<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBONARIUM · ART · SUNSET · HUB</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030305;
            --accent: #d4af37;
            --secondary: #ff007a;
            --glass: rgba(0, 10, 20, 0.7);
            --border: rgba(212, 175, 55, 0.2);

            --font-main: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        body {
            width: 100%;
            overflow-x: hidden;

            background: var(--bg);
            color: #fff;

            font-family: var(--font-main);
        }

        .hub-container {
            width: 100%;
        }

        section {
            width: 100%;
            height: 100vh;

            position: relative;

            background: #000;

            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        iframe {
            width: 100%;
            height: 100%;

            border: none;
            display: block;

            background: #000;
        }

        /* Overlay Label */
        .section-label {
            position: absolute;
            top: 20px;
            left: 20px;

            z-index: 10;

            padding: 10px 16px;

            backdrop-filter: blur(10px);
            background: rgba(0,0,0,0.45);

            border: 1px solid var(--border);
            border-radius: 14px;

            color: var(--accent);

            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;

            font-family: var(--font-mono);
        }

        /* Scrollbar */
        body::-webkit-scrollbar {
            width: 6px;
        }

        body::-webkit-scrollbar-track {
            background: #06020a;
        }

        body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .section-label {
                font-size: 11px;
                padding: 8px 12px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>

    <div class="hub-container">

        <!-- PAGE 1 -->
        <section id="sunset">

            <div class="section-label">
                PAGE 01 · SUNSET NOW
            </div>

            <iframe
                src="https://lavandaaudit.github.io/ibonarium.sanset.now/"
                title="Ibonarium Sunset Now"
                scrolling="yes">
            </iframe>

        </section>

        <!-- PAGE 2 -->
        <section id="telescope">

            <div class="section-label">
                PAGE 02 · TELE LAB TELESCOPE
            </div>

            <iframe
                src="https://lavandaaudit.github.io/tele.lab.telescope/"
                title="Tele Lab Telescope"
                scrolling="yes">
            </iframe>

        </section>

        <!-- PAGE 3 -->
        <section id="art">

            <div class="section-label">
                PAGE 03 · ART XVIII
            </div>

            <iframe
                src="https://lavandaaudit.github.io/all0505/"
                title="Art XVIII"
                scrolling="yes">
            </iframe>

        </section>

    </div>

</body>
</html>
