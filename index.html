<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ibonarium flow</title>

<style>

/* ====================================== */
/* RESET */
/* ====================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden; /* NO SCROLL */
  background:#000;
  font-family:Arial,sans-serif;
}

/* ====================================== */
/* MAIN WRAPPER */
/* ====================================== */

.wrapper{

  position:relative;

  width:100%;
  height:100vh;

  overflow:hidden;

  background:#000;

}

/* ====================================== */
/* PAGES */
/* ====================================== */

.page{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  opacity:0;

  visibility:hidden;

  transition:
    opacity 0.6s ease,
    visibility 0.6s ease;

}

/* ACTIVE PAGE */

.page.active{

  opacity:1;

  visibility:visible;

  z-index:5;

}

/* ====================================== */
/* EMBEDS */
/* ====================================== */

.page iframe{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  border:none;

  background:#000;

}

/* ====================================== */
/* SIDE PANEL */
/* ====================================== */

.side-panel{

  position:fixed;

  right:18px;
  top:50%;

  transform:translateY(-50%);

  z-index:99999;

  display:flex;
  flex-direction:column;

  gap:12px;

}

/* ====================================== */
/* BUTTONS */
/* ====================================== */

.nav-btn{

  width:42px;
  height:42px;

  border-radius:50%;

  border:1px solid rgba(0,255,255,0.35);

  background:rgba(0,0,0,0.72);

  color:#8ffcff;

  font-size:14px;
  font-weight:bold;

  cursor:pointer;

  backdrop-filter:blur(8px);

  transition:0.25s ease;

}

.nav-btn:hover{

  transform:scale(1.08);

  background:rgba(0,255,255,0.12);

  box-shadow:
    0 0 18px rgba(0,255,255,0.4);

}

/* ACTIVE BUTTON */

.nav-btn.active{

  background:rgba(0,255,255,0.18);

  box-shadow:
    0 0 20px rgba(0,255,255,0.45);

}

/* ====================================== */
/* MOBILE */
/* ====================================== */

@media(max-width:900px){

  .wrapper{
    height:100svh;
  }

  .side-panel{
    right:10px;
  }

}

</style>
</head>

<body>

<!-- ====================================== -->
<!-- SIDE NAVIGATION -->
<!-- ====================================== -->

<div class="side-panel">

  <button
    id="btn1"
    class="nav-btn active"
    onclick="showPage(1)">
    1
  </button>

  <button
    id="btn2"
    class="nav-btn"
    onclick="showPage(2)">
    2
  </button>

</div>

<!-- ====================================== -->
<!-- WRAPPER -->
<!-- ====================================== -->

<div class="wrapper">

  <!-- PAGE 1 -->

  <section
    id="page1"
    class="page active">

    <iframe
      src="https://lavandaaudit.github.io/tv.2/"
      loading="eager"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>

  </section>

  <!-- PAGE 2 -->

  <section
    id="page2"
    class="page">

    <iframe
      src="https://lavandaaudit.github.io/history.musem.ibonarium/"
      loading="lazy"
      allowfullscreen>
    </iframe>

  </section>

</div>

<script>

/* ======================================
   DISABLE SCROLL
====================================== */

document.body.style.overflow = 'hidden';

window.scrollTo(0,0);

/* ======================================
   PAGE SWITCHER
====================================== */

const page1 = document.getElementById('page1');
const page2 = document.getElementById('page2');

const btn1 = document.getElementById('btn1');
const btn2 = document.getElementById('btn2');

function showPage(page){

  /* remove active */

  page1.classList.remove('active');
  page2.classList.remove('active');

  btn1.classList.remove('active');
  btn2.classList.remove('active');

  /* activate */

  if(page === 1){

    page1.classList.add('active');
    btn1.classList.add('active');

  }

  if(page === 2){

    page2.classList.add('active');
    btn2.classList.add('active');

  }

}

/* ======================================
   FORCE START PAGE 1
====================================== */

window.addEventListener('load', () => {

  showPage(1);

});

</script>

</body>
</html>
