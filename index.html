<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ibonarium musica XIII</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #08080d; --panel: #0e0e16; --panel2: #14141e; --border: #22222e; --border-hi: #3a3a4a;
    --text: #c8c8d4; --text-dim: #555570; --accent: #00e8a2; --accent-glow: 0 0 8px rgba(0,232,162,0.4);
    --red: #ff3366; --orange: #ff8833; --blue: #3388ff; --purple: #aa44ff; --cyan: #00ccdd;
    --yellow: #ffcc00; --pink: #ff44aa;
    --font-mono: 'JetBrains Mono', monospace; --font-ui: 'Inter', sans-serif;
    --port-audio: #00e8a2; --port-cv: #ff8833; --port-gate: #ff3366; --port-note: #3388ff;
    --cable-width: 3; --cable-glow: 1;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 12px; user-select: none; }
#app { display: flex; flex-direction: column; height: 100vh; }
header { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; height: 34px; flex-shrink: 0; background: var(--panel); border-bottom: 1px solid var(--accent); box-shadow: 0 1px 10px rgba(0,232,162,0.12); }
header h1 { font-family: var(--font-mono); font-size: 13px; color: var(--accent); letter-spacing: 2.5px; font-weight: 700; text-transform: lowercase; }
header h1 .brand-xiii { color: var(--text); font-weight: 400; letter-spacing: 1.5px; margin-left: 4px; opacity: 0.7; }
header h1::before { content: '◈'; color: var(--accent); margin-right: 8px; opacity: 0.6; font-size: 11px; }
.hdr-controls { display: flex; gap: 5px; align-items: center; }
.hdr-controls button, .transport button { background: #15151f; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-mono); font-size: 9px; padding: 3px 8px; cursor: pointer; border-radius: 3px; letter-spacing: 1px; transition: all 0.2s; }
.hdr-controls button:hover, .transport button:hover { border-color: var(--accent); color: var(--accent); }
.hdr-controls button.active, .transport button.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: var(--accent-glow); }
.tempo-input { width: 44px; background: #0a0a0f; border: 1px solid var(--border); color: var(--accent); font-family: var(--font-mono); font-size: 10px; text-align: center; padding: 2px 3px; border-radius: 3px; }
.tempo-input:focus { outline: none; border-color: var(--accent); }
.master-vol { display: flex; align-items: center; gap: 4px; font-size: 9px; color: var(--text-dim); font-family: var(--font-mono); }
.master-vol input[type=range] { width: 50px; accent-color: var(--accent); height: 3px; }
.cable-style-btn { position: relative; }
.cable-style-btn .cable-style-menu { display: none; position: absolute; top: 100%; right: 0; margin-top: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 0; min-width: 120px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.cable-style-btn.open .cable-style-menu { display: block; }
.cable-style-menu div { padding: 5px 12px; cursor: pointer; font-size: 10px; font-family: var(--font-mono); display: flex; align-items: center; gap: 8px; transition: background 0.1s; }
.cable-style-menu div:hover { background: var(--panel2); }
.cable-style-menu div.active { color: var(--accent); }
.csm-dot { width: 8px; height: 8px; border-radius: 50%; }
.csm-line { width: 20px; height: 3px; border-radius: 2px; }
.main { display: flex; flex: 1; overflow: hidden; }
.palette { width: 170px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
.palette::-webkit-scrollbar { width: 4px; }
.palette::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }
.palette-title { font-family: var(--font-mono); font-size: 8px; color: var(--text-dim); padding: 8px 10px 4px; letter-spacing: 2px; text-transform: uppercase; }
.palette-cat { padding: 4px 10px 2px; font-size: 8px; color: var(--text-dim); font-family: var(--font-mono); letter-spacing: 1.5px; text-transform: uppercase; }
.palette-item { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer; transition: all 0.15s; border-left: 2px solid transparent; }
.palette-item:hover { background: var(--panel2); border-left-color: var(--accent); }
.palette-item:active { transform: scale(0.97); }
.pi-icon { width: 22px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; transition: all 0.2s; }
.palette-item:hover .pi-icon { transform: scale(1.1); }
.pi-info { display: flex; flex-direction: column; }
.pi-name { font-family: var(--font-mono); font-size: 10px; color: var(--text); font-weight: 500; }
.pi-desc { font-size: 8px; color: var(--text-dim); }
.workspace-container { flex: 1; position: relative; overflow: hidden; background: var(--bg); cursor: grab; }
.workspace-container.grabbing { cursor: grabbing; }
.workspace-bg { position: absolute; inset: -2000px; pointer-events: none; background-image: radial-gradient(circle, #1a1a28 0.8px, transparent 0.8px), linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px); background-size: 24px 24px, 120px 120px, 120px 120px; background-position: 0 0, 0 0, 0 0; }
.workspace-world { position: absolute; top: 0; left: 0; width: 0; height: 0; transform-origin: 0 0; }
#cables-svg { position: absolute; top: -5000px; left: -5000px; width: 10000px; height: 10000px; pointer-events: none; overflow: visible; z-index: 1; }
.cable-path { fill: none; stroke-linecap: round; transition: stroke-width 0.15s; pointer-events: stroke; cursor: pointer; }
.cable-path:hover { stroke-width: 5 !important; filter: brightness(1.5); cursor: pointer; }
.cable-glow { fill: none; stroke-linecap: round; pointer-events: none; opacity: var(--cable-glow); }
.cable-flow { fill: none; stroke-linecap: round; pointer-events: none; stroke-dasharray: 8 16; animation: cableFlow 1.2s linear infinite; opacity: 0.5; }
@keyframes cableFlow { to { stroke-dashoffset: -24; } }
.cable-temp-path { fill: none; stroke-width: 2; stroke-dasharray: 6 6; opacity: 0.6; pointer-events: none; }
.node { position: absolute; min-width: 155px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 2; animation: nodeAppear 0.25s cubic-bezier(0.34,1.56,0.64,1); transition: box-shadow 0.2s, border-color 0.2s; }
@keyframes nodeAppear { 0% { opacity: 0; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1); } }
.node:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.6); }
.node.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 20px rgba(0,232,162,0.12), 0 6px 24px rgba(0,0,0,0.5); }
.node-header { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; cursor: grab; background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%); }
.node-header:active { cursor: grabbing; }
.node-color { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; transition: box-shadow 0.2s; }
.node:hover .node-color { box-shadow: 0 0 8px currentColor; }
.node-title { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--text); flex: 1; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node-title-input { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--text); flex: 1; background: #0a0a0f; border: 1px solid var(--accent); border-radius: 3px; padding: 1px 4px; outline: none; min-width: 0; }
.node-delete { width: 16px; height: 16px; border: none; background: transparent; color: var(--text-dim); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; border-radius: 3px; opacity: 0; transition: all 0.15s; }
.node:hover .node-delete { opacity: 1; }
.node-delete:hover { background: var(--red); color: #fff; }
/* Multi-select visual */
.node.multi-selected { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 12px rgba(0,204,221,0.15), 0 4px 20px rgba(0,0,0,0.5); }
/* Frozen module */
.node.frozen-mod { pointer-events: auto; }
.freeze-badge { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; background: rgba(0,180,255,0.25); border: 1px solid rgba(0,204,255,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; z-index: 20; transition: all 0.2s; opacity: 1; pointer-events: auto; }
.freeze-badge:hover { background: rgba(0,204,255,0.5); border-color: var(--cyan); transform: scale(1.25); }
/* Rubber-band selection */
.rubber-band { position: absolute; border: 1px dashed var(--accent); background: rgba(0,232,162,0.06); pointer-events: none; z-index: 100; }
/* Send-to-channel floating toolbar */
.snap-toolbar { position: fixed; z-index: 500; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); animation: tbSlide 0.2s ease-out; }
@keyframes tbSlide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.snap-toolbar .tb-label { font-family: var(--font-mono); font-size: 9px; color: var(--accent); letter-spacing: 1px; white-space: nowrap; }
.snap-toolbar select.tb-ch-sel { background: #0a0a0f; border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 9px; padding: 2px 4px; border-radius: 3px; min-width: 50px; }
.snap-toolbar select.tb-ch-sel:focus { outline: none; border-color: var(--accent); }
.snap-toolbar button.tb-send { background: var(--accent); border: none; color: #000; font-family: var(--font-mono); font-size: 9px; font-weight: 700; padding: 3px 10px; border-radius: 3px; cursor: pointer; letter-spacing: 0.5px; transition: all 0.15s; }
.snap-toolbar button.tb-send:hover { background: #33ffbb; box-shadow: 0 0 10px rgba(0,232,162,0.4); }
.snap-toolbar button.tb-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-mono); font-size: 9px; padding: 3px 6px; border-radius: 3px; cursor: pointer; }
.snap-toolbar button.tb-cancel:hover { border-color: var(--red); color: var(--red); }
.node-body { padding: 5px 0 6px; }
.port-row { display: flex; align-items: center; padding: 2px 0; min-height: 20px; }
.port-row.input { justify-content: flex-start; }
.port-row.output { justify-content: flex-end; }
.port { width: 12px; height: 12px; border-radius: 50%; border: 2px solid; cursor: crosshair; flex-shrink: 0; transition: all 0.15s; position: relative; z-index: 5; }
.port::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; }
.port:hover { transform: scale(1.4); filter: brightness(1.3); }
.port.connected { background: currentColor; box-shadow: 0 0 6px currentColor; }
.port.pulse { animation: portPulse 0.4s ease-out; }
@keyframes portPulse { 0% { box-shadow: 0 0 0 0 currentColor; transform: scale(1); } 50% { box-shadow: 0 0 12px 4px currentColor; transform: scale(1.5); } 100% { box-shadow: 0 0 6px currentColor; transform: scale(1); } }
.port-row.input .port { margin-left: -6px; margin-right: 6px; }
.port-row.output .port { margin-right: -6px; margin-left: 6px; }
.port[data-type="audio"] { border-color: var(--port-audio); color: var(--port-audio); }
.port[data-type="cv"] { border-color: var(--port-cv); color: var(--port-cv); }
.port[data-type="gate"] { border-color: var(--port-gate); color: var(--port-gate); }
.port[data-type="note"] { border-color: var(--port-note); color: var(--port-note); }
.port-label { font-size: 9px; color: var(--text-dim); font-family: var(--font-mono); white-space: nowrap; transition: color 0.15s; }
.port-row:hover .port-label { color: var(--text); }
.node-ctrls { padding: 3px 10px 5px; display: flex; flex-direction: column; gap: 3px; }
.ctrl-row { display: flex; align-items: center; gap: 5px; }
.ctrl-label { font-size: 8px; color: var(--text-dim); font-family: var(--font-mono); min-width: 30px; letter-spacing: 0.5px; }
.ctrl-row input[type=range] { flex: 1; height: 3px; accent-color: var(--accent); cursor: pointer; }
.ctrl-row select { flex: 1; background: #0a0a0f; border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 8px; padding: 2px 3px; border-radius: 3px; cursor: pointer; }
.ctrl-val { font-size: 8px; color: var(--accent); font-family: var(--font-mono); min-width: 28px; text-align: right; }

/* Sequencer grid - 2 rows of 12 = 24 steps */
.seq-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1px; padding: 0 10px; margin-top: 3px; }
.seq-step { height: 22px; background: #0a0a12; border: 1px solid #1a1a28; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 7px; font-family: var(--font-mono); color: var(--text-dim); cursor: pointer; transition: all 0.1s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 1px; }
.seq-step:hover { border-color: var(--accent); color: var(--text); }
.seq-step.active { background: rgba(0,232,162,0.15); border-color: var(--accent); color: var(--accent); }
.seq-step.current { background: rgba(0,232,162,0.35); box-shadow: 0 0 6px rgba(0,232,162,0.4); }
.seq-step.beat-marker { border-bottom: 2px solid var(--accent); }

/* Drum machine grid */
.drum-grid { display: grid; grid-template-columns: 24px repeat(16, 1fr); gap: 1px; padding: 0 10px; margin-top: 3px; }
.drum-label { font-size: 7px; font-family: var(--font-mono); display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
.drum-cell { height: 14px; background: #0a0a12; border: 1px solid #1a1a28; border-radius: 2px; cursor: pointer; transition: all 0.1s; }
.drum-cell:hover { border-color: #555; }
.drum-cell.active { border-color: var(--accent); }
.drum-cell.kick.active { background: rgba(255,51,102,0.3); border-color: var(--red); }
.drum-cell.snare.active { background: rgba(0,232,162,0.3); border-color: var(--accent); }
.drum-cell.hihat.active { background: rgba(255,136,51,0.3); border-color: var(--orange); }
.drum-cell.current { box-shadow: inset 0 0 4px rgba(255,255,255,0.3); }

/* Gross beat grid */
.gb-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; padding: 0 10px; margin-top: 3px; }
.gb-cell { height: 16px; background: #0a0a12; border: 1px solid #1a1a28; border-radius: 2px; cursor: pointer; transition: all 0.1s; }
.gb-cell:hover { border-color: #555; }
.gb-cell.active { background: rgba(170,68,255,0.3); border-color: var(--purple); }
.gb-cell.current { box-shadow: inset 0 0 4px rgba(255,255,255,0.3); }

/* Percussion colors */
.drum-cell.clap.active { background: rgba(255,170,136,0.3); border-color: #ffaa88; }
.drum-cell.shaker.active { background: rgba(255,204,0,0.3); border-color: var(--yellow); }
.drum-cell.cowbell.active { background: rgba(0,204,221,0.3); border-color: var(--cyan); }
.drum-cell.conga.active { background: rgba(204,136,68,0.3); border-color: #cc8844; }
.drum-cell.rim.active { background: rgba(255,68,170,0.3); border-color: var(--pink); }

/* Automation grid */
.auto-grid { display: grid; grid-template-columns: repeat(32, 1fr); gap: 1px; padding: 0 10px; margin-top: 4px; height: 60px; background: #0a0a12; border-radius: 3px; }
.auto-step { background: #0a0a12; border: 1px solid #1a1a28; border-radius: 2px; cursor: pointer; transition: border-color 0.1s; position: relative; display: flex; align-items: flex-end; overflow: hidden; }
.auto-step:hover { border-color: #555; }
.auto-step.current { border-color: var(--accent); box-shadow: 0 0 6px rgba(0,232,162,0.4); }
.auto-fill { width: 100%; background: linear-gradient(180deg, var(--accent), rgba(0,232,162,0.25)); transition: height 0.05s; }
.auto-target-row { display: flex; align-items: center; gap: 5px; padding: 4px 10px 2px; }
.auto-target-row select { flex: 1; background: #0a0a0f; border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 8px; padding: 2px 3px; border-radius: 3px; cursor: pointer; }
.auto-target-row select:focus { outline: none; border-color: var(--accent); }
.auto-target-row button { background: #15151f; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-mono); font-size: 8px; padding: 2px 6px; cursor: pointer; border-radius: 3px; }
.auto-target-row button:hover { border-color: var(--accent); color: var(--accent); }

/* Shimmer indicator (no special CSS needed, but reserve) */

/* Automation LEARN button + bound knob indicator */
.auto-learn-row { display: flex; align-items: center; gap: 6px; padding: 4px 10px 2px; }
.auto-learn-btn { background: #15151f; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-mono); font-size: 9px; font-weight: 700; padding: 4px 12px; cursor: pointer; border-radius: 3px; letter-spacing: 1.5px; transition: all 0.15s; }
.auto-learn-btn:hover { border-color: var(--red); color: var(--red); }
.auto-learn-btn.armed { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 0 12px rgba(255,51,102,0.6); animation: learnPulse 1s ease-in-out infinite; }
@keyframes learnPulse { 0%,100%{box-shadow:0 0 8px rgba(255,51,102,0.5);} 50%{box-shadow:0 0 20px rgba(255,51,102,0.95);} }
.auto-learn-hint { font-family: var(--font-mono); font-size: 8px; color: var(--text-dim); letter-spacing: 0.5px; }
.node.learn-armed { border-color: var(--red) !important; box-shadow: 0 0 0 1px var(--red), 0 0 16px rgba(255,51,102,0.25), 0 6px 24px rgba(0,0,0,0.5) !important; }
/* Knob automation indicator dot */
.auto-bind-dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; flex-shrink: 0; margin-left: auto; transition: background 0.2s, box-shadow 0.2s; }
.ctrl-row.automated { background: rgba(0,232,162,0.05); border-radius: 3px; }
.ctrl-row.automated .ctrl-label { color: var(--accent); }
.ctrl-row.auto-pulse .auto-bind-dot { transform: scale(2); }
.ctrl-row.auto-pulse { background: rgba(0,232,162,0.15); }
/* Target list */
.auto-target-list-wrap { padding: 4px 10px 6px; border-top: 1px solid var(--border); margin-top: 4px; }
.auto-target-list-title { font-family: var(--font-mono); font-size: 8px; color: var(--text-dim); letter-spacing: 1.5px; margin-bottom: 4px; }
.auto-target-list { display: flex; flex-direction: column; gap: 2px; max-height: 90px; overflow-y: auto; }
.auto-target-list::-webkit-scrollbar { width: 3px; }
.auto-target-list::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }
.auto-target-item { display: flex; align-items: center; gap: 5px; padding: 3px 5px; background: var(--panel2); border-radius: 3px; font-family: var(--font-mono); font-size: 8px; }
.at-color { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.at-name { flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.at-rm { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px; padding: 0 4px; border-radius: 3px; line-height: 1; }
.at-rm:hover { background: var(--red); color: #fff; }
.auto-empty { font-family: var(--font-mono); font-size: 8px; color: var(--text-dim); padding: 6px 4px; text-align: center; font-style: italic; }
/* Cursor in learn mode */
body.learn-active .workspace-world,
body.learn-active .workspace-world * { cursor: crosshair !important; }
body.learn-active .palette,
body.learn-active .palette * { cursor: crosshair !important; }

/* REC button + recording state */
.auto-rec-btn { background: #15151f; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-mono); font-size: 9px; font-weight: 700; padding: 4px 10px; cursor: pointer; border-radius: 3px; letter-spacing: 1.5px; transition: all 0.15s; }
.auto-rec-btn:hover { border-color: var(--red); color: var(--red); }
.auto-rec-btn.armed { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 0 12px rgba(255,51,102,0.6); animation: recPulse 0.7s ease-in-out infinite; }
@keyframes recPulse { 0%,100%{box-shadow:0 0 8px rgba(255,51,102,0.6);} 50%{box-shadow:0 0 22px rgba(255,51,102,1);} }
.node.rec-armed { border-color: var(--red) !important; box-shadow: 0 0 0 1px var(--red), 0 0 20px rgba(255,51,102,0.3), 0 6px 24px rgba(0,0,0,0.5) !important; }
.node.rec-pulse { box-shadow: 0 0 0 2px var(--red), 0 0 30px rgba(255,51,102,0.5), 0 6px 24px rgba(0,0,0,0.5) !important; }
/* Auto-fill recorded cell gets red tint */

.auto-step.recorded .auto-fill { background: linear-gradient(180deg, var(--red), rgba(255,51,102,0.25)); }
/* Per-step probability dot */
.auto-step .auto-prob { position: absolute; top: 1px; right: 1px; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.15); pointer-events: none; }
.auto-step[data-prob="0.75"] .auto-prob { background: rgba(255,200,80,0.85); }
.auto-step[data-prob="0.5"]  .auto-prob { background: rgba(255,140,80,0.85); }
.auto-step[data-prob="0.25"] .auto-prob { background: rgba(255,80,80,0.85); }
.auto-step[data-prob="0"]    .auto-prob { background: rgba(80,80,80,0.95); }
.auto-step.disabled-step { opacity: 0.25; filter: grayscale(1); }
.auto-step.disabled-step .auto-fill { background: #2a1a1a !important; }
.auto-step.disabled-step::after { content: '×'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #f44; font-size: 14px; font-weight: 700; pointer-events: none; }
/* MIDI status indicator */
.midi-status { font-family: var(--font-mono); font-size: 9px; padding: 3px 8px; border-radius: 3px; background: #15151f; border: 1px solid var(--border); color: var(--text-dim); letter-spacing: 1px; transition: all 0.2s; }
.midi-status.active { background: rgba(0,232,162,0.15); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 8px rgba(0,232,162,0.3); }
.midi-status.error { background: rgba(255,51,102,0.15); border-color: var(--red); color: var(--red); }
/* Polyphonic indicator dot on module header */
.node-poly-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #00e8a2; margin-left: 5px; box-shadow: 0 0 4px #00e8a2; vertical-align: middle; }
/* Active voice counter */
.node-voice-count { font-family: var(--font-mono); font-size: 8px; color: var(--accent); padding: 1px 4px; background: rgba(0,232,162,0.1); border-radius: 2px; margin-left: 6px; }

/* MIDI REC button */
.midi-rec-btn { background: #15151f; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-mono); font-size: 9px; font-weight: 700; padding: 3px 10px; cursor: pointer; border-radius: 3px; letter-spacing: 1.5px; transition: all 0.15s; }
.midi-rec-btn:hover { border-color: var(--red); color: var(--red); }
.midi-rec-btn.armed { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 0 12px rgba(255,51,102,0.6); animation: midiRecPulse 0.7s ease-in-out infinite; }
@keyframes midiRecPulse { 0%,100%{box-shadow:0 0 8px rgba(255,51,102,0.6);} 50%{box-shadow:0 0 22px rgba(255,51,102,1);} }
.midi-clr-btn { background: #15151f; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-mono); font-size: 12px; font-weight: 700; padding: 3px 8px; cursor: pointer; border-radius: 3px; line-height: 1; }
.midi-clr-btn:hover { background: var(--red); color: #fff; border-color: var(--red); }
.midi-rec-count { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.5px; min-width: 90px; }
.midi-rec-count.recording { color: var(--red); animation: midiRecPulse 0.7s ease-in-out infinite; }
/* Piano key replay indicator (cyan) */
.pkey.replay-active { background: linear-gradient(180deg, #00ccdd, #00e8a2) !important; box-shadow: 0 0 12px rgba(0,204,221,0.7); border-color: #00ccdd !important; }
.pkey.black.replay-active { background: linear-gradient(180deg, #005566, #00ccdd) !important; box-shadow: 0 0 12px rgba(0,204,221,0.7); }
.pkey.rec-flash { box-shadow: 0 0 16px rgba(255,51,102,0.9) !important; filter: brightness(1.3); }

/* Bottom bar */
.bottom-bar { display: flex; flex-direction: column; height: 190px; flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--border); }
.bottom-main-row { display: flex; flex: 1; min-height: 0; overflow: hidden; }
/* Brand strip — logo + name, far-left of bottom bar */
.brand-strip { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 10px 5px; border-right: 1px solid var(--border); background: linear-gradient(180deg, #0c0c14 0%, #06060a 100%); flex-shrink: 0; width: 92px; }
.brand-logo { width: 52px; height: 52px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(0,232,162,0.25)) brightness(0.95); transition: filter 0.3s; }
.brand-logo:hover { filter: drop-shadow(0 0 10px rgba(0,232,162,0.55)) brightness(1.1); }
.brand-name { font-family: var(--font-mono); font-size: 7px; color: var(--text-dim); letter-spacing: 1.3px; margin-top: 3px; text-align: center; line-height: 1.1; text-transform: lowercase; }
.brand-name .brand-xiii-foot { color: var(--accent); font-weight: 700; margin-left: 2px; }
.transport { display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 5px; padding: 6px 12px; border-right: 1px solid var(--border); min-width: 200px; flex-shrink: 0; }
/* Full-width step grid bar — bottom row */
.step-grid-bar { display: flex; align-items: stretch; gap: 2px; padding: 5px 10px; height: 30px; flex-shrink: 0; background: linear-gradient(180deg, #06060a 0%, #0a0a12 100%); border-top: 1px solid var(--border); }
.step-grid-bar .step-led { flex: 1; min-width: 0; height: 100%; border-radius: 3px; background: #14141e; border: 1px solid #1f1f2c; transition: all 0.08s; position: relative; }
.step-grid-bar .step-led.beat-marker { border-color: #2a2a3c; }
.step-grid-bar .step-led.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(0,232,162,0.6); }
.step-grid-bar .step-led.current { background: rgba(0,232,162,0.4); border-color: var(--accent); box-shadow: 0 0 12px rgba(0,232,162,0.8); }
.step-leds { display: flex; gap: 1px; flex: 1; }
.step-led { width: 8px; height: 8px; border-radius: 2px; background: #1a1a28; transition: all 0.08s; }
.step-led.on { background: var(--accent); box-shadow: 0 0 6px rgba(0,232,162,0.5); }
/* ===== MIXER CONSOLE (5-channel looper) ===== */
.ch-strip { width: 78px !important; }
/* SOLO button — blue */
.ch-btn.solo { color: #66aaff; }
.ch-btn.solo:hover { border-color: #66aaff; color: #66aaff; }
.ch-btn.solo.active { background: #4488ff; color: #fff; border-color: #4488ff; box-shadow: 0 0 6px rgba(68,136,255,0.5); }
/* OD (overdub) button — purple */
.ch-btn.od { color: #bb88ff; font-size: 7px; }
.ch-btn.od:hover { border-color: #bb88ff; color: #bb88ff; }
.ch-btn.od.active { background: #9944ff; color: #fff; border-color: #9944ff; box-shadow: 0 0 6px rgba(153,68,255,0.5); }

.ch-btn.q { color: #44ddcc; font-size: 7px; }
.ch-btn.q:hover { border-color: #44ddcc; color: #44ddcc; }
.ch-btn.q.active { background: #00ccbb; color: #000; border-color: #00ccbb; box-shadow: 0 0 6px rgba(0,204,187,0.5); }
/* Button row (2 buttons side by side) */

/* LEN select dropdown */
.ch-len { background: #0a0a12; border: 1px solid #2a2a3c; color: var(--text-dim); font-family: var(--font-mono); font-size: 8px; font-weight: 700; padding: 2px 3px; border-radius: 2px; cursor: pointer; width: calc(100% - 10px); margin: 0 5px; text-align: center; }

.transport-row { display: flex; align-items: center; gap: 5px; }
.transport-row .sep { width: 1px; height: 16px; background: var(--border); margin: 0 3px; }
/* Compact buttons */
.transport .tp-btn { background: #15151f; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-mono); font-size: 9px; font-weight: 700; padding: 4px 8px; cursor: pointer; border-radius: 3px; letter-spacing: 1px; transition: all 0.15s; min-width: 36px; }
.transport .tp-btn:hover { border-color: var(--accent); color: var(--accent); }
.transport .tp-btn.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 8px rgba(0,232,162,0.4); }
.transport .tp-btn.tp-stop:hover { border-color: var(--red); color: var(--red); }
.tempo-mini { background: #0a0a0f; border: 1px solid var(--border); color: var(--accent); font-family: var(--font-mono); font-size: 10px; font-weight: 700; padding: 3px 5px; width: 38px; text-align: center; border-radius: 3px; }
.master-mini { display: flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 8px; color: var(--text-dim); }
.master-mini input[type=range] { width: 60px; height: 4px; -webkit-appearance: none; background: #1a1a28; border-radius: 2px; outline: none; }
.master-mini input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 12px; background: var(--accent); border-radius: 2px; cursor: pointer; }
.step-leds-mini { display: flex; gap: 1px; }

/* Looper console — expandable channel strips */
.looper-console { display: flex; gap: 2px; padding: 6px 8px; background: linear-gradient(180deg, #0e0e16 0%, #06060a 100%); border-left: 1px solid var(--border); border-right: 1px solid var(--border); overflow-x: auto; align-items: stretch; flex-shrink: 0; }
.looper-console::-webkit-scrollbar { height: 3px; }
.looper-console::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }
.ch-add-btn { width: 36px; min-width: 36px; background: #0a0a12; border: 1px dashed #2a2a3c; border-radius: 4px; color: var(--text-dim); font-family: var(--font-mono); font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
.ch-add-btn:hover { border-color: var(--accent); color: var(--accent); background: #0e0e16; box-shadow: 0 0 8px rgba(0,232,162,0.2); }
/* Unfreeze button on channel strip */
.ch-unfreeze-btn { font-size: 12px; background: rgba(0,180,255,0.12); border: 1px solid rgba(0,204,255,0.35); border-radius: 3px; color: rgba(0,204,255,0.8); cursor: pointer; width: 100%; text-align: center; padding: 1px 0; transition: all 0.2s; letter-spacing: 0; }
.ch-unfreeze-btn:hover { background: rgba(0,204,255,0.3); color: #fff; border-color: var(--cyan); }
.ch-strip { width: 62px; background: linear-gradient(180deg, #14141e 0%, #0a0a12 100%); border: 1px solid #1f1f2c; border-radius: 4px; display: flex; flex-direction: column; align-items: center; padding: 4px 0 3px; gap: 3px; position: relative; transition: all 0.15s; box-shadow: inset 0 1px 0 rgba(255,255,255,0.03); }
.ch-strip:hover { border-color: #2a2a3c; }
.ch-strip.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 12px rgba(0,232,162,0.3), inset 0 1px 0 rgba(255,255,255,0.05); }
.ch-strip.recording { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 0 14px rgba(255,51,102,0.4); animation: chRecPulse 0.7s ease-in-out infinite; }
@keyframes chRecPulse { 0%,100%{box-shadow:0 0 0 1px var(--red),0 0 8px rgba(255,51,102,0.4);} 50%{box-shadow:0 0 0 1px var(--red),0 0 18px rgba(255,51,102,0.7);} }
.ch-strip.muted { opacity: 0.5; }
.ch-num { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--text-dim); background: #0a0a12; border: 1px solid #1f1f2c; border-radius: 2px; width: 22px; height: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s; }
.ch-num:hover { color: var(--accent); border-color: var(--accent); }
.ch-strip.selected .ch-num { background: var(--accent); color: #000; border-color: var(--accent); }
/* LED */
.ch-led { width: 8px; height: 8px; border-radius: 50%; background: #1a1a28; border: 1px solid #0a0a12; box-shadow: inset 0 1px 1px rgba(0,0,0,0.5); transition: all 0.1s; }
.ch-led.armed { background: #ffaa33; box-shadow: 0 0 6px rgba(255,170,51,0.7), inset 0 1px 1px rgba(0,0,0,0.3); animation: ledBlink 0.5s ease-in-out infinite; }
.ch-led.recording { background: var(--red); box-shadow: 0 0 8px rgba(255,51,102,0.9), inset 0 1px 1px rgba(0,0,0,0.3); }
.ch-led.playing { background: var(--accent); box-shadow: 0 0 6px rgba(0,232,162,0.7), inset 0 1px 1px rgba(0,0,0,0.3); }
@keyframes ledBlink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
/* Buttons */
.ch-btns { display: flex; flex-direction: column; gap: 2px; width: 100%; align-items: center; }
.ch-btn { background: #15151f; border: 1px solid #2a2a3c; color: var(--text-dim); font-family: var(--font-mono); font-size: 8px; font-weight: 700; padding: 3px 0; cursor: pointer; border-radius: 2px; letter-spacing: 0.5px; transition: all 0.12s; width: 44px; }
.ch-btn:hover { border-color: var(--accent); color: var(--accent); }
.ch-btn.rec { color: #ff6688; }
.ch-btn.rec:hover { border-color: var(--red); color: var(--red); background: rgba(255,51,102,0.1); }
.ch-btn.rec.armed { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 0 8px rgba(255,51,102,0.5); animation: chRecPulse 0.7s ease-in-out infinite; }
.ch-btn.mute:hover { border-color: #ffaa33; color: #ffaa33; }
.ch-btn.mute.active { background: #ffaa33; color: #000; border-color: #ffaa33; }
.ch-btn.clr:hover { border-color: var(--text); color: var(--text); }
/* Vertical fader */
.ch-fader-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; min-height: 28px; }
.ch-fader-track { position: relative; width: 8px; flex: 1; background: linear-gradient(180deg, #050508, #1a1a28 50%, #050508); border: 1px solid #2a2a3c; border-radius: 2px; cursor: pointer; }
.ch-fader-fill { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(180deg, var(--accent) 0%, rgba(0,232,162,0.4) 100%); border-radius: 0 0 1px 1px; transition: height 0.05s; }
.ch-fader-thumb { position: absolute; left: -4px; right: -4px; height: 4px; background: #c8c8d4; border: 1px solid #2a2a3c; border-radius: 1px; cursor: grab; transform: translateY(50%); box-shadow: 0 1px 2px rgba(0,0,0,0.5); }
.ch-fader-thumb:active { cursor: grabbing; }
.ch-fader-track.dragging .ch-fader-thumb { background: var(--accent); }
/* Status + count */
.ch-status { font-family: var(--font-mono); font-size: 7px; color: var(--text-dim); letter-spacing: 0.5px; text-align: center; min-height: 9px; line-height: 1; }
.ch-status.rec { color: var(--red); }
.ch-status.loop { color: var(--accent); }
.ch-count { font-family: var(--font-mono); font-size: 8px; color: var(--text-dim); text-align: center; line-height: 1; }

.keyboard-bar { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 4px 0; }
.keys-wrap { position: relative; height: 100%; }
.pkey { position: absolute; border-radius: 0 0 3px 3px; cursor: pointer; transition: background 0.05s; }
.pkey.white { background: linear-gradient(180deg, #d0d0d0, #fff); border: 1px solid #999; z-index: 1; }
.pkey.white.active { background: linear-gradient(180deg, var(--accent), #80ffd0); }
.pkey.black { background: linear-gradient(180deg, #222, #444); border: 1px solid #111; z-index: 2; }
.pkey.black.active { background: linear-gradient(180deg, #005533, var(--accent)); }
.scope-bar { width: 220px; flex-shrink: 0; border-left: 1px solid var(--border); }
.scope-bar canvas { width: 100%; height: 100%; display: block; }
.legend { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 10px; opacity: 0.5; pointer-events: none; z-index: 10; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 8px; font-family: var(--font-mono); color: var(--text-dim); }

</style>

<body>
<div id="app">
    <header>
        <h1>ibonarium musica<span class="brand-xiii">XIII</span></h1>

                    <div data-style="smooth" class="active"><div class="csm-line" style="background:var(--accent)"></div>Smooth</div>
                    <div data-style="angular"><div class="csm-line" style="background:var(--orange)"></div>Angular</div>

<script>
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function freqToName(f){if(!f||f<=0)return'—';const n=12*Math.log2(f/440)+69;const note=Math.round(n);const oct=Math.floor(note/12)-1;const idx=((note%12)+12)%12;return NOTE_NAMES[idx]+oct;}
function nameToFreq(name){if(!name||name==='—')return 440;const m=name.match(/^([A-G]#?)(\d)$/);if(!m)return 440;const ni=NOTE_NAMES.indexOf(m[1]);const oct=parseInt(m[2]);return 440*Math.pow(2,((oct+1)*12+ni-69)/12);}
function makeDistCurve(amount){const n=44100;const c=new Float32Array(n);for(let i=0;i<n;i++){const x=(i*2)/n-1;c[i]=((3+amount)*x*20*(Math.PI/180))/(Math.PI+amount*Math.abs(x));}return c;}

function makeWavetable(type,size){size=size||256;const buf=new Float32Array(size);for(let i=0;i<size;i++){const t=i/size;if(type==='sine')buf[i]=Math.sin(2*Math.PI*t);else if(type==='triangle')buf[i]=4*Math.abs(2*(t-0.5))-1;else if(type==='sawtooth')buf[i]=2*t-1;else if(type==='square')buf[i]=t<0.5?1:-1;else if(type==='organ'){buf[i]=0.6*Math.sin(2*Math.PI*t)+0.8*Math.sin(4*Math.PI*t)+0.5*Math.sin(6*Math.PI*t)+0.3*Math.sin(8*Math.PI*t);buf[i]/=2.2;}else if(type==='pad'){buf[i]=Math.sin(2*Math.PI*t)+0.5*Math.sin(4*Math.PI*t)+0.3*Math.sin(6*Math.PI*t)+0.7*Math.sin(2*Math.PI*t*1.002);buf[i]/=2.5;}else buf[i]=Math.sin(2*Math.PI*t);}return buf;}
function makePeriodicWaveFromTable(ctx,table){
const N=table.length;const real=new Float32Array(N);const imag=new Float32Array(N);
for(let k=0;k<N;k++){let re=0,im=0;for(let n=0;n<N;n++){const ang=2*Math.PI*k*n/N;re+=table[n]*Math.cos(ang);im-=table[n]*Math.sin(ang);}real[k]=re/N;imag[k]=im/N;}

  if(m.type==='drums')m.onClock(step,time);
  if(m.type==='gross-beat')m.onClock(step,time);
  if(m.type==='chords')m.onClock(step,time);
  if(m.type==='percussion')m.onClock(step,time);

// ===== WEB MIDI API (for hardware MIDI keyboards like Arturia) =====
initMidi(){
if(this._midiInited)return;
this._midiInited=true;
this._midiBoundInputs=new Set();
if(!navigator.requestMIDIAccess){
console.log('[MIDI] Web MIDI API not supported in this browser');
this._updateMidiStatus('unsupported');
return;
}
navigator.requestMIDIAccess({sysex:false}).then(access=>{
this._midiAccess=access;
this._refreshMidiInputs();
access.onstatechange=()=>{this._refreshMidiInputs();};
}).catch(err=>{
console.log('[MIDI] Access denied:',err.message);
this._updateMidiStatus('denied');
});
}
_refreshMidiInputs(){
if(!this._midiAccess)return;
let count=0;
this._midiAccess.inputs.forEach(input=>{
count++;
if(this._midiBoundInputs.has(input.id))return;
this._midiBoundInputs.add(input.id);
input.onmidimessage=(msg)=>this._onMidiMessage(msg);
console.log('[MIDI] Bound input:',input.name,input.manufacturer);
});
this._updateMidiStatus(count>0?'connected:'+count:'none');
}
_updateMidiStatus(state){
const el=document.getElementById('midi-status');
if(!el)return;
if(state&&state.startsWith('connected:')){
const n=state.split(':')[1];
el.textContent='MIDI: '+n+' device'+(n==='1'?'':'s');
el.className='midi-status active';
}else if(state==='denied'){
el.textContent='MIDI: denied';
el.className='midi-status error';
}else if(state==='unsupported'){
el.textContent='MIDI: unsupported';
el.className='midi-status error';
}else{
el.textContent='MIDI: none';
el.className='midi-status';
}
}
_onMidiMessage(msg){
const data=msg.data;
const status=data[0];
const cmd=status&0xF0;
const data1=data.length>1?data[1]:0;
const data2=data.length>2?data[2]:0;
if(cmd===0x90&&data2>0){
// Note On
const freq=440*Math.pow(2,(data1-69)/12);
this.noteOn(freq);
this._highlightPianoKey(freq,true);
}else if(cmd===0x80||(cmd===0x90&&data2===0)){
// Note Off
const freq=440*Math.pow(2,(data1-69)/12);
this.noteOff(freq);
this._highlightPianoKey(freq,false);
}else if(cmd===0xB0){
// CC — future expansion (could route to a CC->CV module)
// console.log('[MIDI] CC',data1,data2);
}else if(cmd===0xE0){
// Pitch bend — future expansion
}else if(cmd===0xFA){
// MIDI Start — start transport
if(!this.isPlaying)this.startTransport();
}else if(cmd===0xFB){
// MIDI Continue
if(!this.isPlaying)this.startTransport();
}else if(cmd===0xFC){
// MIDI Stop
if(this.isPlaying)this.stopTransport();
}
}
_highlightPianoKey(freq,on){
try{
const k=document.querySelector('.pkey[data-freq="'+freq+'"]');
if(k){
if(on)k.classList.add('active');
else k.classList.remove('active');
}
}catch(e){}
}
_notifyNoteSubs(type,freq,isReplay){this.noteCallbacks.forEach(cb=>{try{cb(type,freq,isReplay);}catch(e){}});}

// ===== AUTOMATION: clock tick =====
_autoTick(step,time){
const len=Math.max(2,Math.min(32,this._length||this.params.length||16));
const s=step%len;this._currentStep=s;
const ctx=this.engine.ctx;const t=time||ctx.currentTime;

// ===== REC mode: read bound knob values and store into _steps[s] =====
if(this._recording&&this._targets&&this._targets.length>0){
let sum=0,cnt=0;
this._targets.forEach(tg=>{
const targetMod=this.engine.modules.get(tg.modId);
if(!targetMod)return;
const ctrl=targetMod.def.controls.find(c=>c.id===tg.paramId);
if(!ctrl)return;
let cur;
if(ctrl.type==='range'){
cur=targetMod.params[tg.paramId]!==undefined?targetMod.params[tg.paramId]:ctrl.default;
}else if(ctrl.type==='select'){
const oi=ctrl.options.indexOf(targetMod.params[tg.paramId]||ctrl.default);
cur=oi<0?0:oi/Math.max(1,ctrl.options.length-1);
}else return;
// Normalize to 0..1
let norm=(cur-ctrl.min)/(ctrl.max-ctrl.min);
norm=Math.max(0,Math.min(1,norm));
sum+=norm;cnt++;
});
if(cnt>0){
const avg=sum/cnt;
this._steps[s]=avg;
// Update grid visual immediately + mark as recorded
if(this.el){
const stepEl=this.el.querySelectorAll('.auto-step')[s];
if(stepEl){
const fill=stepEl.querySelector('.auto-fill');
if(fill)fill.style.height=(avg*100)+'%';
stepEl.classList.add('recorded');
}
// Visual feedback — pulse the automation module border
this.el.classList.add('rec-pulse');
setTimeout(()=>this.el.classList.remove('rec-pulse'),100);
}
}
// REC mode does NOT write back to knobs (avoids feedback loop)
if(this.el){this.el.querySelectorAll('.auto-step').forEach((el,i)=>el.classList.toggle('current',i===s));}
return;
}

// ===== Normal playback mode: write _steps[s] to bound knobs =====
// Per-step probability + enable/disable (Elektron-style)
const stepEnabled=this._stepEnabled?this._stepEnabled[s]!==false:true;
const stepProb=this._stepProb?(this._stepProb[s]!==undefined?this._stepProb[s]:1):1;
const shouldPlay=stepEnabled&&Math.random()<=stepProb;
let val;
if(shouldPlay){
val=this._steps[s]||0;
this._lastPlayedVal=val; // remember for hold-on-skip
}else{
// Hold previous value (don't update)
val=this._lastPlayedVal!==undefined?this._lastPlayedVal:(this._steps[s]||0);
}
const depth=this.params.depth!==undefined?this.params.depth:1;
val=val*depth;
const slew=this.params.slew||0.03;
const shape=this.params.shape||'smooth';
if(this.audioNodes.src){
if(!shouldPlay){
// hold — no change
}else if(shape==='step'){this.audioNodes.src.offset.setValueAtTime(val,t);}
else if(shape==='linear'){const nextVal=(this._steps[(s+1)%len]||0)*depth;this.audioNodes.src.offset.linearRampToValueAtTime(nextVal,t+0.25*(60/this.engine.tempo));}
else{this.audioNodes.src.offset.setTargetAtTime(val,t,Math.max(0.001,slew/3));}
}
// Direct target write — iterate over ALL bound targets (Bitwig-style multi-target)
// Only write when shouldPlay (respect prob+enabled) — Elektron-style per-step lock
if(shouldPlay&&this._targets&&this._targets.length>0){
this._targets.forEach(t=>{
const targetMod=this.engine.modules.get(t.modId);
if(!targetMod)return;
const ctrl=targetMod.def.controls.find(c=>c.id===t.paramId);
if(!ctrl)return;
let v=ctrl.min+val*(ctrl.max-ctrl.min);
if(ctrl.step)v=Math.round(v/ctrl.step)*ctrl.step;
targetMod.setParam(t.paramId,v);
if(targetMod.el){
const slider=targetMod.el.querySelector('[data-ctrl="'+t.paramId+'"]');
if(slider&&slider.tagName==='INPUT'){
slider.value=v;
const valEl=slider.parentNode.querySelector('.ctrl-val');
if(valEl)valEl.textContent=ctrl.step?Math.round(v):v.toFixed(2);
}
// Visual feedback — pulse the bound knob
const cr=targetMod.el.querySelector('[data-ctrl-row="'+t.paramId+'"]');
if(cr){
cr.classList.add('auto-pulse');
setTimeout(()=>cr.classList.remove('auto-pulse'),120);
}
}
});
}
if(this.el){this.el.querySelectorAll('.auto-step').forEach((el,i)=>el.classList.toggle('current',i===s));}
}

addModule(type,x,y){

this.modules.forEach(m=>{
if(m.type==='automation'&&m._targets){

if(this.multiSelected.has(mod.id)){this.multiSelected.delete(mod.id);if(mod.el)mod.el.classList.remove('multi-selected');}
else{this.multiSelected.add(mod.id);if(mod.el)mod.el.classList.add('multi-selected');}

if(this.selectedModule?.el&&this.multiSelected.size>0)this.selectedModule.el.classList.remove('selected');
this.selectedModule=mod;if(mod.el)mod.el.classList.add('selected');
}else{
if(mod?.el)mod.el.classList.add('selected');

}
_clearMultiSelect(){
this.multiSelected.forEach(id=>{const m=this.modules.get(id);if(m?.el)m.el.classList.remove('multi-selected');});

_renderModule(mod){

const recCh=this.engine.loops.find(c=>c.recording);
if(recCh&&portId==='note'&&value>0){
const stepDur=0.25*(60/this.engine.tempo);
const loopDur=stepDur*recCh.loopLen;
let offset=(((time||this.engine.ctx.currentTime)-recCh.loopStartTime)%loopDur+loopDur)%loopDur;
if(recCh.quantize>0){const qStep=stepDur*recCh.quantize;offset=Math.round(offset/qStep)*qStep;offset=((offset%loopDur)+loopDur)%loopDur;}

}else if(recCh&&portId==='gate'&&value===0&&mod._lastFiredFreq){
const stepDur=0.25*(60/this.engine.tempo);
const loopDur=stepDur*recCh.loopLen;
let offset=(((time||this.engine.ctx.currentTime)-recCh.loopStartTime)%loopDur+loopDur)%loopDur;
if(recCh.quantize>0){const qStep=stepDur*recCh.quantize;offset=Math.round(offset/qStep)*qStep;offset=((offset%loopDur)+loopDur)%loopDur;}
recCh.events.push({type:'off',freq:mod._lastFiredFreq,offset});
}
}
this.connections.filter(c=>c.fromMod===mod.id&&c.fromPort===portId).forEach(c=>{

lenSel.addEventListener('change',e=>{e.stopPropagation();this.engine.setLoopLength(i,parseInt(e.target.value));this._updateLooperUI();});
strip.appendChild(lenSel);
// Vertical fader
const faderWrap=document.createElement('div');faderWrap.className='ch-fader-wrap';
const track=document.createElement('div');track.className='ch-fader-track';
const fill=document.createElement('div');fill.className='ch-fader-fill';fill.style.height='100%';
const thumb=document.createElement('div');thumb.className='ch-fader-thumb';thumb.style.bottom='0%';
track.appendChild(fill);track.appendChild(thumb);
faderWrap.appendChild(track);
strip.appendChild(faderWrap);
// Fader drag interaction
let dragging=false;
const setFromY=(clientY)=>{
const rect=track.getBoundingClientRect();
let v=1-Math.max(0,Math.min(1,(clientY-rect.top)/rect.height));
this.engine.setLoopVolume(i,v);
this._updateLooperUI();
};
track.addEventListener('mousedown',e=>{
e.stopPropagation();e.preventDefault();
dragging=true;track.classList.add('dragging');setFromY(e.clientY);
const move=ev=>{if(dragging)setFromY(ev.clientY);};
const up=()=>{dragging=false;track.classList.remove('dragging');window.removeEventListener('mousemove',move);window.removeEventListener('mouseup',up);};
window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
});
// Status + count
const status=document.createElement('div');status.className='ch-status';status.textContent='empty';
strip.appendChild(status);
const count=document.createElement('div');count.className='ch-count';count.textContent='0 ev';
strip.appendChild(count);
// Click anywhere on strip (except buttons) to select
strip.addEventListener('click',e=>{
if(e.target===num||e.target===recBtn||e.target===muteBtn||e.target===soloBtn||e.target===odBtn||e.target===qBtn||e.target===lenSel||e.target===track||e.target===fill||e.target===thumb)return;
this.engine.selectLoop(i);this._updateLooperUI();
});
// Clear button (small × at bottom)
const clrBtn=document.createElement('button');clrBtn.className='ch-btn clr';clrBtn.textContent='CLR';
clrBtn.title='Clear recorded loop on channel '+(i+1);
clrBtn.addEventListener('click',e=>{e.stopPropagation();this.engine.clearLoop(i);this._updateLooperUI();});
strip.appendChild(clrBtn);
// Unfreeze button (hidden by default, shown when channel has frozen modules)
const unfreezeBtn=document.createElement('button');unfreezeBtn.className='ch-unfreeze-btn';unfreezeBtn.textContent='❄';unfreezeBtn.title='Unfreeze modules sent to this channel';
unfreezeBtn.style.display='none';
unfreezeBtn.addEventListener('click',e=>{e.stopPropagation();this._unfreezeChannel(i);});
strip.appendChild(unfreezeBtn);
// Insert before "+" button if it exists
if(this._addBtnEl){console_el.insertBefore(strip,this._addBtnEl);}
else{console_el.appendChild(strip);}
this._looperEls.push({strip,num,led,recBtn,muteBtn,soloBtn,odBtn,qBtn,lenSel,track,fill,thumb,status,count,clrBtn,unfreezeBtn});
}
_updateLooperUI(){
if(!this._looperEls)return;
const anySolo=this.engine.loops.some(c=>c.solo);
this.engine.loops.forEach((ch,i)=>{
const els=this._looperEls[i];if(!els)return;
// Selected state
els.strip.classList.toggle('selected',this.engine.selectedLoop===i);
// Recording state
els.strip.classList.toggle('recording',ch.recording);
// Muted state (or implicitly muted by solo)
const implicitMute=ch.muted||(anySolo&&!ch.solo);
els.strip.classList.toggle('muted',implicitMute);
// LED states (priority: recording > armed > playing > empty)
els.led.className='ch-led';
if(ch.recording){els.led.classList.add('recording');}
else if(ch.armed){els.led.classList.add('armed');}
else if(ch.hasContent&&ch.events.length>0&&!implicitMute){els.led.classList.add('playing');}
// REC button state
els.recBtn.classList.toggle('armed',ch.armed||ch.recording);
// Mute button state
els.muteBtn.classList.toggle('active',ch.muted);
// Solo button state
els.soloBtn.classList.toggle('active',ch.solo);
// OD button state
els.odBtn.classList.toggle('active',ch.overdub);
// Q button state — show current quantize value
const qLabels={0:'Q',1:'16',2:'8',4:'4'};
els.qBtn.textContent=qLabels[ch.quantize||0];
els.qBtn.classList.toggle('active',ch.quantize>0);
// LEN dropdown
els.lenSel.value=String(ch.loopLen);
// Fader position
const volPct=Math.round((ch.volume||0)*100);
els.fill.style.height=volPct+'%';
els.thumb.style.bottom=volPct+'%';
// Status text
if(ch.recording){
const odTxt=ch.overdub?' ● OD':'';
els.status.textContent='● REC'+odTxt;els.status.className='ch-status rec';
}else if(ch.armed){
const odTxt=ch.overdub?' OD':'';
els.status.textContent='ARMED'+odTxt;els.status.className='ch-status rec';
}else if(ch.events.length>0){
if(ch.muted){els.status.textContent='MUTED';els.status.className='ch-status';}
else if(anySolo&&!ch.solo){els.status.textContent='SOLOED';els.status.className='ch-status';}
else{els.status.textContent='LOOP';els.status.className='ch-status loop';}
}else{
els.status.textContent='empty';els.status.className='ch-status';
}
// Count
els.count.textContent=ch.events.length+' ev';
// Unfreeze button visibility
const hasFrozen=this._frozenByChannel[i]&&this._frozenByChannel[i].size>0;
if(els.unfreezeBtn)els.unfreezeBtn.style.display=hasFrozen?'block':'none';
});
}
// Legacy back-compat — kept in case other code references it
_updateMidiRecCount(){this._updateLooperUI();}
// ===== KEYBOARD =====
_setupKeyboard(){
const bar=document.getElementById('keyboard-bar');const wrap=document.createElement('div');wrap.className='keys-wrap';
const freqs=[130.81,138.59,146.83,155.56,164.81,174.61,185,196,207.65,220,233.08,246.94,261.63,277.18,293.66,311.13,329.63,349.23,369.99,392,415.3,440,466.16,493.88,523.25,554.37,587.33,622.25,659.25,698.46,739.99,783.99,830.61,880,932.33,987.77];
const wW=22;let wI=0;
freqs.forEach((freq,i)=>{const n=i%12;const oct=3+Math.floor(i/12);const isBlack=[1,3,6,8,10].includes(n);const k=document.createElement('div');k.className='pkey '+(isBlack?'black':'white');k.dataset.freq=freq;
if(!isBlack){k.style.width=wW+'px';k.style.height='100%';k.style.position='absolute';k.style.left=(wI*wW)+'px';wI++;}else{k.style.width='14px';k.style.height='60%';k.style.position='absolute';k.style.left=((wI-1)*wW+wW-7)+'px';k.style.zIndex='2';}
k.addEventListener('mousedown',e=>{e.preventDefault();this.engine.noteOn(freq);k.classList.add('active');if(this.engine.midiRec.recording){k.classList.add('rec-flash');setTimeout(()=>k.classList.remove('rec-flash'),150);}});
k.addEventListener('mouseup',()=>{this.engine.noteOff(freq);k.classList.remove('active');});
k.addEventListener('mouseleave',()=>{this.engine.noteOff(freq);k.classList.remove('active');});
wrap.appendChild(k);});
wrap.style.width=(wI*wW)+'px';wrap.style.position='relative';bar.appendChild(wrap);
this._keyMap={'z':261.63,'s':277.18,'x':293.66,'d':311.13,'c':329.63,'v':349.23,'g':369.99,'b':392,'h':415.3,'n':440,'j':466.16,'m':493.88,',':523.25,'l':554.37,'.':587.33,';':622.25,'/':659.25,'q':523.25,'2':554.37,'w':587.33,'3':622.25,'e':659.25,'r':698.46,'5':739.99,'t':783.99,'6':830.61,'y':880};
this._activeKeys=new Set();
window.addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const f=this._keyMap[e.key];if(f&&!this._activeKeys.has(e.key)){this._activeKeys.add(e.key);this.engine.noteOn(f);const k=document.querySelector(`.pkey[data-freq="${f}"]`);if(k)k.classList.add('active');}if(e.key===' '){e.preventDefault();document.getElementById('btn-play').click();}});
window.addEventListener('keyup',e=>{const f=this._keyMap[e.key];if(f){this._activeKeys.delete(e.key);this.engine.noteOff(f);const k=document.querySelector(`.pkey[data-freq="${f}"]`);if(k)k.classList.remove('active');}});
}
// ===== SCOPE =====
_setupScope(){this._scopeCanvas=document.getElementById('scope-canvas');this._scopeCtx=this._scopeCanvas.getContext('2d');new ResizeObserver(entries=>{for(let e of entries){this._scopeCanvas.width=e.contentRect.width*devicePixelRatio;this._scopeCanvas.height=e.contentRect.height*devicePixelRatio;}}).observe(this._scopeCanvas.parentElement);}
_startScopeLoop(){const a=this.engine.analyser;const bl=a.frequencyBinCount;const td=new Uint8Array(bl);const fd=new Uint8Array(bl);const draw=()=>{requestAnimationFrame(draw);const c=this._scopeCanvas;const ctx=this._scopeCtx;const w=c.width,h=c.height;if(!w||!h)return;a.getByteTimeDomainData(td);a.getByteFrequencyData(fd);ctx.fillStyle='#08080d';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#00e8a2';ctx.lineWidth=1.5;ctx.beginPath();const sw=w/bl;for(let i=0;i<bl;i++){const v=td[i]/128;const y=v*h/2;if(!i)ctx.moveTo(0,y);else ctx.lineTo(i*sw,y);}ctx.stroke();const bars=32;const bw=w/bars;const step=Math.floor(bl/bars);for(let i=0;i<bars;i++){const val=fd[i*step]/255;const bh=val*h*0.4;ctx.fillStyle=`hsl(${160+val*60},100%,${40+val*30}%)`;ctx.fillRect(i*bw,h-bh,bw-1,bh);}};draw();}
// ===== DEFAULT PATCH =====
_addDefaultPatch(){
// ====================================================================
// AMBIENT STARTUP PATCH — slow, melodic, evolving
// Polyphonic Rhodes + sustained pad + sub bass + long FX tail
// Auto-starts on first user interaction (browser autoplay policy)
// ====================================================================

// --- Sequencer with slow A-minor pentatonic ambient pattern ---
const seq=this.addModule('sequencer',40,80);
// A minor pentatonic notes (Hz):
// A3=220, C4=261.63, D4=293.66, E4=329.63, G4=392,
// A4=440, C5=523.25, D5=587.33, E5=659.25, G5=783.99
const ambientPattern=[
[0,  220.00,'A3'],   // root — opens the phrase
[4,  329.63,'E4'],   // perfect fifth
[8,  440.00,'A4'],   // octave
[12, 523.25,'C5'],   // minor third — ambient color
[16, 659.25,'E5'],   // soaring fifth up high
[20, 587.33,'D5'],   // step down
[23, 329.63,'E4']    // resolve back
];
// Reset all 24 steps to inactive
for(let i=0;i<24;i++)seq._steps[i]={active:false,freq:440,name:'A4'};
// Apply ambient pattern
ambientPattern.forEach(([idx,freq,name])=>{seq._steps[idx]={active:true,freq,name};});
// Refresh sequencer UI to show new notes
if(seq.el){
seq.el.querySelectorAll('.seq-step').forEach((el,i)=>{
const s=seq._steps[i];
el.classList.toggle('active',s.active);
el.textContent=s.active?s.name:'';
el.title=s.active?s.name+' (scroll to change note)':'';
});
}

// --- Rhodes: main melodic voice (polyphonic electric piano with internal envelope) ---
const rhodes=this.addModule('rhodes',380,80);
rhodes.setParam('bell',0.45);
rhodes.setParam('tine',0.35);
rhodes.setParam('decay',5.0);      // long natural decay
rhodes.setParam('brightness',2800);
rhodes.setParam('tremolo',0.20);   // gentle tremolo
this.addConnection(seq.id,'note',rhodes.id,'note');
this.addConnection(seq.id,'gate',rhodes.id,'gate');

// --- Pad: slow evolving detuned sawtooth through lowpass filter ---
const padOsc=this.addModule('oscillator',380,360);
padOsc.setParam('wave','sawtooth');
padOsc.setParam('detune',9);
const padEnv=this.addModule('envelope',620,360);
padEnv.setParam('attack',2.8);     // very slow swell
padEnv.setParam('decay',1.2);
padEnv.setParam('sustain',0.55);
padEnv.setParam('release',6.0);    // long release tail
const padFlt=this.addModule('filter',620,560);
padFlt.setParam('type','lowpass');
padFlt.setParam('cutoff',750);
padFlt.setParam('resonance',2.5);
const padVCA=this.addModule('gain',860,460);
padVCA.setParam('gain',0);         // base gain 0; envelope adds 0→1 via CV
// Enable CV input gain so envelope actually modulates the VCA (input gain defaults to 0)
if(padVCA.inputNodes.cv)padVCA.inputNodes.cv.gain.value=1.0;

// --- Slow LFO sweeping pad filter cutoff for evolving texture ---
const lfo=this.addModule('lfo',380,620);
lfo.setParam('wave','sine');
lfo.setParam('rate',0.07);         // ~14s period — very slow
lfo.setParam('depth',1);           // full LFO amplitude
// Enable cutoff_cv input gain so LFO actually modulates cutoff (±500 Hz sweep at depth=1)
if(padFlt.inputNodes.cutoff_cv)padFlt.inputNodes.cutoff_cv.gain.value=500;

// Pad wiring
this.addConnection(seq.id,'note',padOsc.id,'freq');
this.addConnection(seq.id,'gate',padEnv.id,'gate');
this.addConnection(padOsc.id,'audio',padFlt.id,'audio');
this.addConnection(padEnv.id,'cv',padVCA.id,'cv');
this.addConnection(padFlt.id,'audio',padVCA.id,'audio');
this.addConnection(lfo.id,'cv',padFlt.id,'cutoff_cv');

// --- Sub bass: follows sequencer root note ---
const bass=this.addModule('bass',380,780);
bass.setParam('wave','sine');
bass.setParam('sub',0.7);
bass.setParam('cutoff',280);
bass.setParam('resonance',1.5);
bass.setParam('drive',0.08);
bass.setParam('octave',-2);        // deep sub
this.addConnection(seq.id,'note',bass.id,'note');
this.addConnection(seq.id,'gate',bass.id,'gate');

// --- Mixer: combine rhodes + pad + bass ---
const mix=this.addModule('mixer',1090,360);
this.addConnection(rhodes.id,'audio',mix.id,'in1');
this.addConnection(padVCA.id,'audio',mix.id,'in2');
this.addConnection(bass.id,'audio',mix.id,'in3');

// --- FX chain: delay → reverb → shimmer → output (long ambient tail) ---
const dly=this.addModule('delay',1290,260);
dly.setParam('time',0.5);          // 500ms echo
dly.setParam('feedback',0.42);     // long echoes
dly.setParam('mix',0.35);
const rvb=this.addModule('reverb',1290,460);
rvb.setParam('decay',6.0);         // very long reverb
rvb.setParam('mix',0.45);
const shimmer=this.addModule('shimmer',1490,360);
shimmer.setParam('pitch',12);      // +1 octave shimmer
shimmer.setParam('decay',5.0);
shimmer.setParam('feedback',0.32);
shimmer.setParam('mix',0.32);
const out=this.addModule('output',1690,360);
out.setParam('volume',0.75);

this.addConnection(mix.id,'audio',dly.id,'audio');
this.addConnection(dly.id,'audio',rvb.id,'audio');
this.addConnection(rvb.id,'audio',shimmer.id,'audio');
this.addConnection(shimmer.id,'audio',out.id,'audio_l');
this.addConnection(shimmer.id,'audio',out.id,'audio_r');

// --- Slow ambient tempo ---
this.engine.tempo=62;
const bpmInput=document.getElementById('bpm');
if(bpmInput)bpmInput.value=62;

// Position workspace to show the patch
this.wsPanX=15;this.wsPanY=15;this._updateTransform();

// ====================================================================
// AUTO-PLAY: browsers block autoplay until user interacts.
// Listen for first click / keydown / touch anywhere and start transport.
// ====================================================================
const tryStartAmbient=()=>{
if(this.engine.isPlaying)return;
this.engine.resume().then(()=>{
if(this.engine.isPlaying)return;        // user may have hit stop
this.engine.startTransport();
const pb=document.getElementById('btn-play');
if(pb){pb.classList.add('active');pb.style.animation='';}
this.modules.forEach(m=>{if(m.type==='automation'&&m._updateHint)m._updateHint();});
});
};
const firstGesture=()=>{
tryStartAmbient();
document.removeEventListener('click',firstGesture);
document.removeEventListener('keydown',firstGesture);
document.removeEventListener('touchstart',firstGesture);
};
document.addEventListener('click',firstGesture);
document.addEventListener('keydown',firstGesture);
document.addEventListener('touchstart',firstGesture);

// Pulse the Play button as a hint
const pb=document.getElementById('btn-play');
if(pb){
pb.style.animation='recPulse 1.6s ease-in-out infinite';
const stopHint=()=>{
pb.style.animation='';
document.removeEventListener('click',stopHint);
document.removeEventListener('keydown',stopHint);
};
document.addEventListener('click',stopHint);
document.addEventListener('keydown',stopHint);
}
}
}
window.addEventListener('DOMContentLoaded',()=>{window.app=new App();app.init();});
</script>
