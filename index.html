<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IBONARIUM · TELE HUB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#020204;
    --border:rgba(0,255,255,.15);
    --font:'Outfit',sans-serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    background:var(--bg);
    overflow-x:hidden;
    font-family:var(--font);
    scroll-behavior:smooth;
}

/* MAIN WRAPPER */
.wrapper{
    width:100%;
    display:flex;
    flex-direction:column;
}

/* SECTIONS */
.section{
    width:100%;
    position:relative;
    background:#000;
}

/* FIRST SITE */
/* ВИСОТА ВЕЛИКА ЩОБ НІЧОГО НЕ ОБРІЗАЛО */
#telescope{
    height:5200px;
}

/* SECOND SITE */
#museum{
    height:4200px;
}

/* IFRAME */
iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
    background:#000;
}

/* SCROLLBAR */
body::-webkit-scrollbar{
    width:8px;
}

body::-webkit-scrollbar-track{
    background:#050505;
}

body::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:20px;
}

/* MOBILE */
@media(max-width:768px){

    #telescope{
        height:7600px;
    }

    #museum{
        height:6200px;
    }

}

</style>
</head>

<body>

<div class="wrapper">

    <!-- SITE 1 -->
    <section class="section" id="telescope">

        <iframe
            src="https://lavandaaudit.github.io/tele.lab.telescope/"
            title="Tele Lab Telescope"
            scrolling="no">
        </iframe>

    </section>

    <!-- SITE 2 -->
    <section class="section" id="museum">

        <iframe
            src="https://lavandaaudit.github.io/history.musem.ibonarium/"
            title="History Museum Ibonarium"
            scrolling="no">
        </iframe>

    </section>

</div>

</body>
</html>
