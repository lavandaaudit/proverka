<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM Fog Mini</title>

<style>

body{
    margin:0;
    background:#03060b;
    height:200vh;
}

/* ===== PANEL TOP LEFT ===== */

#ibonMini{
    position:fixed;
    left:10px;
    top:10px;
    width:170px;
    height:170px;
    z-index:9999;
    pointer-events:none;
}

/* CANVAS */

#ibonCanvas{
    width:100%;
    height:100%;
    display:block;
    border-radius:14px;
    background:rgba(6,12,22,0.35);
    backdrop-filter: blur(8px);
}

/* TEXT */

#ibonText{
    position:absolute;
    left:8px;
    top:6px;
    font-size:10px;
    color:#a8c0ff;
    font-family:monospace;
    opacity:0.75;
    line-height:1.25;
}

</style>
</head>

<body>

<div id="ibonMini">
    <canvas id="ibonCanvas"></canvas>
    <div id="ibonText">
        E:0<br>
        C:0<br>
        R:0<br>
        V:0
    </div>
</div>

<script>

/* ===== CANVAS ===== */

const canvas = document.getElementById("ibonCanvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener("resize", resize);

/* ===== STATE ===== */

let state = {x:0, y:0};
let prevState = {x:0, y:0};
let trajectory = [];

let fogParticles = [];

let t = 0;

/* ===== METRIC ===== */

let metric = [
    [1, 0.28],
    [0.28, 1]
];

/* ===== INIT FOG ===== */

for(let i=0;i<35;i++){
    fogParticles.push({
        x: Math.random(),
        y: Math.random(),
        vx: (Math.random()-0.5)*0.001,
        vy: (Math.random()-0.5)*0.001,
        size: Math.random()*2+1
    });
}

/* ===== UPDATE ===== */

function updateState(){

    prevState = {...state};

    /* ПОВІЛЬНІШИЙ ЖИВИЙ РУХ */

    state.x =
        Math.sin(t*0.35) +
        Math.sin(t*0.08)*0.7;

    state.y =
        Math.cos(t*0.28) +
        Math.sin(t*0.6)*0.35;

    trajectory.push({...state});
    if(trajectory.length > 220) trajectory.shift();

    t += 0.01;
}

/* ===== METRICS ===== */

function energy(){
    return (
        metric[0][0]*state.x*state.x +
        metric[1][1]*state.y*state.y +
        metric[0][1]*state.x*state.y
    );
}

function curvature(){
    return Math.abs(metric[0][1]);
}

function speed(){
    return Math.sqrt(
        (state.x-prevState.x)**2 +
        (state.y-prevState.y)**2
    );
}

function risk(){
    return curvature()*0.6 + speed()*0.4;
}

/* ===== DRAW ===== */

function draw(){

    /* ТУМАННИЙ СЛІД */

    ctx.fillStyle="rgba(3,6,11,0.12)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    let cx = canvas.width/2;
    let cy = canvas.height/2;
    let scale = canvas.width*0.30;

    /* FOG PARTICLES */

    fogParticles.forEach(p=>{
        p.x += p.vx;
        p.y += p.vy;

        if(p.x<0||p.x>1) p.vx*=-1;
        if(p.y<0||p.y>1) p.vy*=-1;

        ctx.beginPath();
        ctx.arc(
            p.x*canvas.width,
            p.y*canvas.height,
            p.size,
            0,
            Math.PI*2
        );
        ctx.fillStyle="rgba(140,170,255,0.06)";
        ctx.fill();
    });

    /* TRAJECTORY */

    ctx.beginPath();
    trajectory.forEach((p,i)=>{
        let x = cx + p.x*scale;
        let y = cy + p.y*scale;

        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    });
    ctx.strokeStyle="rgba(150,180,255,0.35)";
    ctx.lineWidth=1.6;
    ctx.stroke();

    /* CORE POINT */

    ctx.beginPath();
    ctx.arc(
        cx + state.x*scale,
        cy + state.y*scale,
        3,
        0,
        Math.PI*2
    );
    ctx.fillStyle="rgba(180,200,255,0.9)";
    ctx.fill();
}

/* ===== LOOP ===== */

const text = document.getElementById("ibonText");

function loop(){

    updateState();
    draw();

    text.innerHTML =
        "E:" + energy().toFixed(2) + "<br>" +
        "C:" + curvature().toFixed(2) + "<br>" +
        "R:" + risk().toFixed(2) + "<br>" +
        "V:" + speed().toFixed(2);

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
