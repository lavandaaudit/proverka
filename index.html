<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM — Жива Павутина</title>

<style>
body{
    margin:0;
    background: radial-gradient(ellipse at center,#0a0015 0%,#000002 68%,#000 100%);
    color:#d0c8ff;
    font-family:'Segoe UI',system-ui,sans-serif;
    overflow:hidden;
}
canvas{display:block;mix-blend-mode:screen;}

#ui{
    position:absolute;
    top:14px;
    left:16px;
    pointer-events:none;
    font-size:0.82em;
    line-height:1.38;
    text-shadow:0 0 9px #1a0033,0 0 18px #330066;
}

#ui h1{
    margin:0 0 6px 0;
    font-size:1.24em;
    background:linear-gradient(90deg,#a78dff,#ff78d2,#4effff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.civ-a{color:#9d8aff;}
.civ-b{color:#ff5ab5;}
.civ-n{color:#5efcff;}

.timer{font-family:monospace;}
</style>
</head>

<body>
<canvas id="c"></canvas>

<div id="ui">
<h1>🌌 IBONARIUM</h1>

<div>
Kp: <span id="kp">2.3</span><br>
Flares: <span id="flare">None</span><br>
Protons: <span id="proton">low</span><br>
Wind: <span id="wind">380</span><br>
Bz: <span id="bz">1.2</span><br>
Dst: <span id="dst">-18</span>
</div>

<br>

<span class="civ-a">Order</span> <span id="pct-a">0%</span> |
<span class="civ-b">Flux</span> <span id="pct-b">0%</span> |
<span class="civ-n">Nebula</span> <span id="pct-n">0%</span>

<br>
Активних зв’язків: <span id="edges">0</span>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

let w,h;
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;}
resize();addEventListener('resize',resize);

const NODES=520,MAX_DIST=168;
const nodes=[],edges=[];

class Node{
 constructor(x,y){
  this.x=x;this.y=y;
  this.owner=null;
  this.phase=Math.random()*6.28;
  this.strength=1;
 }
}

for(let i=0;i<NODES;i++){
 nodes.push(new Node(Math.random()*w,Math.random()*h));
}

for(let i=0;i<NODES;i++){
 for(let j=i+1;j<NODES;j++){
  const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);
  if(d<MAX_DIST)edges.push({a:i,b:j,baseAlpha:.1});
 }
}

nodes[0].owner='A';
nodes[1].owner='B';

let space={kp:2.3,wind:380,bz:1,proton:8,flare:'None'};

async function updateSpace(){
 try{
  const r=await fetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json');
  const d=await r.json();
  space.kp=parseFloat(d[d.length-1][1])||space.kp;

  const w=await fetch('https://services.swpc.noaa.gov/products/solar-wind/plasma-1-minute.json');
  const wd=await w.json();
  const L=wd[wd.length-1];
  space.wind=parseFloat(L[2])||space.wind;
  space.bz=parseFloat(L[3])||space.bz;

  document.getElementById('kp').textContent=space.kp.toFixed(1);
  document.getElementById('wind').textContent=Math.round(space.wind);
  document.getElementById('bz').textContent=space.bz.toFixed(1);
 }catch{}
}
setInterval(updateSpace,60000);
updateSpace();

function growFrom(i,civ,r){
 const o=nodes[i];
 nodes.forEach(n=>{
  if(n.owner)return;
  if(Math.hypot(n.x-o.x,n.y-o.y)<MAX_DIST*r){
   if(Math.random()<0.2)n.owner=civ;
  }
 });
}

function simulate(){
 nodes.forEach((n,i)=>{
  if(n.owner==='A'&&Math.random()<0.006*(1-space.kp/9))growFrom(i,'A',1.2);
  if(n.owner==='B'&&Math.random()<0.015)growFrom(i,'B',2);
 });

 // --- NEBULA LOGIC ---
 const nebulaPower=
  (space.kp/9)+
  (space.bz<0?Math.abs(space.bz)/10:0)+
  ((space.wind-350)/500);

 if(nebulaPower>0.6){
  nodes.forEach((n,i)=>{
   if(Math.random()<0.01*nebulaPower){
    n.owner='N';
    growFrom(i,'N',2.5);
   }
  });
 }

 // Nebula dissolves others
 nodes.forEach(n=>{
  if(n.owner==='N'){
   nodes.forEach(t=>{
    if((t.owner==='A'||t.owner==='B')&&
       Math.hypot(n.x-t.x,n.y-t.y)<60){
        if(Math.random()<0.02)t.owner=null;
    }
   });
  }
 });
}

function draw(){
 ctx.fillStyle='rgba(0,0,10,0.2)';
 ctx.fillRect(0,0,w,h);

 edges.forEach(e=>{
  const n1=nodes[e.a],n2=nodes[e.b];
  if(!n1.owner&&!n2.owner)return;

  let col='#888';

  const o=n1.owner||n2.owner;
  if(o==='A')col='rgba(160,140,255,.5)';
  if(o==='B')col='rgba(255,90,190,.5)';
  if(o==='N')col='rgba(90,255,255,.5)';

  ctx.strokeStyle=col;
  ctx.beginPath();
  ctx.moveTo(n1.x,n1.y);
  ctx.lineTo(n2.x,n2.y);
  ctx.stroke();
 });

 let ca=0,cb=0,cn=0;

 nodes.forEach(n=>{
  if(!n.owner)return;
  if(n.owner==='A')ctx.fillStyle='#c4b8ff',ca++;
  if(n.owner==='B')ctx.fillStyle='#ff9edc',cb++;
  if(n.owner==='N')ctx.fillStyle='#7fffff',cn++;

  ctx.beginPath();
  ctx.arc(n.x,n.y,2,0,6.28);
  ctx.fill();
 });

 const t=ca+cb+cn||1;
 pct('pct-a',ca,t);
 pct('pct-b',cb,t);
 pct('pct-n',cn,t);

 document.getElementById('edges').textContent=
 edges.filter(e=>nodes[e.a].owner||nodes[e.b].owner).length;
}

function pct(id,v,t){
 document.getElementById(id).textContent=(v/t*100).toFixed(1)+'%';
}

function loop(){
 simulate();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
