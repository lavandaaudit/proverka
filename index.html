<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IBONIRIUM · EXP-03 · Galactic Terrarium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
}
canvas{position:fixed;inset:0}
#info{
  position:fixed;
  bottom:12px;left:12px;
  font-family:monospace;
  font-size:12px;
  color:#caffef;
  opacity:.85;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<canvas id="scene"></canvas>

<div id="info">
<b>IBONIRIUM · GALACTIC TERRARIUM</b><br>
mode: orbital nebulae<br>
state: compression / expansion
</div>

<script>
const starsC = document.getElementById('stars');
const sceneC = document.getElementById('scene');
const sctx = starsC.getContext('2d');
const ctx = sceneC.getContext('2d');

function resize(){
  starsC.width = sceneC.width = innerWidth;
  starsC.height = sceneC.height = innerHeight;
}
addEventListener('resize', resize);
resize();

/* ---------- BACKGROUND STARS (PARALLAX) ---------- */
const stars = Array.from({length:420},()=>({
  x:Math.random(), y:Math.random(),
  z:Math.random()*0.8+0.2
}));

function drawStars(){
  sctx.clearRect(0,0,starsC.width,starsC.height);
  stars.forEach(st=>{
    sctx.globalAlpha = 0.15 + st.z*0.5;
    sctx.fillStyle="#fff";
    sctx.beginPath();
    sctx.arc(
      st.x*starsC.width,
      st.y*starsC.height,
      st.z*1.6,
      0,Math.PI*2
    );
    sctx.fill();
  });
  sctx.globalAlpha = 1;
}

/* ---------- COSMIC BREATH ---------- */
function cosmicBreath(){
  return Math.sin(Date.now()*0.000025);
}

/* ---------- COLORS ---------- */
const PALETTE = [
  'rgba(255,200,140,',
  'rgba(180,220,255,',
  'rgba(200,180,255,',
  'rgba(255,170,210,',
  'rgba(170,255,210,'
];

/* ---------- NEBULA ---------- */
class Nebula{
  constructor(radius){
    this.angle = Math.random()*Math.PI*2;
    this.dist = radius * (0.6 + Math.random()*0.8);
    this.size = 18 + Math.random()*26;
    this.speed = (Math.random()*0.5+0.2)*0.00025;
    this.depth = Math.random()*0.8 + 0.2;
    this.color = PALETTE[Math.floor(Math.random()*PALETTE.length)];
  }
  update(){
    this.angle += this.speed * this.depth;
  }
  draw(cx,cy,pulse){
    const x = cx + Math.cos(this.angle)*this.dist*pulse;
    const y = cy + Math.sin(this.angle)*this.dist*pulse;
    ctx.globalAlpha = 0.08 + this.depth*0.25;
    ctx.fillStyle = this.color + (0.35*this.depth)+')';
    ctx.beginPath();
    ctx.arc(x,y,this.size*this.depth,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ---------- GALAXY ---------- */
class Galaxy{
  constructor(x,y){
    this.baseX=x; this.baseY=y;
    this.z = Math.random()*0.6+0.4;
    this.radius = (70 + Math.random()*50)*this.z;
    this.spin = (Math.random()*0.4+0.2)*0.00018;
    this.angle = Math.random()*Math.PI*2;
    this.color = PALETTE[Math.floor(Math.random()*PALETTE.length)]+'0.7)';
    this.arms = 3 + Math.floor(Math.random()*3);
    this.phase = Math.random()*Math.PI*2;
    this.nebulae = Array.from({length:8+Math.floor(Math.random()*6)},
      ()=>new Nebula(this.radius*1.2)
    );
  }

  position(){
    const b = cosmicBreath();
    const shift = b * 140 * this.z;
    return {
      x: this.baseX + Math.cos(this.phase)*shift,
      y: this.baseY + Math.sin(this.phase)*shift
    };
  }

  update(){
    this.angle += this.spin;
    this.nebulae.forEach(n=>n.update());
  }

  draw(){
    const pos = this.position();
    const pulse = 1 + cosmicBreath()*0.22;

    /* nebulae first (depth) */
    this.nebulae.forEach(n=>n.draw(pos.x,pos.y,pulse));

    /* spiral arms */
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 0.9*this.z;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 14*this.z;

    for(let a=0;a<this.arms;a++){
      ctx.beginPath();
      for(let i=0;i<160;i++){
        const t=i/160;
        const r=this.radius*t*pulse;
        const ang=t*5*Math.PI + this.angle + a*(Math.PI*2/this.arms);
        const x=pos.x + Math.cos(ang)*r;
        const y=pos.y + Math.sin(ang)*r;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
    }

    /* core */
    ctx.shadowBlur = 24*this.z;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(pos.x,pos.y,6*this.z*pulse,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

/* ---------- GALAXY SET ---------- */
const galaxies = Array.from({length:7},()=>new Galaxy(
  innerWidth*0.25 + Math.random()*innerWidth*0.5,
  innerHeight*0.25 + Math.random()*innerHeight*0.5
));

/* ---------- GRAVITY LINKS ---------- */
function drawLinks(){
  const b=Math.abs(cosmicBreath());
  ctx.strokeStyle=`rgba(180,220,255,${0.05+0.18*b})`;
  ctx.lineWidth=0.6;
  for(let i=0;i<galaxies.length;i++){
    for(let j=i+1;j<galaxies.length;j++){
      const p1=galaxies[i].position();
      const p2=galaxies[j].position();
      const d=Math.hypot(p1.x-p2.x,p1.y-p2.y);
      if(d<520){
        ctx.beginPath();
        ctx.moveTo(p1.x,p1.y);
        ctx.lineTo(p2.x,p2.y);
        ctx.stroke();
      }
    }
  }
}

/* ---------- LOOP ---------- */
function loop(){
  drawStars();
  ctx.clearRect(0,0,sceneC.width,sceneC.height);

  galaxies.forEach(g=>{
    g.update();
    g.draw();
  });
  drawLinks();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
