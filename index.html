<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ibonarium flow</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

html,body{
  width:100%;
  background:#000;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial,sans-serif;
}

/* ===== FIX START POSITION ===== */
body{
  position:relative;
}

/* ===== SECTION ===== */
.section{
  position:relative;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow:hidden;
}

/* ===== IFRAMES ===== */
.frame{
  width:100%;
  border:none;
  display:block;
  background:#000;
}

/* ===== FIRST PAGE ===== */
#tvFrame{
  height:100vh;
}

/* ===== SECOND PAGE ===== */
#museumFrame{
  height:2200px;
}

/* ===== SOFT TRANSITION ===== */
.fade{
  position:relative;
}

.fade::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-1px;
  width:100%;
  height:120px;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0),
    rgba(0,0,0,0.5),
    #000
  );
  z-index:5;
}

/* ===== MOBILE ===== */
@media(max-width:900px){

  #tvFrame{
    height:100svh;
  }

  #museumFrame{
    height:2600px;
  }

}
</style>
</head>

<body>

<!-- ===== FIRST PAGE ===== -->
<section class="section fade">
  <iframe
    id="tvFrame"
    class="frame"
    src="https://lavandaaudit.github.io/tv.2/"
    loading="eager"
    allowfullscreen>
  </iframe>
</section>

<!-- ===== SECOND PAGE ===== -->
<section class="section">
  <iframe
    id="museumFrame"
    class="frame"
    src="https://lavandaaudit.github.io/history.musem.ibonarium/"
    loading="lazy"
    allowfullscreen>
  </iframe>
</section>

<script>
/* ===== ALWAYS START FROM TOP ===== */

if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

window.onload = () => {
  window.scrollTo(0, 0);
};

/* ===== ADAPTIVE HEIGHT ===== */

const museumFrame = document.getElementById("museumFrame");

function adaptiveMuseumHeight(){

  if(window.innerWidth < 900){
    museumFrame.style.height = "2600px";
  }else{
    museumFrame.style.height = "2200px";
  }

}

adaptiveMuseumHeight();

window.addEventListener("resize", adaptiveMuseumHeight);

/* ===== SOFT PARALLAX ===== */

window.addEventListener("scroll",()=>{

  const scrollY = window.scrollY;

  document.getElementById("tvFrame").style.transform =
    `translateY(${scrollY * 0.02}px)`;

});
</script>

</body>
</html>
